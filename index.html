<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking War: Rune Master</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --gold: #f1c40f; --red: #e74c3c; --green: #2ecc71; }
        body { background: #0a0a0a; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        
        .arena { width: 100%; height: 220px; position: relative; background: #1a1a1a; border-bottom: 3px solid #333; }
        #enemy-img { width: 150px; height: 150px; position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); transition: 0.3s; }
        
        .bars { position: absolute; top: 10px; width: 90%; left: 5%; display: flex; flex-direction: column; gap: 8px; }
        .bar-wrap { height: 16px; background: #222; border: 1px solid #444; border-radius: 8px; overflow: hidden; position: relative; }
        .bar-fill { height: 100%; width: 100%; transition: 0.4s; }
        .bar-label { position: absolute; width: 100%; text-align: center; font-size: 10px; font-weight: bold; line-height: 16px; text-shadow: 1px 1px 2px black; }
        
        #enemy-hp { background: var(--red); }
        #player-hp { background: var(--green); }

        #grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 10px; background: #111; border-radius: 8px; margin-top: 10px; }
        .cell { width: 45px; height: 45px; border-radius: 6px; background-size: cover; cursor: pointer; transition: 0.2s; }
        .selected { outline: 3px solid var(--gold); transform: scale(1.1); z-index: 5; }
        
        .controls { width: 90%; margin-top: 15px; }
        #super-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #333; color: #666; font-weight: bold; text-transform: uppercase; }
        #super-btn.ready { background: linear-gradient(#e67e22, #d35400); color: white; box-shadow: 0 0 15px gold; cursor: pointer; }

        @keyframes shake { 0%,100% {transform:translateX(0)} 25% {transform:translateX(-5px)} 75% {transform:translateX(5px)} }
        .shaking { animation: shake 0.2s infinite; }
    </style>
</head>
<body>

    <div class="arena" id="arena">
        <div class="bars">
            <div class="bar-wrap"><div id="enemy-hp" class="bar-fill"></div><div class="bar-label">ВРАГ</div></div>
            <div class="bar-wrap"><div id="player-hp" class="bar-fill"></div><div class="bar-label">ВАШЕ ЗДОРОВЬЕ</div></div>
        </div>
        <img id="enemy-img" src="mob1.png">
    </div>

    <div id="grid"></div>

    <div class="controls">
        <div style="font-size:10px; margin-bottom:5px; color: var(--gold);">ЭНЕРГИЯ (ТОЛЬКО КРАСНЫЕ РУНЫ)</div>
        <div class="bar-wrap" style="height:12px; border-color: var(--gold);"><div id="energy-fill" class="bar-fill" style="background:var(--gold); width:0%;"></div></div>
        <button id="super-btn" onclick="useSuper()">УДАР МОЛОТОМ ТОРА</button>
    </div>

<script>

    const runes = ['rune1.png', 'rune2.png', 'rune3.png', 'rune4.png', 'rune5.png'];

    function init() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        state.board = [];
        for (let i = 0; i < 49; i++) {
            let r = Math.floor(Math.random() * 5);
            let cell = document.createElement('div');
            cell.className = 'cell';
            cell.style.backgroundImage = `url(${runes[r]})`;
            cell.dataset.id = i;
            cell.dataset.type = r;
            cell.onclick = () => select(cell);
            grid.appendChild(cell);
            state.board.push(r);
        }
    }
