<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Admin Fixed</title>
    <style>
        :root { --gold: #f1c40f; --red: #e74c3c; --green: #2ecc71; --blue: #3498db; }
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 0; text-align: center; touch-action: manipulation; }
        
        /* Админка поверх всего, чтобы не двигать интерфейс */
        #admin-panel { display: none; background: #c0392b; padding: 5px; font-size: 12px; position: sticky; top: 0; z-index: 1000; }
        .admin-btn { background: #fff; color: #000; border: none; padding: 3px 10px; margin: 0 5px; border-radius: 4px; font-weight: bold; }

        .header { background: #1a1a1a; padding: 10px; border-bottom: 2px solid #333; display: flex; justify-content: space-around; align-items: center; }
        .lvl-badge { color: var(--gold); font-weight: bold; font-size: 18px; }
        
        .arena { height: 140px; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .hp-bar { width: 90%; height: 10px; background: #333; margin: 4px; border-radius: 5px; overflow: hidden; border: 1px solid #444; }
        .fill { height: 100%; transition: 0.4s; width: 100%; }
        #mob { height: 80px; width: auto; z-index: 2; }

        /* Центрированное поле */
        #grid-container { display: flex; justify-content: center; padding: 10px 0; }
        #grid { display: grid; grid-template-columns: repeat(7, 42px); grid-template-rows: repeat(7, 42px); gap: 4px; }
        .cell { width: 42px; height: 42px; background-size: cover; background-position: center; border-radius: 4px; border: 1px solid #333; box-sizing: border-box; }
        .sel { outline: 3px solid #fff; transform: scale(0.9); z-index: 5; box-shadow: 0 0 10px var(--gold); }
        
        .footer { padding: 10px; }
        .btn { width: 90%; padding: 12px; border: none; border-radius: 8px; background: #444; color: #888; font-weight: bold; font-size: 16px; }
        .ready { background: linear-gradient(orange, darkorange) !important; color: #fff !important; box-shadow: 0 0 15px gold; }

        #ban-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #msg { position: absolute; top: 40%; width: 100%; font-weight: bold; background: rgba(0,0,0,0.95); display: none; padding: 20px 0; z-index: 100; color: gold; font-size: 20px; }
    </style>
</head>
<body>

    <div id="admin-panel">
        ADM: <button class="admin-btn" onclick="changeLvl(-1)">-1 УР</button>
        <button class="admin-btn" onclick="changeLvl(1)">+1 УР</button>
        <button class="admin-btn" onclick="s.en=100;draw();">MAX ⚡</button>
    </div>

    <div id="ban-screen">
        <h2 style="color: var(--red);">ВЫ РАНЕНЫ</h2>
        <div id="timer" style="font-size: 40px; color: gold; margin-bottom: 20px;">60:00</div>
        <button id="admin-skip" style="display:none; padding:15px; background:green; color:white; border:none; border-radius:10px; font-weight:bold;" onclick="skipBan()">АДМИН: ВОСКРЕСНУТЬ</button>
    </div>

    <div class="header">
        <div id="best-display" style="font-size: 12px; opacity: 0.6;" onclick="adminClick()">РЕКОРД: 1</div>
        <div id="lvl-display" class="lvl-badge">УРОВЕНЬ 1</div>
    </div>

    <div class="arena">
        <div id="msg"></div>
        <div class="hp-bar"><div id="ehp" class="fill" style="background: var(--red);"></div></div>
        <img id="mob" src="mob1.png" onerror="this.src='https://via.placeholder.com/80/red?text=MOB'">
        <div class="hp-bar"><div id="php" class="fill" style="background: var(--green);"></div></div>
    </div>

    <div id="grid-container">
        <div id="grid"></div>
    </div>

    <div class="footer">
        <div style="height: 6px; width: 90%; background: #222; margin: 0 auto 10px; border-radius: 3px; overflow: hidden;">
            <div id="en-fill" style="width: 0%; height: 100%; background: var(--blue); transition: 0.3s;"></div>
        </div>
        <button id="s-btn" class="btn" onclick="useSuper()">УДАР МОЛОТОМ</button>
    </div>

<script>
    const runes = ['rune1.png', 'rune2.png', 'rune3.png', 'rune4.png', 'rune5.png'];
    const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#95a5a6'];
    
    let adminHits = 0;
    let isAdmin = localStorage.getItem('v_admin') === 'true';
    let audioCtx = null;

    let s = {
        lvl: parseInt(localStorage.getItem('v_lvl')) || 1,
        best: parseInt(localStorage.getItem('v_best')) || 1,
        en: parseInt(localStorage.getItem('v_en')) || 0,
        hp: 100, ehp: 100, lock: false, stun: 0, board: [], sel: null
    };

    function playSound(freq, type = 'sine', duration = 0.1) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    function adminClick() {
        adminHits++;
        if (adminHits >= 5) {
            isAdmin = true;
            localStorage.setItem('v_admin', 'true');
            showAdminUI();
            alert("ADMIN MODE ON");
        }
    }

    function showAdminUI() {
        if (isAdmin) {
            document.getElementById('admin-panel').style.display = 'block';
            document.getElementById('admin-skip').style.display = 'block';
        }
    }

    function changeLvl(val) {
        s.lvl = Math.max(1, s.lvl + val);
        saveAll();
        init();
    }

    function skipBan() {
        localStorage.removeItem('v_ban');
        location.reload();
    }

    function saveAll() {
        localStorage.setItem('v_lvl', s.lvl);
        localStorage.setItem('v_en', s.en);
        if (s.lvl > s.best) { s.best = s.lvl; localStorage.setItem('v_best', s.best); }
    }

    function checkBan() {
        const ban = localStorage.getItem('v_ban');
        if (ban && Date.now() < ban) {
            document.getElementById('ban-screen').style.display = 'flex';
            showAdminUI();
            setInterval(() => {
                let d = ban - Date.now();
                if (d <= 0) location.reload();
                let m = Math.floor(d/60000), sc = Math.floor((d%60000)/1000);
                document.getElementById('timer').innerText = `${m}:${sc<10?'0':''}${sc}`;
            }, 1000);
            return true;
        }
        return false;
    }

    function init() {
        if (checkBan()) return;
        showAdminUI();
        saveAll();
        
        document.getElementById('lvl-display').innerText = "УРОВЕНЬ " + s.lvl;
        document.getElementById('best-display').innerText = "РЕКОРД: " + s.best;
        
        let bonus = s.lvl > 10 ? (s.lvl - 10) * 60 + 200 : s.lvl * 25;
        s.maxEHP = 100 + bonus;
        s.ehp = s.maxEHP;
        s.hp = 100;

        const g = document.getElementById('grid');
        g.innerHTML = ''; 
        s.board = [];
        for (let i = 0; i < 49; i++) {
            let t = Math.floor(Math.random() * 5);
            s.board.push(t);
            let c = document.createElement('div');
            c.className = 'cell';
            c.id = 'c' + i;
            c.onclick = () => touch(i);
            g.appendChild(c);
        }
        draw();
    }

    function draw() {
        s.board.forEach((t, i) => {
            const c = document.getElementById('c' + i);
            if (!c) return;
            if (t === -1) {
                c.style.backgroundImage = 'none';
                c.style.backgroundColor = '#111';
            } else {
                c.style.backgroundColor = colors[t];
                c.style.backgroundImage = "url(" + runes[t] + ")";
            }
            c.classList.toggle('sel', s.sel === i);
        });
        document.getElementById('php').style.width = s.hp + '%';
        document.getElementById('ehp').style.width = (s.ehp / s.maxEHP * 100) + '%';
        document.getElementById('en-fill').style.width = s.en + '%';
        document.getElementById('s-btn').className = 'btn' + (s.en >= 100 ? ' ready' : '');
    }

        for (let col = 0; col < 7; col++) {
            let empty =
