<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Ultra Stable</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; text-align: center; }
        .header { background: #1a1a1a; padding: 10px; border-bottom: 1px solid #333; }
        
        /* Жесткая фиксация контейнера */
        #grid { 
            display: block; 
            width: 315px; 
            height: 315px; 
            margin: 10px auto; 
            background: #111;
            line-height: 0; /* Убирает лишние отступы между строками */
        }

        .cell { 
            display: inline-block;
            width: 40px; 
            height: 40px; 
            margin: 2px;
            border-radius: 4px; 
            background-size: cover;
            background-position: center;
            vertical-align: top;
            line-height: 40px; /* Для центровки текста внутри */
            font-size: 12px;
            font-weight: bold;
            color: rgba(255,255,255,0.5);
        }

        .arena { height: 120px; background: #050505; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .hp-bar { width: 280px; height: 10px; background: #333; margin: 5px; border-radius: 5px; overflow: hidden; }
        .fill { height: 100%; width: 100%; transition: 0.3s; }
        #mob-img { height: 60px; }

        .btn { width: 300px; padding: 15px; margin: 10px; border: none; border-radius: 8px; background: #444; color: #fff; font-weight: bold; }
        .ready { background: #f39c12 !important; box-shadow: 0 0 10px #f39c12; }
        
        #admin-info { display: none; background: #600; font-size: 10px; padding: 5px; }
        #msg { position: fixed; top: 50%; width: 100%; background: rgba(0,0,0,0.8); color: gold; display: none; padding: 20px; z-index: 100; }
    </style>
</head>
<body>

    <div id="admin-info">
        ADMIN MODE: <button onclick="changeLvl(1)">+1 УР</button> | <button onclick="skipBan()">СБРОС БАНА</button>
    </div>

    <div class="header" onclick="adminTouch()">
        <span id="lvl-txt">УРОВЕНЬ 1</span> | <span id="best-txt" style="opacity:0.5">РЕКОРД: 1</span>
    </div>

    <div class="arena">
        <div class="hp-bar"><div id="ehp" class="fill" style="background: #e74c3c;"></div></div>
        <img id="mob-img" src="mob1.png" onerror="this.src='https://via.placeholder.com/60/red?text=MOB'">
        <div class="hp-bar"><div id="php" class="fill" style="background: #2ecc71;"></div></div>
    </div>

    <div id="grid"></div>

    <div id="msg"></div>

    <div style="width: 300px; height: 6px; background: #222; margin: 5px auto; border-radius: 3px; overflow: hidden;">
        <div id="en-fill" style="width: 0%; height: 100%; background: #3498db;"></div>
    </div>
    <button id="s-btn" class="btn" onclick="useSuper()">УДАР МОЛОТОМ</button>

<script>
    const runes = ['rune1.png', 'rune2.png', 'rune3.png', 'rune4.png', 'rune5.png'];
    const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6'];
    
    let state = {
        lvl: parseInt(localStorage.getItem('v_lvl')) || 1,
        best: parseInt(localStorage.getItem('v_best')) || 1,
        en: parseInt(localStorage.getItem('v_en')) || 0,
        hp: 100, ehp: 100, lock: false, board: [], sel: null
    };

    let admClicks = 0;
    function adminTouch() {
        if (++admClicks >= 5) {
            localStorage.setItem('v_adm', 'true');
            document.getElementById('admin-info').style.display = 'block';
        }
    }

    function changeLvl(v) { state.lvl += v; save(); location.reload(); }
    function skipBan() { localStorage.removeItem('v_ban'); location.reload(); }
    function save() {
        localStorage.setItem('v_lvl', state.lvl);
        localStorage.setItem('v_en', state.en);
        if(state.lvl > state.best) localStorage.setItem('v_best', state.lvl);
    }

    function init() {
        // Проверка бана
        const ban = localStorage.getItem('v_ban');
        if (ban && Date.now() < ban) {
            document.body.innerHTML = `<h1 style="margin-top:100px; color:red;">ВЫ РАНЕНЫ</h1><p>Вернитесь через час</p><button onclick="skipBan()">АДМИН: СНЯТЬ</button>`;
            if (localStorage.getItem('v_adm') === 'true') return;
            return;
        }

        if (localStorage.getItem('v_adm') === 'true') document.getElementById('admin-info').style.display = 'block';

        state.ehp = 100 + (state.lvl * 20);
        state.maxEHP = state.ehp;

        document.getElementById('lvl-txt').innerText = "УРОВЕНЬ " + state.lvl;
        document.getElementById('best-txt').innerText = "РЕКОРД: " + state.best;

        const container = document.getElementById('grid');
        container.innerHTML = '';
        state.board = [];

        // Создаем плитки
        for (let i = 0; i < 49; i++) {
            let type = Math.floor(Math.random() * 5);
            state.board.push(type);
            
            let div = document.createElement('div');
            div.className = 'cell';
            div.id = 'tile-' + i;
            div.onclick = () => handleTouch(i);
            container.appendChild(div);
        }
        render();
    }

    function render() {
        state.board.forEach((t, i) => {
            const el = document.getElementById('tile-' + i);
            if (!el) return;
            if (t === -1) {
                el.style.backgroundColor = '#000';
                el.style.backgroundImage = 'none';
                el.innerText = '';
            } else {
                el.style.backgroundColor = colors[t];
                el.style.backgroundImage = `url(${runes[t]})`;
                el.innerText = t; // Подстраховка: если картинки нет, будет цифра
            }
            el.style.border = (state.sel === i) ? '2px solid white' : '1px solid #222';
        });

        document.getElementById('php').style.width = state.hp + '%';
        document.getElementById('ehp').style.width = (state.ehp / state.maxEHP * 100) + '%';
        document.getElementById('en-fill').style.width = state.en + '%';
        document.getElementById('s-btn').className = 'btn' + (state.en >= 100 ? ' ready' : '');
    }

    async function handleTouch(i) {
        if (state.lock) return;
        if (state.sel === null) {
            state.sel = i;
        } else {
            let a = state.sel, b = i;
            let dist = Math.abs(a - b);
            if (dist === 1 || dist === 7) {
                state.lock = true;
                [state.board[a], state.board[b]] = [state.board[b], state.board[a]];
                render();
                if (!await checkMatches()) {
                    [state.board[a], state.board[b]] = [state.board[b], state.board[a]];
                }
            }
            state.sel = null;
            state.lock = false;
        }
        render();
    }

    async function checkMatches() {
        let hasMatch = false;
        while (true) {
            let toDestroy = new Set();
            for (let i = 0; i < 49; i++) {
                // Горизонталь
                if (i % 7 < 5 && state.board[i] !== -1 && state.board[i] === state.board[i+1] && state.board[i] === state.board[i+2]) {
                    toDestroy.add(i); toDestroy.add(i+1); toDestroy.add(i+2);
                }
                // Вертикаль
                if (i < 35 && state.board[i] !== -1 && state.board[i] === state.board[i+7] && state.board[i] === state.board[i+14]) {
                    toDestroy.add(i); toDestroy.add(i+7); toDestroy.add(i+14);
                }
            }

            if (toDestroy.size === 0) break;
            hasMatch = true;

            toDestroy.forEach(idx => {
                if (state.board[idx] === 1) state.en = Math.min(100, state.en + 5);
                if (state.board[idx] === 0) state.hp = Math.min(100, state.hp + 2);
                state.ehp -= 10;
                state.board[idx] = -1;
            });

            render();
            await new Promise(r => setTimeout(r, 200));
            dropTiles();
            render();
            await new Promise(r => setTimeout(r, 200));
        }

        if (hasMatch) {
            if (state.ehp <= 0) {
                alert("ПОБЕДА!");
                state.lvl++;
                save();
                location.reload();
            } else {
                enemyAttack();
            }
        }
        return hasMatch;
    }

    function dropTiles() {
        for (let c = 0; c < 7; c++) {
            let empty = 0;
            for (let r = 6; r >= 0; r--) {
                let idx = r * 7 + c;
                if (state.board[idx] === -1) empty++;
                else if (empty > 0) {
                    state.board[idx + empty * 7] = state.board[idx];
                    state.board[idx] = -1;
                }
            }
            for (let r = 0; r < empty; r++) {
                state.board[r * 7 + c] = Math.floor(Math.random() * 5);
            }
        }
    }

    function enemyAttack() {
        state.hp -= (5 + Math.floor(state.lvl/2));
        if (state.hp <= 0) {
            localStorage.setItem('v_ban', Date.now() + 3600000);
            location.reload();
        }
        render();
    }

    async function useSuper() {
        if (state.en < 100 || state.lock) return;
        state.lock = true; state.en = 0; state.ehp -= 100;
        for (let i = 0; i < 10; i++) state.board[Math.floor(Math.random()*49)] = -1;
        render();
        await new Promise(r => setTimeout(r, 300));
        dropTiles();
        await checkMatches();
        state.lock = false;
        render();
    }

    window.onload = init;
</script>
</body>
</html>
