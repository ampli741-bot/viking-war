<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Final Debug</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; margin: 0; touch-action: manipulation; }
        #lvl-display { padding: 10px; color: gold; font-size: 20px; font-weight: bold; }
        /* Сетка теперь с жесткими размерами */
        #grid { 
            display: grid; 
            grid-template-columns: repeat(7, 42px); 
            grid-template-rows: repeat(7, 42px); 
            gap: 4px; 
            width: 318px; 
            margin: 20px auto; 
            background: #333; /* Тот самый серый квадрат */
            padding: 5px;
            border-radius: 5px;
        }
        .cell { 
            width: 42px; 
            height: 42px; 
            background-color: #555; /* Цвет плитки, если нет картинки */
            background-size: cover;
            border-radius: 3px;
        }
        .sel { outline: 3px solid orange; box-shadow: 0 0 10px orange; }
        .hp-bar { width: 300px; height: 15px; background: #000; margin: 5px auto; border: 1px solid #444; border-radius: 10px; overflow: hidden; }
        .fill { height: 100%; width: 100%; transition: 0.3s; }
        .btn { width: 318px; padding: 15px; background: #444; color: #ccc; border: none; border-radius: 8px; font-weight: bold; }
        .ready { background: linear-gradient(orange, darkorange) !important; color: #fff !important; }
        #ban-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="ban-screen">
    <h1 style="color: red;">ВЫ ПАЛИ</h1>
    <h2 id="timer" style="color: gold;">60:00</h2>
</div>

<div id="lvl-display">УРОВЕНЬ 1</div>

<div class="hp-bar"><div id="ehp" class="fill" style="background: red;"></div></div>
<div id="grid"></div>
<div class="hp-bar"><div id="php" class="fill" style="background: green;"></div></div>

<div style="width: 318px; height: 8px; background: #222; margin: 10px auto; border-radius: 4px;">
    <div id="en-fill" style="width: 0%; height: 100%; background: gold; transition: 0.3s;"></div>
</div>

<button id="s-btn" class="btn" onclick="useSuper()">УДАР МОЛОТОМ</button>

<script>
    const runes = ['rune1.png', 'rune2.png', 'rune3.png', 'rune4.png', 'rune5.png'];
    const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6'];
    let s = { board: [], sel: null, hp: 100, ehp: 100, en: 0, lvl: 1, lock: false };

    // Простая функция отрисовки
    function draw() {
        for (let i = 0; i < 49; i++) {
            const c = document.getElementById('c' + i);
            const type = s.board[i];
            if (type === -1) {
                c.style.backgroundImage = 'none';
                c.style.backgroundColor = '#fff';
            } else {
                c.style.backgroundColor = colors[type];
                c.style.backgroundImage = `url(${runes[type]})`;
            }
            c.className = 'cell' + (s.sel === i ? ' sel' : '');
        }
        document.getElementById('php').style.width = s.hp + '%';
        document.getElementById('ehp').style.width = s.ehp + '%';
        document.getElementById('en-fill').style.width = s.en + '%';
        document.getElementById('s-btn').className = 'btn' + (s.en >= 100 ? ' ready' : '');
    }

    function init() {
        // Проверка бана
        const ban = localStorage.getItem('viking_ban');
        if (ban && ban > Date.now()) {
            document.getElementById('ban-screen').style.display = 'flex';
            const t = setInterval(() => {
                let diff = ban - Date.now();
                if (diff <= 0) { clearInterval(t); localStorage.removeItem('viking_ban'); location.reload(); }
                let m = Math.floor(diff/60000), sec = Math.floor((diff%60000)/1000);
                document.getElementById('timer').innerText = `${m}:${sec < 10 ? '0' : ''}${sec}`;
            }, 1000);
            return;
        }

        const g = document.getElementById('grid');
        g.innerHTML = '';
        s.board = [];

        // Прямое создание плиток
        for (let i = 0; i < 49; i++) {
            s.board.push(Math.floor(Math.random() * 5));
            const c = document.createElement('div');
            c.id = 'c' + i;
            c.className = 'cell';
            c.onclick = function() { touch(i); };
            g.appendChild(c);
        }
        draw();
    }

    async function touch(i) {
        if (s.lock) return;
        if (s.sel === null) { s.sel = i; draw(); }
        else {
            let a = s.sel, b = i;
            if (Math.abs(a - b) === 1 || Math.abs(a - b) === 7) {
                s.lock = true;
                [s.board[a], s.board[b]] = [s.board[b], s.board[a]];
                await checkMatches();
            }
            s.sel = null; draw();
        }
    }

    async function checkMatches() {
        let found = false;
        let m = [];
        // Горизонтали
        for(let i=0; i<49; i++) {
            if (i%7 < 5 && s.board[i] === s.board[i+1] && s.board[i] === s.board[i+2]) m.push(i, i+1, i+2);
            if (i < 35 && s.board[i] === s.board[i+7] && s.board[i] === s.board[i+14]) m.push(i, i+7, i+14);
        }
        
        if (m.length > 0) {
            found = true;
            [...new Set(m)].forEach(idx => {
                if (s.board[idx] === 0) s.hp = Math.min(100, s.hp + 1);
                if (s.board[idx] === 4) s.en = Math.min(100, s.en + 10);
                s.ehp -= 5;
                s.board[idx] = -1;
            });
            draw();
            await new Promise(r => setTimeout(r, 300));
            for(let i=0; i<49; i++) if (s.board[i] === -1) s.board[i] = Math.floor(Math.random() * 5);
            draw();
            await checkMatches();
        } else {
            if (s.ehp <= 0) { 
                alert("Победа!"); s.lvl++; s.hp = Math.min(100, s.hp + 15); s.ehp = 100; init(); 
            } else {
                enemyTurn();
            }
        }
        s.lock = false;
    }

    function enemyTurn() {
        s.hp -= (5 + s.lvl);
        if (s.hp <= 0) { localStorage.setItem('viking_ban', Date.now() + 3600000); location.reload(); }
        draw();
    }

    async function useSuper() {
        if (s.en < 100 || s.lock) return;
        s.en = 0; s.ehp -= 50;
        for(let i=0; i<15; i++) {
            let r = Math.floor(Math.random()*49);
            s.board[r] = -1;
        }
        draw();
        await new Promise(r => setTimeout(r, 400));
        await checkMatches();
    }

    // Запуск!
    init();
</script>

</body>
</html>
