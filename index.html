<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: AI Battle</title>
    <style>
        :root { --gold: #f1c40f; --red: #e74c3c; --green: #2ecc71; --enemy: #9b59b6; }
        body { background: #0a0a0a; color: white; font-family: sans-serif; margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; touch-action: manipulation; }
        
        .arena { width: 100%; height: 180px; position: relative; background: #111; border-bottom: 2px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
        #enemy-img { width: 120px; height: 120px; margin-bottom: 5px; transition: 0.2s; z-index: 2; }
        .hit { filter: brightness(2) red; transform: scale(1.1); }
        
        .bars { position: absolute; top: 10px; width: 90%; display: flex; flex-direction: column; gap: 4px; }
        .bar-wrap { height: 12px; background: #222; border-radius: 6px; overflow: hidden; border: 1px solid #444; position: relative; }
        .bar-fill { height: 100%; width: 100%; transition: 0.4s; }
        .label { position: absolute; width: 100%; text-align: center; font-size: 8px; line-height: 12px; font-weight: bold; text-shadow: 1px 1px 1px black; }

        #grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 10px; background: #000; border-radius: 8px; margin-top: 5px; }
        .cell { width: 42px; height: 42px; border-radius: 4px; background-size: cover; background-position: center; background-repeat: no-repeat; background-color: #1a1a1a; transition: 0.2s; }
        
        .selected { outline: 3px solid var(--gold); transform: scale(0.9); z-index: 5; }
        .enemy-move { outline: 3px solid var(--enemy); box-shadow: 0 0 8px var(--enemy); }

        .controls { width: 90%; margin-top: 10px; }
        #super-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #333; color: #666; font-weight: bold; font-size: 14px; }
        #super-btn.ready { background: linear-gradient(orange, darkorange); color: white; box-shadow: 0 0 10px gold; }

        @keyframes shake { 0% { transform: translate(2px, 1px); } 50% { transform: translate(-2px, -1px); } 100% { transform: translate(0,0); } }
        .shaking { animation: shake 0.1s infinite; }
    </style>
</head>
<body>

<div class="arena" id="arena">
    <div class="bars">
        <div class="bar-wrap"><div id="enemy-hp" class="bar-fill" style="background:var(--red)"></div><div class="label">ВРАГ</div></div>
        <div class="bar-wrap"><div id="player-hp" class="bar-fill" style="background:var(--green)"></div><div class="label">ВАШЕ HP</div></div>
    </div>
    <img id="enemy-img" src="mob1.png" onerror="this.style.display='none'">
</div>

<div id="grid"></div>

<div class="controls">
    <div class="bar-wrap" style="height:6px; border-color: var(--gold); margin-bottom: 5px;"><div id="energy-fill" class="bar-fill" style="background:var(--gold); width:0%;"></div></div>
    <button id="super-btn" onclick="useSuper()">УДАР МОЛОТОМ</button>
</div>
