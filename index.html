<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Stable & Powerful</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; text-align: center; overflow: hidden; touch-action: manipulation; }
        .header { background: #1a1a1a; padding: 10px; border-bottom: 2px solid #333; }
        .arena { height: 160px; background: #050505; position: relative; overflow: hidden; transition: 0.1s; }
        
        .shake { animation: shake 0.2s 3; }
        @keyframes shake { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(4px,4px); } 75% { transform: translate(-4px,-4px); } }

        .hp-bar { width: 90%; height: 12px; background: #333; margin: 5px auto; border-radius: 6px; overflow: hidden; border: 1px solid #444; }
        .fill { height: 100%; width: 100%; transition: 0.3s; }
        #boss-en-bar { width: 60%; height: 6px; background: #222; margin: 2px auto; border-radius: 3px; border: 1px solid orange; display: none; overflow: hidden; }
        
        #mob-img { height: 90px; margin-top: 5px; transition: 0.5s; }
        #combo-txt { position: absolute; top: 40%; left: 50%; transform: translateX(-50%); font-size: 36px; color: gold; font-weight: bold; z-index: 100; display: none; text-shadow: 2px 2px #000; pointer-events: none; }

        .ui { padding: 10px 0; background: #111; }
        .en-bar { width: 280px; height: 18px; background: #222; margin: 0 auto 5px; border-radius: 9px; overflow: hidden; position: relative; border: 1px solid #3498db; }
        #en-txt { position: absolute; width: 100%; font-size: 10px; line-height: 18px; z-index: 5; font-weight: bold; }

        #grid { width: 315px; margin: 5px auto; display: block; font-size: 0; }
        .cell { display: inline-block; width: 40px; height: 40px; margin: 2px; background-size: cover; background-color: #222; border-radius: 4px; border: 1px solid #333; }
        .sel { border: 2px solid #fff !important; transform: scale(0.9); }
        .btn { width: 280px; padding: 12px; border: none; border-radius: 8px; background: #444; color: #888; font-weight: bold; }
        .ready { background: orange !important; color: #fff !important; }
    </style>
</head>
<body>

    <div class="header"><span id="lvl-txt" style="color:gold">УРОВЕНЬ 1</span></div>

    <div class="arena" id="arena">
        <div id="combo-txt">COMBO X1</div>
        <div class="hp-bar"><div id="ehp" class="fill" style="background: red;"></div></div>
        <div id="boss-en-bar"><div id="boss-en-fill" class="fill" style="background: orange; width: 0%;"></div></div>
        <img id="mob-img" src="mob1.png" onerror="this.src='https://via.placeholder.com/80/red?text=MOB'">
        <div class="hp-bar"><div id="php" class="fill" style="background: green;"></div></div>
    </div>

    <div class="ui">
        <div class="en-bar">
            <div id="en-txt">МОЛОТ: 0%</div>
            <div id="en-f" class="fill" style="background: dodgerblue; width: 0%;"></div>
        </div>
        <button id="s-btn" class="btn" onclick="useSuper()">УДАР МОЛОТОМ</button>
    </div>

    <div id="grid"></div>

<script>
    const runes = ['rune1.png', 'rune2.png', 'rune3.png', 'rune4.png', 'rune5.png'];
    const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6'];

    let s = {
        lvl: parseInt(localStorage.getItem('v_lvl')) || 1,
        en: 0, hp: 100, ehp: 100, maxEHP: 100, lock: false, board: [], sel: null, bossEn: 0, combo: 0
    };

    function play(f) { new Audio(f).play().catch(()=>{}); }

    function init() {
        const isBoss = s.lvl % 25 === 0;
        document.getElementById('boss-en-bar').style.display = isBoss ? 'block' : 'none';
        document.getElementById('mob-img').src = isBoss ? 'mob4.png' : 'mob1.png';
        document.getElementById('mob-img').style.transform = isBoss ? 'scale(1.7)' : 'scale(1)';
        
        s.maxEHP = (100 + (s.lvl * 20)) * (isBoss ? 3 : 1);
        s.ehp = s.maxEHP; s.hp = 100; s.bossEn = 0;
        document.getElementById('lvl-txt').innerText = (isBoss ? "БОСС " : "УРОВЕНЬ ") + s.lvl;

        const g = document.getElementById('grid');
        g.innerHTML = ''; s.board = [];
        for (let i = 0; i < 49; i++) {
            s.board.push(Math.floor(Math.random() * 5));
            let d = document.createElement('div');
            d.className = 'cell'; d.id = 'c' + i;
            d.onclick = () => touch(i);
            g.appendChild(d);
        }
        draw();
    }

    function draw() {
        s.board.forEach((t, i) => {
            const el = document.getElementById('c' + i);
            el.style.backgroundColor = t === -1 ? '#000' : colors[t];
            el.style.backgroundImage = t === -1 ? 'none' : `url(${runes[t]})`;
            el.classList.toggle('sel', s.sel === i);
        });
        document.getElementById('php').style.width = s.hp + '%';
        document.getElementById('ehp').style.width = (s.ehp / s.maxEHP * 100) + '%';
        document.getElementById('en-f').style.width = s.en + '%';
        document.getElementById('en-txt').innerText = `МОЛОТ: ${s.en}%`;
        document.getElementById('boss-en-fill').style.width = s.bossEn + '%';
        document.getElementById('s-btn').className = 'btn' + (s.en >= 100 ? ' ready' : '');
    }

    async function touch(i) {
        if (s.lock) return;
        if (s.sel === null) { s.sel = i; draw(); }
        else {
            let a = s.sel, b = i;
            if (Math.abs(a - b) === 1 || Math.abs(a - b) === 7) {
                s.lock = true;
                [s.board[a], s.board[b]] = [s.board[b], s.board[a]];
                draw();
                s.combo = 0;
                if (!await check()) [s.board[a], s.board[b]] = [s.board[b], s.board[a]];
            }
            s.sel = null; s.lock = false; draw();
        }
    }

    async function check() {
        let found = false;
        while (true) {
            let del = new Set();
            
            // Поиск совпадений
            for (let i = 0; i < 49; i++) {
                // Горизонталь
                if (i % 7 < 5 && s.board[i] !== -1 && s.board[i] === s.board[i+1] && s.board[i] === s.board[i+2]) {
                    let matchLen = 3;
                    if (i % 7 < 4 && s.board[i] === s.board[i+3]) matchLen = 4;
                    if (i % 7 < 3 && s.board[i] === s.board[i+4]) matchLen = 5;
                    
                    for(let k=0; k<matchLen; k++) del.add(i+k);
                    
                    if (matchLen === 4) destroyLine(Math.floor(i/7), 'h');
                    if (matchLen === 5) destroyArea(i+2);
                }
                // Вертикаль
                if (i < 35 && s.board[i] !== -1 && s.board[i] === s.board[i+7] && s.board[i] === s.board[i+14]) {
                    let matchLen = 3;
                    if (i < 28 && s.board[i] === s.board[i+21]) matchLen = 4;
                    if (i < 21 && s.board[i] === s.board[i+28]) matchLen = 5;

                    for(let k=0; k<matchLen; k++) del.add(i+k*7);
                    
                    if (matchLen === 4) destroyLine(i % 7, 'v');
                    if (matchLen === 5) destroyArea(i+14);
                }
            }

            if (del.size === 0) break;
            found = true; s.combo++;
            
            if(s.combo > 1) {
                const ct = document.getElementById('combo-txt');
                ct.innerText = "COMBO X" + s.combo;
                ct.style.display = 'block';
                if (s.combo >= 5) document.getElementById('arena').classList.add('shake');
                setTimeout(() => { ct.style.display = 'none'; document.getElementById('arena').classList.remove('shake'); }, 500);
            }

            del.forEach(idx => {
                if (s.board[idx] === 1) s.en = Math.min(100, s.en + 5);
                s.ehp -= (10 * s.combo);
                s.board[idx] = -1;
            });

            draw(); await new Promise(r => setTimeout(r, 200));
            drop(); draw(); await new Promise(r => setTimeout(r, 200));
        }
        if (found) {
            if (s.ehp <= 0) { s.lvl++; init(); } else enemy();
        }
        return found;
    }

    function destroyLine(idx, dir) {
        for (let i = 0; i < 7; i++) {
            let target = (dir === 'h') ? (idx * 7 + i) : (i * 7 + idx);
            s.board[target] = -1;
            s.ehp -= 5;
        }
    }

    function destroyArea(idx) {
        const neighbors = [idx, idx-1, idx+1, idx-7, idx+7, idx-8, idx-6, idx+8, idx+6];
        neighbors.forEach(n => { if(n>=0 && n<49) { s.board[n] = -1; s.ehp -= 10; } });
    }

    function drop() {
        for (let c = 0; c < 7; c++) {
            let empty = 0;
            for (let r = 6; r >= 0; r--) {
                let i = r * 7 + c;
                if (s.board[i] === -1) empty++;
                else if (empty > 0) { s.board[i+empty*7] = s.board[i]; s.board[i] = -1; }
            }
            for (let r = 0; r < empty; r++) s.board[r*7+c] = Math.floor(Math.random() * 5);
        }
    }

    function enemy() {
        let dmg = 5 + Math.floor(s.lvl/5);
        if (s.lvl % 25 === 0) {
            s.bossEn += 25;
            if (s.bossEn >= 100) { dmg *= 3; s.bossEn = 0; }
        }
        s.hp -= dmg;
        if (s.hp <= 0) location.reload();
        draw();
    }

    async function useSuper() {
        if (s.en < 100 || s.lock) return;
        s.lock = true; s.en = 0; s.ehp -= 100;
        for (let i = 0; i < 10; i++) s.board[Math.floor(Math.random()*49)] = -1;
        draw(); await new Promise(r => setTimeout(r, 300));
        drop(); await check(); s.lock = false;
    }

    window.onload = init;
</script>
</body>
</html>
