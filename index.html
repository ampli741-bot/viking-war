<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Emergency Fix</title>
    <style>
        :root { --gold: #f1c40f; --red: #e74c3c; --green: #2ecc71; }
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 0; text-align: center; overflow: hidden; touch-action: manipulation; }
        
        .header { background: #1a1a1a; padding: 10px; border-bottom: 2px solid #333; font-weight: bold; color: var(--gold); }
        .arena { height: 160px; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; position: relative; }
        .hp-bar { width: 90%; height: 12px; background: #333; margin: 4px; border-radius: 6px; overflow: hidden; border: 1px solid #444; }
        .fill { height: 100%; transition: 0.4s; width: 100%; }
        
        #grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 5px; 
            padding: 10px; 
            width: 320px; 
            margin: 0 auto; 
            background: #222; 
            border-radius: 8px;
            min-height: 320px; /* Чтобы сетка не схлопывалась */
        }
        
        .cell { 
            width: 40px; 
            height: 40px; 
            border-radius: 4px; 
            border: 1px solid rgba(255,255,255,0.1);
            background-size: cover;
            background-position: center;
        }

        .sel { outline: 3px solid var(--gold); transform: scale(0.9); box-shadow: 0 0 10px var(--gold); }
        .btn { width: 90%; padding: 15px; margin-top: 10px; border: none; border-radius: 8px; background: #444; color: #888; font-weight: bold; font-size: 16px; }
        .ready { background: linear-gradient(to bottom, #f39c12, #e67e22) !important; color: #fff !important; box-shadow: 0 0 15px gold; }
        
        #ban-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        
        @keyframes explosion { 0% { transform: scale(1); } 50% { transform: scale(1.4); background-color: #fff !important; } 100% { transform: scale(1); } }
        .smash-anim { animation: explosion 0.4s ease-out; }
    </style>
</head>
<body>

<div id="ban-screen">
    <h1 style="color: var(--red);">ВЫ ПАЛИ В БОЮ</h1>
    <p>Вальхалла закрыта. Ждите:</p>
    <h2 id="timer" style="color: var(--gold);">60:00</h2>
</div>

<div class="header" id="lvl-display">УРОВЕНЬ 1</div>
<div class="arena" id="battle-screen">
    <div id="msg" style="position: absolute; top: 20px; width: 100%; display: none; font-weight: bold;"></div>
    <div class="hp-bar"><div id="ehp" class="fill" style="background: var(--red);"></div></div>
    <img id="mob" src="mob1.png" style="width: 100px; height: 100px;" onerror="this.style.display='none'">
    <div class="hp-bar"><div id="php" class="fill" style="background: var(--green);"></div></div>
</div>

<div id="grid"></div>

<div style="height: 10px; width: 90%; background: #222; margin: 10px auto; border-radius: 5px; border: 1px solid #333;">
    <div id="en-fill" style="width: 0%; height: 100%; background: var(--gold); transition: 0.3s;"></div>
</div>

<button id="s-btn" class="btn" onclick="useSuper()">УДАР МОЛОТОМ</button>

<script>
    const runes = ['rune1.png', 'rune2.png', 'rune3.png', 'rune4.png', 'rune5.png'];
    // Основные цвета плиток (если картинки не грузятся)
    const colors = ['#ff4d4d', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6'];
    let s = { board: [], sel: null, hp: 100, ehp: 100, en: 0, lock: false, lvl: 1, stunTurns: 0 };

    function checkBan() {
        const ban = localStorage.getItem('viking_ban');
        if (ban && ban > Date.now()) {
            document.getElementById('ban-screen').style.display = 'flex';
            const update = () => {
                let diff = ban - Date.now();
                if (diff <= 0) { localStorage.removeItem('viking_ban'); location.reload(); }
                let m = Math.floor(diff / 60000), sec = Math.floor((diff % 60000) / 1000);
                document.getElementById('timer').innerText = `${m}:${sec < 10 ? '0' : ''}${sec}`;
                setTimeout(update, 1000);
            };
            update(); return true;
        }
        return false;
    }

    function init() {
        if (checkBan()) return;
        const g = document.getElementById('grid');
        g.innerHTML = ''; s.board = [];
        
        for (let i = 0; i < 49; i++) {
            let type;
            do { type = Math.floor(Math.random() * 5); } 
            while ((i % 7 >= 2 && type === s.board[i-1] && type === s.board[i-2]) || (i >= 14 && type === s.board[i-7] && type === s.board[i-14]));
            
            s.board.push(type);
            let c = document.createElement('div');
            c.className = 'cell';
            c.id = 'c' + i;
            c.onclick = () => touch(i);
            g.appendChild(c);
        }
        s.ehp = 100 + (s.lvl * 15);
        if (s.lvl === 25) s.ehp = 500;
        document.getElementById('lvl-display').innerText = "УРОВЕНЬ " + s.lvl;
        draw();
    }

    function draw() {
        s.board.forEach((t, i) => {
            const c = document.getElementById('c' + i);
            if (!c) return;
            if (t === -1) {
                c.style.backgroundColor = '#fff';
                c.style.backgroundImage = 'none';
            } else {
                c.style.backgroundColor = colors[t]; // Сначала цвет!
                c.style.backgroundImage = `url(${runes[t]})`; // Потом картинка
            }
            c.classList.toggle('sel', s.sel === i);
        });
        document.getElementById('php').style.width = s.hp + '%';
        let maxE = (s.lvl === 25) ? 500 : 100 + (s.lvl * 15);
        document.getElementById('ehp').style.width = Math.max(0, (s.ehp / maxE * 100)) + '%';
        document.getElementById('en-fill').style.width = s.en + '%';
        document.getElementById('s-btn').className = 'btn' + (s.en >= 100 ? ' ready' : '');
    }

    async function touch(i) {
        if (s.lock) return;
        if (s.sel === null) { s.sel = i; draw(); } 
        else {
            let a = s.sel, b = i;
            let d = Math.abs(a - b);
            if (d === 1 || d === 7) {
                s.lock = true;
                [s.board[a], s.board[b]] = [s.board[b], s.board[a]];
                if (!await processMatches(true)) {
                    [s.board[a], s.board[b]] = [s.board[b], s.board[a]];
                    s.lock = false;
                }
            }
            s.sel = null; draw();
        }
    }

    async function processMatches(isPlayer) {
        let hasM = false, combo = 0;
        while (true) {
            let m = [];
            for (let i = 0; i < 49; i++) {
                if (i % 7 < 5 && s.board[i] !== -1 && s.board[i] === s.board[i+1] && s.board[i] === s.board[i+2]) m.push(i, i+1, i+2);
                if (i < 35 && s.board[i] !== -1 && s.board[i] === s.board[i+7] && s.board[i] === s.board[i+14]) m.push(i, i+7, i+14);
            }
            if (m.length === 0) break;
            hasM = true; combo++;
            [...new Set(m)].forEach(idx => {
                if (isPlayer) {
                    if (s.board[idx] === 0) s.hp = Math.min(100, s.hp + 1);
                    if (s.board[idx] === 4) s.en = Math.min(100, s.en + 10);
                    s.ehp -= (5 * combo);
                }
                s.board[idx] = -1;
            });
            draw(); await new Promise(r => setTimeout(r, 200));
            for (let i = 0; i < 49; i++) if (s.board[i] === -1) s.board[i] = Math.floor(Math.random() * 5);
            draw(); await new Promise(r => setTimeout(r, 150));
        }
        if (isPlayer && hasM) {
            if (s.ehp <= 0) win(); else setTimeout(
