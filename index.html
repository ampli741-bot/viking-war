<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Viking Battle</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; text-align: center; overflow: hidden; }
        .bar { width: 90%; height: 10px; background: #222; margin: 5px auto; border-radius: 5px; overflow: hidden; }
        .fill { height: 100%; width: 100%; transition: 0.3s; }
        #grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 10px; width: 320px; margin: 0 auto; background: #111; }
        .cell { width: 42px; height: 42px; background-size: cover; background-color: #333; border-radius: 4px; border: 1px solid #444; }
        .selected { outline: 3px solid gold; }
        .enemy { outline: 3px solid purple; }
        img { width: 100px; height: 100px; }
    </style>
</head>
<body>
    <div class="bar"><div id="ehp" class="fill" style="background: red;"></div></div>
    <img src="mob1.png" id="mob">
    <div class="bar"><div id="php" class="fill" style="background: green;"></div></div>
    
    <div id="grid"></div>

    <script>
        const runes = ['rune1.png', 'rune2.png', 'rune3.png', 'rune4.png', 'rune5.png'];
        let state = { board: [], sel: null, hp: 100, ehp: 100, lock: false };

        function init() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            state.board = [];
            for (let i = 0; i < 49; i++) {
                state.board.push(Math.floor(Math.random() * 5));
                let c = document.createElement('div');
                c.className = 'cell';
                c.id = 'c' + i;
                c.onclick = () => touch(i);
                grid.appendChild(c);
            }
            draw();
        }

        function draw() {
            state.board.forEach((t, i) => {
                let c = document.getElementById('c' + i);
                c.style.backgroundImage = `url(${runes[t]})`;
                c.className = 'cell' + (state.sel === i ? ' selected' : '');
            });
            document.getElementById('php').style.width = state.hp + '%';
            document.getElementById('ehp').style.width = state.ehp + '%';
        }

        function touch(i) {
            if (state.lock) return;
            if (state.sel === null) { state.sel = i; } 
            else {
                let d = Math.abs(state.sel - i);
                if (d === 1 || d === 7) {
                    swap(state.sel, i);
                    state.lock = true;
                    setTimeout(enemyTurn, 1000);
                }
                state.sel = null;
            }
            draw();
        }

        function swap(a, b) {
            let t = state.board[a];
            state.board[a] = state.board[b];
            state.board[b] = t;
            state.ehp -= 5;
            draw();
        }

        function enemyTurn() {
            let i1 = Math.floor(Math.random() * 49);
            let i2 = i1 + (Math.random() > 0.5 ? 1 : 7);
            if (i2 > 48) i2 = i1 - 7;
            
            document.getElementById('c'+i1).classList.add('enemy');
            document.getElementById('c'+i2).classList.add('enemy');

            setTimeout(() => {
                let t = state.board[i1];
                state.board[i1] = state.board[i2];
                state.board[i2] = t;
                state.hp -= 10;
                state.lock = false;
                draw();
            }, 500);
        }

        init();
    </script>
</body>
</html>
