<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Boss Edition</title>
    <style>
        :root { --gold: #f1c40f; --red: #e74c3c; --green: #2ecc71; --blue: #3498db; }
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; text-align: center; overflow: hidden; touch-action: manipulation; }
        
        #admin-info { display: none; background: #600; font-size: 10px; padding: 5px; position: sticky; top: 0; z-index: 1000; }
        .admin-btn { background: #fff; color: #000; border: none; padding: 2px 5px; margin: 0 2px; font-weight: bold; }

        .header { background: #1a1a1a; padding: 8px; border-bottom: 1px solid #333; display: flex; justify-content: space-around; font-size: 14px; }
        
        .arena { height: 110px; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .hp-bar { width: 90%; height: 8px; background: #333; margin: 3px; border-radius: 4px; overflow: hidden; border: 1px solid #444; }
        .fill { height: 100%; transition: 0.3s; width: 100%; }
        #mob-img { height: 60px; transition: transform 0.2s; }
        .boss-warn { color: red; font-weight: bold; font-size: 12px; position: absolute; top: 5px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Панель управления (над плитками) */
        .controls { padding: 10px 0; background: #111; }
        .super-bar { width: 280px; height: 10px; background: #222; margin: 0 auto 8px; border-radius: 5px; border: 1px solid #3498db; overflow: hidden; }
        .s-btn { width: 280px; padding: 12px; border: none; border-radius: 8px; background: #333; color: #666; font-weight: bold; font-size: 14px; }
        .ready { background: linear-gradient(to bottom, #f39c12, #e67e22) !important; color: #fff !important; box-shadow: 0 0 15px #e67e22; }

        /* СЕТКА (Grid) */
        #grid { 
            display: grid; 
            grid-template-columns: repeat(7, 42px); 
            grid-template-rows: repeat(7, 42px); 
            gap: 4px; 
            justify-content: center; 
            margin: 10px auto;
            width: fit-content;
        }
        .cell { 
            width: 42px; height: 42px; 
            background-size: cover; border-radius: 4px; 
            background-color: #1a1a1a; border: 1px solid #222;
            box-sizing: border-box;
        }
        .sel { outline: 3px solid #fff; transform: scale(0.9); z-index: 10; box-shadow: 0 0 10px gold; }

        #msg { position: fixed; top: 40%; width: 100%; background: rgba(0,0,0,0.9); color: gold; display: none; padding: 20px 0; z-index: 2000; font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="admin-info">
        ADM: <button class="admin-btn" onclick="changeLvl(-1)">-1</button>
        <button class="admin-btn" onclick="changeLvl(1)">+1</button>
        <button class="admin-btn" onclick="state.en=100;render();">MAX ⚡</button>
        <button class="admin-btn" onclick="skipBan()">SKIP BAN</button>
    </div>

    <div class="header" onclick="adminTouch()">
        <span id="best-txt" style="opacity:0.5">РЕКОРД: 1</span>
        <span id="lvl-txt" style="color:var(--gold)">УРОВЕНЬ 1</span>
    </div>

    <div class="arena">
        <div id="boss-tag" class="boss-warn" style="display:none">⚠️ БОСС ПРИБЛИЖАЕТСЯ ⚠️</div>
        <div id="msg"></div>
        <div class="hp-bar"><div id="ehp" class="fill" style="background: var(--red);"></div></div>
        <img id="mob-img" src="mob1.png" onerror="this.src='https://via.placeholder.com/60/red?text=MOB'">
        <div class="hp-bar"><div id="php" class="fill" style="background: var(--green);"></div></div>
    </div>

    <div class="controls">
        <div class="super-bar"><div id="en-fill" class="fill" style="background: var(--blue); width: 0%;"></div></div>
        <button id="s-btn" class="s-btn" onclick="useSuper()">УДАР МОЛОТОМ</button>
    </div>

    <div id="grid"></div>

<script>
    const runes = ['rune1.png', 'rune2.png', 'rune3.png', 'rune4.png', 'rune5.png'];
    const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6'];
    
    let state = {
        lvl: parseInt(localStorage.getItem('v_lvl')) || 1,
        best: parseInt(localStorage.getItem('v_best')) || 1,
        en: parseInt(localStorage.getItem('v_en')) || 0,
        hp: 100, ehp: 100, maxEHP: 100, lock: false, board: [], sel: null
    };

    let admHits = 0;
    function adminTouch() { if(++admHits >= 5) { localStorage.setItem('v_adm','true'); document.getElementById('admin-info').style.display='block'; } }
    function changeLvl(v) { state.lvl += v; save(); init(); }
    function skipBan() { localStorage.removeItem('v_ban'); location.reload(); }
    function save() { localStorage.setItem('v_lvl', state.lvl); localStorage.setItem('v_en', state.en); if(state.lvl > state.best) localStorage.setItem('v_best', state.lvl); }

    function init() {
        const ban = localStorage.getItem('v_ban');
        if (ban && Date.now() < ban) {
            document.body.innerHTML = `<div style="padding:50px; color:red"><h1>ВЫ РАНЕНЫ</h1><button onclick="skipBan()">АДМИН: СНЯТЬ</button></div>`;
            return;
        }
        if (localStorage.getItem('v_adm') === 'true') document.getElementById('admin-info').style.display = 'block';

        // Логика Босса
        const isBoss = state.lvl % 25 === 0;
        document.getElementById('boss-tag').style.display = isBoss ? 'block' : 'none';
        
        let baseEHP = 100 + (state.lvl * 25);
        state.ehp = isBoss ? baseEHP * 3 : baseEHP;
        state.maxEHP = state.ehp;
        state.hp = 100;

        document.getElementById('lvl-txt').innerText = (isBoss ? "БОСС " : "УРОВЕНЬ ") + state.lvl;
        document.getElementById('best-txt').innerText = "РЕКОРД: " + state.best;
        document.getElementById('mob-img').style.transform = isBoss ? 'scale(1.5)' : 'scale(1)';

        const g = document.getElementById('grid');
        g.innerHTML = ''; state.board = [];
        for (let i = 0; i < 49; i++) {
            state.board.push(Math.floor(Math.random() * 5));
            let d = document.createElement('div');
            d.className = 'cell'; d.id = 'c'+i;
            d.onclick = () => handleTouch(i);
            g.appendChild(d);
        }
