<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Abyss Edition</title>
    <style>
        :root { --gold: #ffd700; --accent: #2ecc71; --red: #e74c3c; --blue: #3498db; --purple: #a55eea; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; text-align: center; overflow: hidden; user-select: none; touch-action: manipulation; }
        
        .header { background: #151515; height: 55px; display: flex; justify-content: space-around; align-items: center; border-bottom: 3px solid #333; position: relative; z-index: 100; }
        #pts-txt { font-weight: bold; padding: 6px 15px; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .has-pts { color: var(--accent); border-color: var(--accent); background: rgba(46, 204, 113, 0.1); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0px var(--accent); } 50% { box-shadow: 0 0 10px var(--accent); } 100% { box-shadow: 0 0 0px var(--accent); } }

        .arena { max-width: 500px; height: 260px; margin: 0 auto; position: relative; background: #080808; overflow: hidden; border-bottom: 2px solid #222; }
        .boss-active { background: radial-gradient(circle at center, #30024f 0%, #000 100%) !important; }
        #mob-img { height: 170px; position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); z-index: 5; filter: drop-shadow(0 0 15px #000); }
        
        .bar-wrap { width: 92%; height: 16px; background: #222; margin: 8px auto; border-radius: 8px; border: 1px solid #444; overflow: hidden; position: relative; z-index: 10; }
        .bar-fill { height: 100%; width: 100%; transition: 0.4s; }

        #boss-super-wrap { width: 70%; height: 6px; background: #111; margin: -5px auto 5px; border-radius: 3px; border: 1px solid #444; overflow: hidden; display: none; position: relative; z-index: 11; }
        #boss-en-fill { height: 100%; width: 0%; background: var(--purple); transition: 0.3s; }

        #grid { width: 322px; margin: 10px auto; background: #111; padding: 8px; border-radius: 12px; border: 3px solid #333; }
        .cell { display: inline-block; width: 42px; height: 42px; margin: 2px; background-size: cover; background-color: #222; border-radius: 6px; cursor: pointer; transition: 0.2s; box-sizing: border-box; }
        .selected { border: 3px solid #fff; transform: scale(0.9); box-shadow: 0 0 15px #fff; }
        .locked { filter: grayscale(1) brightness(0.5); border: 2px solid var(--purple); pointer-events: none; }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.97); z-index: 1000; display: none; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .menu-btn { width: 220px; padding: 15px; margin: 10px; border-radius: 8px; background: #252525; color: #fff; font-weight: bold; border: 1px solid #444; cursor: pointer; }
        .buy-btn { background: var(--accent) !important; color: #000 !important; }
        
        .dmg-text { position: absolute; font-size: 28px; font-weight: 900; pointer-events: none; animation: flyUp 0.8s forwards; z-index: 200; text-shadow: 2px 2px #000; }
        @keyframes flyUp { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -80px); } }

        .super-container { width: 310px; margin: 5px auto; }
        #super-btn { width: 100%; padding: 12px; background: #222; color: #555; border: 2px solid #333; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        #super-btn.ready { background: var(--blue) !important; color: #fff !important; cursor: pointer; box-shadow: 0 0 15px var(--blue); }
    </style>
</head>
<body onclick="unlockAudio()">

    <div class="header">
        <div style="color:var(--gold); font-size: 16px;" onclick="adminClick()">LEVEL <span id="lvl-val">1</span></div>
        <div id="pts-txt" onclick="openForge()">PTS: <span id="pts-val">0</span></div>
        <div onclick="openInfo()">🛡️</div>
    </div>

    <div class="arena" id="arena">
        <div class="bar-wrap"><div id="hp-e" class="bar-fill" style="background:var(--red)"></div></div>
        <div id="boss-super-wrap"><div id="boss-en-fill"></div></div>
        <img id="mob-img" src="mob1.png">
        <div class="bar-wrap"><div id="hp-p" class="bar-fill" style="background:var(--accent)"></div></div>

        <div id="forge-menu" class="overlay">
            <h2 style="color:var(--gold)">КУЗНИЦА</h2>
            <button class="menu-btn buy-btn" onclick="buyStat('atk')">АТАКА (+2)</button>
            <button class="menu-btn buy-btn" onclick="buyStat('hp')">ЖИЗНЬ (+20)</button>
            <button class="menu-btn buy-btn" onclick="buyStat('agi')">ЛОВКОСТЬ (+1)</button>
            <button class="menu-btn" onclick="closeMenus()">НАЗАД</button>
        </div>

        <div id="info-menu" class="overlay">
            <h2 style="color:var(--gold)">ГЕРОЙ</h2>
            <div id="hero-stats"></div>
            <button class="menu-btn" onclick="closeMenus()">ЗАКРЫТЬ</button>
        </div>

        <div id="admin-menu" class="overlay">
            <h2 style="color:var(--red)">ADMIN</h2>
            <button class="menu-btn" onclick="state.pts+=50; draw();">GIVE 50 PTS</button>
            <button class="menu-btn" onclick="state.lvl=49; win(); closeMenus();">GIVE BOSS 50</button>
            <button class="menu-btn" onclick="localStorage.clear(); location.reload();">RESET</button>
            <button class="menu-btn" onclick="closeMenus()">CLOSE</button>
        </div>
    </div>

    <div class="super-container">
        <div style="width:100%; height:6px; background:#111; border-radius:3px; margin-bottom:4px; overflow:hidden;">
            <div id="en-fill" style="width:0%; height:100%; background:var(--blue); transition: 0.3s;"></div>
        </div>
        <button id="super-btn" onclick="activateSuper()">МОЛОТ ТОРА</button>
    </div>

    <div id="grid"></div>

<script>
    const audio = {
        click: new Audio('click.mp3'), match: new Audio('match.mp3'),
        hit: new Audio('hit.mp3'), win: new Audio('win.mp3'),
        super: new Audio('super.mp3'), bg: new Audio('track_normal.mp3'),
        bgBoss: new Audio('track_boss.mp3')
    };
    audio.bg.loop = true; audio.bgBoss.loop = true;

    let state = {
        lvl: parseInt(localStorage.getItem('v_lvl')) || 1,
        atk: parseInt(localStorage.getItem('v_atk')) || 10,
        mHP: parseInt(localStorage.getItem('v_mhp')) || 100,
        agi: parseInt(localStorage.getItem('v_agi')) || 5,
        pts: parseInt(localStorage.getItem('v_pts')) || 0,
        hp: 100, ehp: 100, mehp: 100, en: 0, bossEn: 0,
        board: [], lockedCells: [], sel: null, isA: false, lock: false, adminHits: 0
    };

    function unlockAudio() { if(!state.isA) { state.isA=true; updateMusic(); } }

    function updateMusic() {
        if (!state.isA) return;
        if (state.lvl % 25 === 0) { audio.bg.pause(); audio.bgBoss.play(); } 
        else { audio.bgBoss.pause(); audio.bg.play(); }
    }

    function init() {
        const isB = state.lvl % 25 === 0;
        const mob = document.getElementById('mob-img');
        
        // Маппинг мобов
        if (isB) {
            if(state.lvl === 25) mob.src = 'boss1.png';
            else if(state.lvl === 50) mob.src = 'boss2.png'; // Демон Бездны
            else mob.src = 'boss3.png';
        } else {
            let idx = Math.floor((state.lvl - 1) / 5) + 1;
            mob.src = `mob${Math.min(idx, 15)}.png`;
        }

        document.getElementById('arena').classList.toggle('boss-active', isB);
        document.getElementById('boss-super-wrap').style.display = isB ? 'block' : 'none';
        
        state.mehp = (100 + (state.lvl * 50)) * (isB ? 5 : 1);
        state.ehp = state.mehp;
        state.hp = state.mHP;
        state.bossEn = 0;
        state.lockedCells = [];

        const g = document.getElementById('grid');
        g.innerHTML = '';
        state.board = [];
        for (let i = 0; i < 49; i++) {
            let t = Math.floor(Math.random() * 5);
            state.board.push(t);
            let c = document.createElement('div');
            c.className = 'cell';
            c.id = 'c-' + i;
            c.style.backgroundImage = `url(rune${t + 1}.png)`;
            c.onclick = () => handleInput(i);
            g.appendChild(c);
        }
        updateMusic();
        draw();
    }

    function handleInput(i) {
        if (state.lock || state.lockedCells.includes(i)) return;
        if (state.isA) audio.click.play();
        if (state.sel === null) state.sel = i;
        else {
            let a = state.sel, b = i;
            if (Math.abs(a - b) === 1 || Math.abs(a - b) === 7) {
                [state.board[a], state.board[b]] = [state.board[b], state.board[a]];
                processMatches();
            }
            state.sel = null;
        }
        draw();
    }

    async function processMatches() {
        state.lock = true;
        let del = new Set();
        for (let i = 0; i < 49; i++) {
            if (i % 7 < 5 && state.board[i] === state.board[i+1] && state.board[i] === state.board[i+2]) { del.add(i); del.add(i+1); del.add(i+2); }
            if (i < 35 && state.board[i] === state.board[i+7] && state.board[i] === state.board[i+14]) { del.add(i); del.add(i+7); del.add(i+14); }
        }

        if (del.size > 0) {
            if (state.isA) audio.match.play();
            state.ehp -= del.size * state.atk;
            popDmg(del.size * state.atk, false);
            del.forEach(idx => { if(state.board[idx] === 1) state.en = Math.min(100, state.en + 8); state.board[idx] = -1; });
            draw();
            await new Promise(r => setTimeout(r, 300));
            gravity();
            draw();
            await new Promise(r => setTimeout(r, 300));
            processMatches();
        } else {
            state.lock = false;
            if (state.ehp <= 0) win(); else enemyTurn();
        }
    }

    function gravity() {
        for (let c = 0; c < 7; c++) {
            let empty = 0;
            for (let r = 6; r >= 0; r--) {
                let i = r * 7 + c;
                if (state.board[i] === -1) empty++;
                else if (empty > 0) { state.board[i + empty * 7] = state.board[i]; state.board[i] = -1; }
            }
            for (let r = 0; r < empty; r++) state.board[r * 7 + c] = Math.floor(Math.random() * 5);
        }
    }

    function enemyTurn() {
        const isB = state.lvl % 25 === 0;
        if (Math.random() * 100 < state.agi) { popDmg("MISS", true); if(isB) state.bossEn += 15; } 
        else {
            let d = 5 + Math.floor(state.lvl / 2.5);
            // Механика Демона Бездны (50 уровень)
            if (state.lvl === 50 && state.bossEn >= 100) {
                state.bossEn = 0;
                popDmg("ОСКВЕРНЕНИЕ!", true);
                for(let i=0; i<5; i++) state.lockedCells.push(Math.floor(Math.random()*49));
                setTimeout(() => { state.lockedCells = []; draw(); }, 6000);
            } else if (isB && state.bossEn >= 100) {
                d *= 2.5; state.bossEn = 0; popDmg("КРИТ!", true);
            } else if (isB) { state.bossEn += 20; }

            state.hp -= d;
            if(state.isA) audio.hit.play();
            popDmg(d, true);
            if (state.hp <= 0) { alert("Game Over"); location.reload(); }
        }
        draw();
    }

    function win() {
        if(state.isA) audio.win.play();
        state.lvl++; state.pts += (state.lvl % 5 === 0) ? 3 : 1;
        save(); init();
    }

    function draw() {
        document.getElementById('lvl-val').innerText = state.lvl;
        document.getElementById('pts-val').innerText = state.pts;
        document.getElementById('pts-txt').className = state.pts > 0 ? 'has-pts' : '';
        document.getElementById('hp-e').style.width = (state.ehp / state.mehp * 100) + '%';
        document.getElementById('hp-p').style.width = (state.hp / state.mHP * 100) + '%';
        document.getElementById('en-fill').style.width = state.en + '%';
        document.getElementById('boss-en-fill').style.width = state.bossEn + '%';
        
        const sBtn = document.getElementById('super-btn');
        if (state.en >= 100) sBtn.classList.add('ready'); else
