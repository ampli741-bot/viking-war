<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking RPG: My Assets Edition</title>
    <style>
        :root { --gold: #ffd700; --accent: #2ecc71; --red: #e74c3c; --blue: #3498db; --purple: #a55eea; --gray: #95a5a6; }
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; text-align: center; overflow: hidden; user-select: none; touch-action: manipulation; height: 100vh; display: flex; flex-direction: column; }

        .header { background: #111; height: 45px; display: flex; justify-content: space-around; align-items: center; border-bottom: 1px solid #333; z-index: 100; font-size: 14px; }
        
        .arena { height: 25vh; background: #0a0a0a; border-bottom: 2px solid #444; display: flex; align-items: center; justify-content: space-around; padding: 10px; position: relative; z-index: 50; }
        .char-box { width: 40%; display: flex; flex-direction: column; align-items: center; cursor: pointer; pointer-events: auto; }
        .p-icon { width: 80px; height: 80px; border-radius: 12px; border: 3px solid #444; background: #111; overflow: hidden; position: relative; }
        .p-icon img { width: 100%; height: 100%; object-fit: cover; }
        
        .bar-bg { width: 100%; height: 14px; background: #222; border-radius: 10px; margin-top: 5px; border: 1px solid #444; position: relative; overflow: hidden; }
        .bar-fill { height: 100%; width: 100%; transition: 0.4s; }
        .bar-text { position: absolute; width: 100%; top: 0; left: 0; font-size: 9px; line-height: 14px; font-weight: bold; text-shadow: 1px 1px #000; }

        .game-space { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #050505; }
        #grid-container { width: 92vw; max-width: 340px; aspect-ratio: 1/1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: #111; padding: 6px; border-radius: 8px; border: 2px solid #333; }
        .cell { background-color: #1a1a1a; background-size: cover; background-repeat: no-repeat; background-position: center; border: 1px solid #333; border-radius: 4px; transition: 0.2s; }
        .cell.vanish { transform: scale(0); opacity: 0; }
        
        #thor-btn { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 2px solid #444; background: #222; color: #fff; font-weight: bold; font-size: 16px; }
        #thor-btn.ready { border-color: var(--blue); box-shadow: 0 0 15px var(--blue); }

        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.96); z-index: 2000; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .card { background: #1a1a1a; border: 2px solid var(--gold); border-radius: 15px; padding: 25px; width: 85%; max-width: 320px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .menu-btn { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: #fff; }

        .rarity-0 { color: var(--gray); } .rarity-1 { color: var(--blue); } .rarity-2 { color: var(--purple); } .rarity-3 { color: var(--gold); text-shadow: 0 0 5px var(--gold); }
        .dmg-text { position: absolute; font-size: 26px; font-weight: bold; animation: fly 1s forwards; z-index: 1000; pointer-events: none; }
        @keyframes fly { 0% { opacity: 0; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
    </style>
</head>
<body>

    <div id="loot-screen" class="overlay">
        <div class="card">
            <h2 id="loot-title" style="margin:0; color:var(--gold)">ТРОФЕЙ НАЙДЕН!</h2>
            <div id="loot-info" style="text-align:left; background:#222; padding:15px; border-radius:10px; margin:15px 0; font-size:14px; border:1px solid #444;"></div>
            <button class="menu-btn" style="background:var(--accent)" onclick="takeLoot()">ВЗЯТЬ И НАДЕТЬ</button>
            <button class="menu-btn" style="background:var(--red)" onclick="closeLoot()">ВЫБРОСИТЬ</button>
        </div>
    </div>

    <div id="info-screen" class="overlay" onclick="closeO()">
        <div class="card" onclick="event.stopPropagation()">
            <div id="info-content" style="text-align: left; line-height: 1.6;"></div>
            <button class="menu-btn" style="background:#444; margin-top:15px;" onclick="closeO()">ЗАКРЫТЬ</button>
        </div>
    </div>

    <div class="header">
        <div onclick="admTrig()" style="cursor:pointer">STG: <span id="lvl">1</span></div>
        <div style="color:var(--accent)">HP: <span id="hp-val">100</span></div>
        <div style="color:var(--purple)">🧴 <span id="bottles-val">0</span></div>
    </div>

    <div class="arena">
        <div class="char-box" onclick="showHeroInfo()">
            <div class="p-icon" style="border-color:var(--accent)">
                <img src="mob14.png" onerror="this.src='https://img.freepik.com/free-photo/view-fierce-viking-warrior_23-2150710034.jpg'">
            </div>
            <div class="bar-bg"><div id="hp-p-fill" class="bar-fill" style="background:var(--accent)"></div><div class="bar-text" id="hp-p-txt">100/100</div></div>
        </div>
        <div class="char-box" onclick="showEnemyInfo()">
            <div class="p-icon" style="border-color:var(--red)">
                <img id="enemy-img" src="mob1.png">
            </div>
            <div class="bar-bg"><div id="hp-e-fill" class="bar-fill" style="background:var(--red)"></div><div class="bar-text" id="hp-e-txt">100/100</div></div>
        </div>
    </div>

    <div class="game-space">
        <div id="grid-container"></div>
        <button id="thor-btn" onclick="useThor()">МОЛОТ ТОРА</button>
    </div>

<script>
    let st = {
        lvl: parseInt(localStorage.getItem('v_lvl')) || 1,
        equip: JSON.parse(localStorage.getItem('v_equip')) || {},
        bAtk: 10, bHP: 100, bAgi: 5,
        atk: 10, mHP: 100, hp: 100, agi: 5, ehp: 0, mehp: 100,
        thor: 0, board: [], sel: null, lock: false, pendingLoot: null, adm: 0
    };

    const RARITY = [
        { n: "Обычное", c: "rarity-0", m: 1 },
        { n: "Редкое", c: "rarity-1", m: 1.8 },
        { n: "Эпическое", c: "rarity-2", m: 3.2 },
        { n: "Легендарное", c: "rarity-3", m: 6.0 }
    ];

    const lootTable = [
        { name: "Топор", slot: "Weapon", stat: "atk", base: 10 },
        { name: "Шлем", slot: "Head", stat: "agi", base: 1 },
        { name: "Броня", slot: "Armor", stat: "hp", base: 100 },
        { name: "Щит", slot: "Shield", stat: "hp", base: 50 }
    ];

    function calcStats() {
        st.atk = st.bAtk; st.mHP = st.bHP; st.agi = st.bAgi;
        Object.values(st.equip).forEach(i => {
            if(i.stat === "atk") st.atk += i.val;
            if(i.stat === "hp") st.mHP += i.val;
            if(i.stat === "agi") st.agi += i.val;
        });
        if(st.hp > st.mHP) st.hp = st.mHP;
    }

    function generateDrop() {
        let rRoll = Math.random() * 100;
        let rIdx = 0;
        if(rRoll > 98) rIdx = 3; else if(rRoll > 80) rIdx = 2; else if(rRoll > 50) rIdx = 1;

        let base = lootTable[Math.floor(Math.random() * lootTable.length)];
        let rarity = RARITY[rIdx];
        let itemLvl = Math.floor(st.lvl / 3) + 1;
        
        st.pendingLoot = {
            name: base.name, slot: base.slot, stat: base.stat,
            rarityIdx: rIdx, val: Math.floor(base.base * itemLvl * rarity.m)
        };

        let cur = st.equip[base.slot];
        document.getElementById('loot-info').innerHTML = `
            <b class="${rarity.c}" style="font-size:18px">${rarity.n} ${base.name}</b><br>
            Слот: <b>${base.slot}</b><br>
            Эффект: <span style="color:var(--accent)">+${st.pendingLoot.val} ${base.stat.toUpperCase()}</span><br><br>
            <div style="border-top:1px solid #444; padding-top:10px; color:#888">
                Сейчас надето: ${cur ? '+' + cur.val : 'ничего'}
            </div>
        `;
        document.getElementById('loot-screen').style.display = 'flex';
    }

    function takeLoot() {
        if(st.pendingLoot) { st.equip[st.pendingLoot.slot] = st.pendingLoot; save(); calcStats(); }
        closeLoot();
    }

    function closeLoot() {
        document.getElementById('loot-screen').style.display = 'none';
        st.pendingLoot = null;
        init();
    }

    function init() {
        calcStats();
        st.mehp = 100 + st.lvl * 90;
        
        // Логика картинок мобов и боссов
        const enemyImg = document.getElementById('enemy-img');
        if (st.lvl % 5 === 0) {
            let bNum = (st.lvl / 5) % 3 + 1;
            enemyImg.src = `boss${bNum}.png`;
            st.mehp *= 5;
        } else {
            let mNum = (st.lvl % 15) + 1;
            enemyImg.src = `mob${mNum}.png`;
        }
        st.ehp = st.mehp;
        
        const g = document.getElementById('grid-container'); g.innerHTML = ''; st.board = [];
        for (let i = 0; i < 49; i++) {
            st.board.push({type: Math.floor(Math.random() * 5) + 1}); // Типы от 1 до 5
            let c = document.createElement('div'); c.className = 'cell'; 
            c.id = 'c-' + i; c.onclick = () => handle(i); g.appendChild(c);
        }
        draw();
    }

    function draw() {
        document.getElementById('lvl').innerText = st.lvl;
        document.getElementById('hp-val').innerText = Math.floor(st.hp);
        document.getElementById('hp-p-fill').style.width = (st.hp/st.mHP*100)+'%';
        document.getElementById('hp-p-txt').innerText = `${Math.floor(st.hp)}/${st.mHP}`;
        document.getElementById('hp-e-fill').style.width = (st.ehp/st.mehp*100)+'%';
        document.getElementById('hp-e-txt').innerText = `${Math.floor(st.ehp)}/${st.mehp}`;
        
        const tb = document.getElementById('thor-btn');
        tb.className = st.thor >= 100 ? 'ready' : '';
        tb.style.background = `linear-gradient(90deg, var(--blue) ${st.thor}%, #222 ${st.thor}%)`;

        st.board.forEach((o, i) => {
            const c = document.getElementById('c-' + i);
            if(o.type === -1) c.classList.add('vanish');
            else {
                c.classList.remove('vanish');
                c.style.backgroundImage = `url(rune${o.type}.png)`; // Твои руны 1-5
            }
        });
    }

    async function resolveBoard() {
        st.lock = true;
        while (true) {
            let toClear = new Set();
            for(let r=0; r<7; r++) {
                for(let c=0; c<7; c++) {
                    let i = r*7+c; if(st.board[i].type === -1) continue;
                    if(c<5 && st.board[i].type===st.board[i+1].type && st.board[i].type===st.board[i+2].type) {
                        for(let k=0; k<3; k++) toClear.add(i+k);
                    }
                    if(r<5 && st.board[i].type===st.board[i+7].type && st.board[i].type===st.board[i+14].type) {
                        for(let k=0; k<3; k++) toClear.add(i+k*7);
                    }
                }
            }
            if (toClear.size === 0) break;
            
            toClear.forEach(i => document.getElementById('c-'+i).classList.add('vanish'));
            await new Promise(r => setTimeout(r, 300));
            
            let d = toClear.size * st.atk;
            st.ehp -= d; pop("-"+d, 'var(--gold)');
            st.thor = Math.min(100, st.thor + toClear.size * 2);
            toClear.forEach(i => st.board[i].type = -1);
            draw();
            await new Promise(r => setTimeout(r, 200));
            fillBoard(); draw();
            await new Promise(r => setTimeout(r, 300));
        }

        if (st.ehp <= 0) {
            st.lvl++; save(); 
            generateDrop();
        } else {
            enemyTurn();
        }
        st.lock = false;
    }

    function enemyTurn() {
        let d = Math.floor(5 + st.lvl * 3);
        if(Math.random()*100 > st.agi) { st.hp -= d; pop("-"+d, "var(--red)"); }
        else pop("MISS", "#fff");
        if(st.hp <= 0) { alert("Вы погибли!"); location.reload(); }
        draw();
    }

    function fillBoard() {
        for(let c=0; c<7; c++) {
            let e=0; for(let r=6; r>=0; r--) {
                let i=r*7+c; if(st.board[i].type===-1) e++;
                else if(e>0) { st.board[i+e*7]={...st.board[i]}; st.board[i].type=-1; }
            }
            for(let r=0; r<e; r++) st.board[r*7+c]={type:Math.floor(Math.random()*5)+1};
        }
    }

    function handle(i) {
        if(st.lock || st.pendingLoot) return;
        if(st.sel === null) {
            st.sel = i;
            document.getElementById('c-'+i).style.boxShadow = "0 0 10px #fff inset";
        } else {
            let a = st.sel, b = i;
            document.getElementById('c-'+a).style.boxShadow = "none";
            if(Math.abs(a-b)===1 || Math.abs(a-b)===7) {
                let t = {...st.board[a]}; st.board[a] = {...st.board[b]}; st.board[b] = t;
                resolveBoard(); st.sel = null;
            } else st.sel = i;
        }
    }

    function showHeroInfo() {
        let inv = "";
        Object.keys(st.equip).forEach(slot => {
            let i = st.equip[slot];
            inv += `<div class="${RARITY[i.rarityIdx].c}"><b>${slot}:</b> ${i.name} (+${i.val})</div>`;
        });
        
        document.getElementById('info-content').innerHTML = `
            <h3 style="color:var(--accent); margin:0 0 10px 0;">ХАРАКТЕРИСТИКИ</h3>
            ⚔️ Атака: ${st.atk}<br>
            ❤️ Здоровье: ${st.hp} / ${st.mHP}<br>
            🍃 Ловкость: ${st.agi}%<br><br>
            <h3 style="color:var(--gold); margin:0 0 10px 0;">ЭКИПИРОВКА</h3>
            ${inv || "Пусто"}
        `;
        document.getElementById('info-screen').style.display = 'flex';
    }

    function showEnemyInfo() {
        document.getElementById('info-content').innerHTML = `
            <h3 style="color:var(--red); margin:0 0 10px 0;">ПРОТИВНИК</h3>
            Уровень: ${st.lvl}<br>
            ❤️ Здоровье: ${Math.floor(st.ehp)} / ${st.mehp}<br>
            ⚔️ Урон: ~${Math.floor(5 + st.lvl * 3)}
        `;
        document.getElementById('info-screen').style.display = 'flex';
    }

    function admTrig() { st.adm++; if(st.adm>=5) { st.adm=0; document.getElementById('admin-screen').style.display='flex'; } }
    function adminAction(a) { 
        if(a==='hp') st.hp=st.mHP; 
        if(a==='lvl') { let l=prompt("Этап:"); if(l) st.lvl=parseInt(l); }
        save(); closeO(); init(); 
    }

    function useThor() {
        if(st.thor < 100 || st.lock) return;
        st.thor = 0; st.board.forEach(o => { if(Math.random()>0.5) o.type = -1; });
        draw(); fillBoard(); resolveBoard();
    }

    function save() { localStorage.setItem('v_lvl', st.lvl); localStorage.setItem('v_equip', JSON.stringify(st.equip)); }
    function closeO() { document.querySelectorAll('.overlay').forEach(o => o.style.display='none'); }
    function pop(t, c) {
        const p = document.createElement('div'); p.className = 'dmg-text';
        p.innerText = t; p.style.color = c; p.style.left = '50%'; p.style.top = '25%';
        document.body.appendChild(p); setTimeout(() => p.remove(), 1000);
    }
    init();
</script>
</body>
</html>
