<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Viking Debug</title>
    <style>
        body { background: #001a33; color: white; text-align: center; font-family: sans-serif; }
        #grid { 
            display: grid; 
            grid-template-columns: repeat(7, 40px); 
            gap: 5px; 
            width: 310px; 
            margin: 20px auto; 
            background: #444; 
            padding: 10px;
            min-height: 310px;
        }
        .cell { 
            width: 40px; height: 40px; 
            background: #666; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 20px; border-radius: 4px;
        }
        .hp { width: 300px; height: 10px; background: red; margin: 10px auto; }
        .btn { padding: 10px 20px; background: orange; border: none; font-weight: bold; }
    </style>
</head>
<body>

    <h2>УРОВЕНЬ <span id="lvl">1</span></h2>
    <div class="hp" id="hp-bar"></div>
    <div id="mob" style="font-size: 50px;">👹</div>
    
    <div id="grid">
        </div>

    <button class="btn" onclick="useSuper()">УДАР МОЛОТОМ</button>

<script>
    // Если ты видишь синий фон, значит CSS загрузился.
    // Если увидишь квадраты ниже - значит JS работает.
    
    const icons = ['🔥', '💧', '🌿', '⭐', '🛡️'];
    let board = [];
    let hp = 100;

    function start() {
        console.log("Игра запускается...");
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        board = [];

        for (let i = 0; i < 49; i++) {
            let type = Math.floor(Math.random() * 5);
            board.push(type);

            let div = document.createElement('div');
            div.className = 'cell';
            div.id = 'tile-' + i;
            div.innerText = icons[type];
            div.onclick = () => clickTile(i);
            grid.appendChild(div);
        }
        console.log("Сетка создана");
    }

    function clickTile(i) {
        // Упрощенное удаление при клике для теста
        document.getElementById('tile-' + i).style.background = 'white';
        setTimeout(() => {
            board[i] = Math.floor(Math.random() * 5);
            document.getElementById('tile-' + i).innerText = icons[board[i]];
            document.getElementById('tile-' + i).style.background = '#666';
        }, 200);
    }

    function useSuper() {
        hp -= 20;
        document.getElementById('hp-bar').style.width = hp + '%';
        alert("БУМ! Супер удар сработал.");
        if(hp <= 0) location.reload();
    }

    // Запуск немедленно
    start();
</script>
</body>
</html>
