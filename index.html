<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Hardcore Edition</title>
    <style>
        :root { --gold: #ffd700; --accent: #2ecc71; --red: #e74c3c; --blue: #3498db; --purple: #a55eea; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; text-align: center; overflow: hidden; user-select: none; touch-action: manipulation; }
        
        /* Панель статуса */
        .header { background: #151515; height: 55px; display: flex; justify-content: space-around; align-items: center; border-bottom: 3px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.8); position: relative; z-index: 100; }
        #pts-txt { font-weight: bold; padding: 6px 15px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; transition: all 0.3s; }
        .has-pts { color: var(--accent); border-color: var(--accent); background: rgba(46, 204, 113, 0.1); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0px var(--accent); } 50% { box-shadow: 0 0 15px var(--accent); } 100% { box-shadow: 0 0 0px var(--accent); } }

        /* Игровая зона */
        .arena { max-width: 500px; height: 250px; margin: 0 auto; position: relative; background: #080808; overflow: hidden; border-bottom: 2px solid #222; }
        .boss-active { background: radial-gradient(circle at center, #700 0%, #000 100%) !important; }
        #mob-img { height: 150px; position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); z-index: 5; filter: drop-shadow(0 0 10px #000); }
        
        .bar-wrap { width: 92%; height: 18px; background: #222; margin: 8px auto; border-radius: 9px; border: 1px solid #444; overflow: hidden; position: relative; z-index: 10; }
        .bar-fill { height: 100%; width: 100%; transition: 0.5s cubic-bezier(0.1, 0.9, 0.2, 1); }

        /* Шкала ульты БОССА */
        #boss-super-wrap { width: 70%; height: 8px; background: #111; margin: -5px auto 5px; border-radius: 4px; border: 1px solid #444; overflow: hidden; display: none; position: relative; z-index: 11; }
        #boss-en-fill { height: 100%; width: 0%; background: var(--purple); transition: 0.3s; }

        /* Поле боя */
        #grid { width: 322px; margin: 15px auto; line-height: 0; background: #111; padding: 8px; border-radius: 15px; border: 3px solid #333; box-shadow: inset 0 0 30px #000; }
        .cell { display: inline-block; width: 42px; height: 42px; margin: 2px; background-size: cover; background-position: center; background-color: #222; border-radius: 8px; cursor: pointer; transition: transform 0.1s, box-shadow 0.2s; box-sizing: border-box; }
        .selected { border: 3px solid #fff; box-shadow: 0 0 20px #fff; transform: scale(0.8); z-index: 50; position: relative; }

        /* Оверлеи (Меню) */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 1000; display: none; flex-direction: column; justify-content: flex-start; align-items: center; backdrop-filter: blur(8px); overflow-y: auto; padding: 40px 0; box-sizing: border-box; }
        .menu-btn { width: 240px; padding: 18px; margin: 12px; border: none; border-radius: 10px; background: #252525; color: #fff; font-weight: bold; font-size: 18px; cursor: pointer; border: 1px solid #444; transition: 0.3s; flex-shrink: 0; }
        .buy-btn { background: var(--accent) !important; color: #000 !important; border: none; }
        
        /* Всплывающий урон */
        .dmg-text { position: absolute; font-size: 32px; font-weight: 900; pointer-events: none; animation: flyUp 0.8s ease-out forwards; z-index: 200; text-shadow: 3px 3px #000; }
        @keyframes flyUp { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -100px); } }

        /* Ульта Игрока */
        .super-container { width: 310px; margin: 10px auto; }
        #super-btn { width: 100%; padding: 15px; background: #222; color: #666; border: 2px solid #333; border-radius: 10px; font-weight: bold; font-size: 16px; transition: 0.4s; }
        #super-btn.ready { background: var(--blue) !important; color: #fff !important; border-color: #fff; cursor: pointer; box-shadow: 0 0 20px var(--blue); }
    </style>
</head>
