<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Stable Grid</title>
    <style>
        :root { --gold: #f1c40f; --red: #e74c3c; --green: #2ecc71; --blue: #3498db; }
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 0; text-align: center; overflow-x: hidden; }
        
        /* Админ-панель: не двигает контент */
        #admin-panel { display: none; background: #c0392b; padding: 5px; font-size: 12px; }
        .admin-btn { background: #fff; color: #000; border: none; padding: 3px 8px; margin: 0 2px; border-radius: 3px; font-weight: bold; font-size: 10px; }

        .header { background: #1a1a1a; padding: 8px; border-bottom: 2px solid #333; display: flex; justify-content: space-around; align-items: center; }
        .arena { height: 130px; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .hp-bar { width: 90%; height: 10px; background: #333; margin: 3px; border-radius: 5px; border: 1px solid #444; overflow: hidden; }
        .fill { height: 100%; transition: 0.3s; width: 100%; }
        #mob { height: 70px; width: auto; }

        /* СЕТКА: Жесткие размеры, чтобы не исчезала */
        #grid { 
            display: grid; 
            grid-template-columns: repeat(7, 40px); 
            grid-template-rows: repeat(7, 40px); 
            gap: 5px; 
            margin: 15px auto; 
            width: 310px; /* 7 * 40 + 6 * 5 */
            height: 310px;
            justify-content: center;
        }
        .cell { 
            width: 40px; 
            height: 40px; 
            background-size: cover; 
            background-position: center; 
            border-radius: 4px; 
            border: 1px solid #222; 
            background-color: #111; /* Цвет фона, если картинка не грузится */
        }
        .sel { outline: 3px solid #fff; transform: scale(0.9); z-index: 10; box-shadow: 0 0 10px gold; }
        
        .footer { padding-bottom: 20px; }
        .btn { width: 90%; padding: 12px; border: none; border-radius: 8px; background: #444; color: #888; font-weight: bold; }
        .ready { background: linear-gradient(orange, darkorange) !important; color: #fff !important; }

        #ban-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #msg { position: absolute; top: 40%; width: 100%; font-weight: bold; background: rgba(0,0,0,0.9); display: none; padding: 15px 0; z-index: 100; color: gold; }
    </style>
</head>
<body>

    <div id="admin-panel">
        <button class="admin-btn" onclick="changeLvl(-1)">-1 УР</button>
        <button class="admin-btn" onclick="changeLvl(1)">+1 УР</button>
        <button class="admin-btn" onclick="s.en=100;draw();">MAX ⚡</button>
    </div>

    <div id="ban-screen">
        <h2 style="color: var(--red);">ВЫ РАНЕНЫ</h2>
        <div id="timer" style="font-size: 30px; color: gold; margin-bottom: 20px;">60:00</div>
        <button id="admin-skip" style="display:none; padding:10px; background:green; color:white; border:none; border-radius:5px;" onclick="skipBan()">АДМИН: ВОСКРЕСНУТЬ</button>
    </div>

    <div class="header">
        <div id="best-display" style="font-size: 11px; opacity: 0.6;" onclick="adminClick()">РЕКОРД: 1</div>
        <div id="lvl-display" style="color: gold; font-weight: bold;">УРОВЕНЬ 1</div>
    </div>

    <div class="arena">
        <div id="msg"></div>
        <div class="hp-bar"><div id="ehp" class="fill" style="background: var(--red);"></div></div>
        <img id="mob" src="mob1.png" onerror="this.src='https://via.placeholder.com/70/red?text=MOB'">
        <div class="hp-bar"><div id="php" class="fill" style="background: var(--green);"></div></div>
    </div>

    <div id="grid"></div>

    <div class="footer">
        <div style="height: 6px; width: 90%; background: #222; margin: 0 auto 10px; border-radius: 3px; overflow: hidden; border: 1px solid #333;">
            <div id="en-fill" style="width: 0%; height: 100%; background: var(--blue); transition: 0.3s;"></div>
        </div>
        <button id="s-btn" class="btn" onclick="useSuper()">УДАР МОЛОТОМ</button>
    </div>

<script>
    const runes = ['rune1.png', 'rune2.png', 'rune3.png', 'rune4.png', 'rune5.png'];
    const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#95a5a6'];
    
    let adminHits = 0;
    let isAdmin = localStorage.getItem('v_admin') === 'true';
    let audioCtx = null;

    let s = {
        lvl: parseInt(localStorage.getItem('v_lvl')) || 1,
        best: parseInt(localStorage.getItem('v_best')) || 1,
        en: parseInt(localStorage.getItem('v_en')) || 0,
        hp: 100, ehp: 100, lock: false, stun: 0, board: [], sel: null
    };

    function playSound(freq, type = 'sine', duration = 0.1) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    function adminClick() {
        adminHits++;
        if (adminHits >= 5) {
            isAdmin = true;
            localStorage.setItem('v_admin', 'true');
            showAdminUI();
            alert("ADMIN ACTIVE");
        }
    }

    function showAdminUI() {
        if (isAdmin) {
            document.getElementById('admin-panel').style.display = 'block';
            document.getElementById('admin-skip').style.display = 'block';
        }
    }

    function changeLvl(val) {
        s.lvl = Math.max(1, s.lvl + val);
        saveAll();
        init();
    }

    function skipBan() {
        localStorage.removeItem('v_ban');
        location.reload();
    }

    function saveAll() {
        localStorage.setItem('v_lvl', s.lvl);
        localStorage.setItem('v_en', s.en);
        if (s.lvl > s.best) { s.best = s.lvl; localStorage.setItem('v_best', s.best); }
    }

    function init() {
        const ban = localStorage.getItem('v_ban');
        if (ban && Date.now() < ban) {
            document.getElementById('ban-screen').style.display = 'flex';
            showAdminUI();
            setInterval(() => {
                let d = ban - Date.now();
                if (d <= 0) location.reload();
                let m = Math.floor(d/60000), sc = Math.floor((d%60000)/1000);
                document.getElementById('timer').innerText = `${m}:${sc<10?'0':''}${sc}`;
            }, 1000);
            return;
        }

        showAdminUI();
        saveAll();
        
        document.getElementById('lvl-display').innerText = "УРОВЕНЬ " + s.lvl;
        document.getElementById('best-display').innerText = "РЕКОРД: " + s.best;
        
        s.maxEHP = 100 + (s.lvl > 10 ? (s.lvl - 10) * 60 + 200 : s.lvl * 25);
        s.ehp = s.maxEHP;
        s.hp = 100;

        const g = document.getElementById('grid');
        g.innerHTML = ''; 
        s.board = [];
        for (let i = 0; i < 49; i++) {
            s.board.push(Math.floor(Math.random() * 5));
            let c = document.createElement('div');
            c.className = 'cell';
            c.id = 'c' + i;
            c.onclick = () => touch(i);
            g.appendChild(c);
        }
        draw();
    }

    function draw() {
        s.board.forEach((t, i) => {
            const c = document.getElementById('c' + i);
            if (!c) return;
            if (t === -1) {
                c.style.backgroundImage = 'none';
                c.style.backgroundColor = '#111';
            } else {
                c.style.backgroundColor = colors[t];
                c.style.backgroundImage = "url(" + runes[t] + ")";
            }
            c.classList.
