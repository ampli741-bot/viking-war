<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking War Extreme</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #121212; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; user-select: none; }
        .stats { display: flex; justify-content: space-around; padding: 15px; background: #1e1e1e; border-bottom: 3px solid #333; }
        .hp-container { width: 40%; }
        .hp-bar { height: 12px; background: #333; border-radius: 6px; margin-top: 5px; border: 1px solid #555; }
        .hp-fill { height: 100%; background: #ff3e3e; width: 100%; transition: width 0.4s ease; }
        
        #game-board { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 4px; 
            padding: 10px; 
            margin: 10px auto;
            max-width: 380px;
            background: #222;
            border-radius: 10px;
            position: relative;
        }
        .cell { 
            aspect-ratio: 1/1; 
            background: #2a2a2a; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 30px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .cell.selected { background: #444; transform: scale(0.9); outline: 2px solid #f1c40f; }
        .cell.match { animation: explode 0.3s forwards; }
        
        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="stats">
        <div class="hp-container">🛡️ ВИКИНГ<div class="hp-bar"><div id="player-hp" class="hp-fill"></div></div></div>
        <div class="hp-container">💀 ВРАГ<div class="hp-bar"><div id="enemy-hp" class="hp-fill"></div></div></div>
    </div>

    <div id="game-board"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const board = document.getElementById('game-board');
        const width = 7;
        const runes = ['🔥', '❄️', '⚡', '🌿', '💎'];
        let cells = [];
        let selectedId = null;
        let playerHP = 100;
        let enemyHP = 100;

        // 1. Создание поля
        function initBoard() {
            for (let i = 0; i < width * width; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.setAttribute('id', i);
                cell.innerHTML = runes[Math.floor(Math.random() * runes.length)];
                cell.onclick = () => handleClick(i);
                board.appendChild(cell);
                cells.push(cell);
            }
            checkMatches();
        }

        // 2. Логика клика и проверки "соседства"
        function handleClick(id) {
            if (selectedId === null) {
                selectedId = id;
                cells[selectedId].classList.add('selected');
            } else {
                const moveValid = [id-1, id+1, id-width, id+width].includes(selectedId);
                if (moveValid) {
                    swap(id, selectedId);
                    if (!checkMatches()) {
                        setTimeout(() => swap(id, selectedId), 300); // Откат если нет совпадений
                    } else {
                        setTimeout(enemyTurn, 1000); // Враг бьет в ответ
                    }
                }
                cells[selectedId].classList.remove('selected');
                selectedId = null;
            }
        }

        function swap(id1, id2) {
            let temp = cells[id1].innerHTML;
            cells[id1].innerHTML = cells[id2].innerHTML;
            cells[id2].innerHTML = temp;
        }

        // 3. Поиск матчей и "падение" рун
        function checkMatches() {
            let hasMatches = false;
            let toRemove = new Set();

            // Горизонтали
            for (let i = 0; i < 49; i++) {
                if (i % 7 < 5 && cells[i].innerHTML === cells[i+1].innerHTML && cells[i].innerHTML === cells[i+2].innerHTML) {
                    toRemove.add(i); toRemove.add(i+1); toRemove.add(i+2);
                }
            }
            // Вертикали
            for (let i = 0; i < 35; i++) {
                if (cells[i].innerHTML === cells[i+width].innerHTML && cells[i].innerHTML === cells[i+width*2].innerHTML) {
                    toRemove.add(i); toRemove.add(i+width); toRemove.add(i+width*2);
                }
            }

            if (toRemove.size > 0) {
                hasMatches = true;
                damageEnemy(toRemove.size * 2);
                toRemove.forEach(id => {
                    cells[id].innerHTML = '';
                });
                setTimeout(fillEmpty, 400);
            }
            return hasMatches;
        }

        function fillEmpty() {
            for (let i = 48; i >= 0; i--) {
                if (cells[i].innerHTML === '') {
                    let top = i - width;
                    while (top >= 0 && cells[top].innerHTML === '') top -= width;
                    
                    if (top >= 0) {
                        cells[i].innerHTML = cells[top].innerHTML;
                        cells[top].innerHTML = '';
                    } else {
                        cells[i].innerHTML = runes[Math.floor(Math.random() * runes.length)];
                    }
                }
            }
            setTimeout(checkMatches, 300);
        }

        // 4. Логика боя
        function damageEnemy(dmg) {
            enemyHP -= dmg;
            document.getElementById('enemy-hp').style.width = Math.max(0, enemyHP) + '%';
            if (enemyHP <= 0) { alert("ПОБЕДА!"); tg.close(); }
        }

        function enemyTurn() {
            let dmg = Math.floor(Math.random() * 10) + 5;
            playerHP -= dmg;
            document.getElementById('player-hp').style.width = Math.max(0, playerHP) + '%';
            if (playerHP <= 0) { alert("ВЫ РАНЕНЫ!"); tg.close(); }
        }

        initBoard();
    </script>
</body>
</html>
