<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Hardcore Edition (Full Build)</title>
    <style>
        :root { 
            --gold: #ffd700; 
            --accent: #2ecc71; 
            --red: #e74c3c; 
            --blue: #3498db; 
            --purple: #a55eea; 
            --bg: #000; 
            --cell-bg: #222;
        }

        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            text-align: center; 
            overflow: hidden; 
            user-select: none; 
            touch-action: manipulation; 
        }

        /* Шапка с индикаторами */
        .header { 
            background: linear-gradient(to bottom, #222, #111); 
            height: 60px; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            border-bottom: 3px solid #444; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.9); 
            position: relative; 
            z-index: 100; 
        }

        .lvl-badge { color: var(--gold); font-size: 20px; font-weight: bold; cursor: pointer; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
        
        #pts-txt { 
            font-weight: bold; 
            padding: 8px 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            border: 1px solid #444; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .has-pts { 
            color: var(--accent); 
            border-color: var(--accent); 
            background: rgba(46, 204, 113, 0.15); 
            animation: pts-pulse 1.5s infinite; 
        }

        @keyframes pts-pulse {
            0% { transform: scale(1); box-shadow: 0 0 0px var(--accent); }
            50% { transform: scale(1.05); box-shadow: 0 0 15px var(--accent); }
            100% { transform: scale(1); box-shadow: 0 0 0px var(--accent); }
        }

        /* Арена с врагом */
        .arena { 
            max-width: 500px; 
            height: 270px; 
            margin: 0 auto; 
            position: relative; 
            background: #080808; 
            overflow: hidden; 
            border-bottom: 4px solid #222; 
            transition: background 1s;
        }

        .boss-active { background: radial-gradient(circle at center, #500 0%, #000 100%) !important; }
        .abyss-active { background: radial-gradient(circle at center, #301 0%, #000 100%) !important; animation: abyss-vibe 3s infinite; }

        @keyframes abyss-vibe {
            0% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(30deg) brightness(1.2); }
            100% { filter: hue-rotate(0deg); }
        }

        #mob-img { 
            height: 180px; 
            position: absolute; 
            top: 55%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            z-index: 5; 
            filter: drop-shadow(0 0 20px #000); 
            transition: all 0.5s ease;
        }

        /* Полоски здоровья */
        .bar-wrap { 
            width: 90%; 
            height: 18px; 
            background: #1a1a1a; 
            margin: 10px auto; 
            border-radius: 9px; 
            border: 2px solid #333; 
            overflow: hidden; 
            position: relative; 
            z-index: 10; 
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .bar-fill { 
            height: 100%; 
            width: 100%; 
            transition: width 0.6s cubic-bezier(0.17, 0.67, 0.83, 0.67); 
        }

        /* Шкала ульты босса */
        #boss-super-wrap { 
            width: 65%; 
            height: 8px; 
            background: #111; 
            margin: -5px auto 5px; 
            border-radius: 4px; 
            border: 1px solid #444; 
            overflow: hidden; 
            display: none; 
            position: relative; 
            z-index: 11; 
        }

        #boss-en-fill { height: 100%; width: 0%; background: var(--purple); transition: 0.3s; }

        /* Игровое поле */
        #grid { 
            width: 322px; 
            margin: 15px auto; 
            line-height: 0; 
            background: #111; 
            padding: 10px; 
            border-radius: 18px; 
            border: 4px solid #333; 
            box-shadow: inset 0 0 40px #000, 0 10px 30px rgba(0,0,0,0.5); 
        }

        .cell { 
            display: inline-block; 
            width: 42px; 
            height: 42px; 
            margin: 2px; 
            background-size: 80%; 
            background-repeat: no-repeat;
            background-position: center; 
            background-color: var(--cell-bg); 
            border-radius: 8px; 
            cursor: pointer; 
            transition: transform 0.1s, box-shadow 0.2s, background-color 0.3s; 
            box-sizing: border-box; 
        }

        .selected { border: 3px solid #fff; box-shadow: 0 0 20px #fff; transform: scale(0.85); z-index: 50; position: relative; }
        
        .locked-cell { 
            filter: grayscale(1) contrast(1.5); 
            background-color: #301 !important; 
            border: 2px solid var(--purple); 
            pointer-events: none; 
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0% { transform: translate(0); }
            25% { transform: translate(1px, -1px); }
            50% { transform: translate(-1px, 1px); }
            100% { transform: translate(0); }
        }

        /* Меню и оверлеи */
        .overlay { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.98); 
            z-index: 1000; 
            display: none; 
            flex-direction: column; 
            justify-content: flex-start; 
            align-items: center; 
            backdrop-filter: blur(12px); 
            overflow-y: auto; 
            padding: 50px 0; 
            box-sizing: border-box; 
        }

        .menu-btn { 
            width: 260px; 
            padding: 20px; 
            margin: 10px; 
            border: none; 
            border-radius: 12px; 
            background: #2a2a2a; 
            color: #fff; 
            font-weight: bold; 
            font-size: 18px; 
            cursor: pointer; 
            border: 1px solid #444; 
            transition: 0.2s; 
            flex-shrink: 0; 
        }

        .menu-btn:active { transform: scale(0.95); background: #333; }
        .buy-btn { background: var(--accent) !important; color: #000 !important; border: none; }
        
        /* Всплывающий урон */
        .dmg-text { 
            position: absolute; 
            font-size: 36px; 
            font-weight: 900; 
            pointer-events: none; 
            animation: flyUp 0.9s ease-out forwards; 
            z-index: 200; 
            text-shadow: 4px 4px #000; 
        }

        @keyframes flyUp { 
            0% { opacity: 1; transform: translate(-50%, 0) scale(1); } 
            100% { opacity: 0; transform: translate(-50%, -120px) scale(1.5); } 
        }

        /* Панель Ульты Игрока */
        .super-container { width: 320px; margin: 12px auto; }
        #super-btn { 
            width: 100%; 
            padding: 16px; 
            background: #222; 
            color: #666; 
            border: 2px solid #333; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 18px; 
            transition: 0.4s; 
        }
        #super-btn.ready { 
            background: var(--blue) !important; 
            color: #fff !important; 
            border-color: #fff; 
            cursor: pointer; 
            box-shadow: 0 0 25px var(--blue); 
        }
    </style>
</head>
<body onclick="unlockAudioContext()">

    <div class="header">
        <div class="lvl-badge" onclick="adminClick()">LVL <span id="lvl-val">1</span></div>
        <div id="pts-txt" onclick="openForge()">PTS: <span id="pts-val">0</span></div>
        <div onclick="openInfo()" style="cursor:pointer; font-size: 24px;">🛡️</div>
    </div>

    <div class="arena" id="arena">
        <div class="bar-wrap"><div id="hp-e" class="bar-fill" style="background:var(--red)"></div></div>
        
        <div id="boss-super-wrap"><div id="boss-en-fill"></div></div>

        <img id="mob-img" src="mob1.png">
        <div class="bar-wrap"><div id="hp-p" class="bar-fill" style="background:var(--accent)"></div></div>

        <div id="forge-menu" class="overlay">
            <h1 style="color:var(--gold); margin-bottom: 5px;">КУЗНИЦА</h1>
            <p style="margin-bottom: 25px; opacity: 0.8;">Доступно очков: <span id="pts-forge">0</span></p>
            <button class="menu-btn buy-btn" onclick="buyStat('atk')">АТАКА (+2)</button>
            <button class="menu-btn buy-btn" onclick="buyStat('hp')">ЗДОРОВЬЕ (+20)</button>
            <button class="menu-btn buy-btn" onclick="buyStat('agi')">ЛОВКОСТЬ (+1%)</button>
            <button class="menu-btn" onclick="closeMenus()">ВЕРНУТЬСЯ</button>
        </div>

        <div id="info-menu" class="overlay">
            <h1 style="color:var(--gold)">ГЕРОЙ</h1>
            <div id="hero-stats" style="font-size: 24px; line-height: 2.2; margin: 20px 0;"></div>
            <button class="menu-btn buy-btn" onclick="closeMenus()">ЗАКРЫТЬ</button>
        </div>

        <div id="admin-menu" class="overlay">
            <h1 style="color:var(--red)">MODERATOR</h1>
            <button class="menu-btn" onclick="state.pts += 100; draw();">ЧИТ: +100 PTS</button>
            <button class="menu-btn" onclick="jumpTo(25)">ПРЫЖОК: 25 LVL (BOSS)</button>
            <button class="menu-btn" onclick="jumpTo(50)">ПРЫЖОК: 50 LVL (DEMON)</button>
            <button class="menu-btn" onclick="jumpTo(75)">ПРЫЖОК: 75 LVL (HELL)</button>
            <button class="menu-btn" onclick="localStorage.clear(); location.reload();" style="background: #500;">СБРОСИТЬ СОХРАНЕНИЯ</button>
            <button class="menu-btn" onclick="closeMenus()">ЗАКРЫТЬ</button>
        </div>
    </div>

    <div class="super-container">
        <div style="width:100%; height:10px; background:#111; border-radius:5px; margin-bottom:8px; overflow:hidden; border: 1px solid #333;">
            <div id="en-fill" style="width:0%; height:100%; background:var(--blue); transition: 0.3s;"></div>
        </div>
        <button id="super-btn" onclick="activateSuper()">МОЛОТ ТОРА</button>
    </div>

    <div id="grid"></div>

<script>
    // --- КОНФИГУРАЦИЯ ЗВУКА ---
    const audio = {
        click: new Audio('click.mp3'),
        match: new Audio('match.mp3'),
        hit: new Audio('hit.mp3'),
        win: new Audio('win.mp3'),
        super: new Audio('super.mp3'),
        bg: new Audio('track_normal.mp3'),
        bgBoss: new Audio('track_boss.mp3')
    };
    audio.bg.loop = true;
    audio.bgBoss.loop = true;

    // --- СОСТОЯНИЕ ИГРЫ ---
    let state = {
        lvl: parseInt(localStorage.getItem('v_lvl')) || 1,
        atk: parseInt(localStorage.getItem('v_atk')) || 10,
        mHP: parseInt(localStorage.getItem('v_mhp')) || 100,
        agi: parseInt(localStorage.getItem('v_agi')) || 5,
        pts: parseInt(localStorage.getItem('v_pts')) || 0,
        hp: 100, ehp: 100, mehp: 100,
        en: 0, bossEn: 0,
        board: [],
        lockedCells: [], // Массив индексов заблокированных ячеек
        sel: null,
        isA: false,
        lock: false,
        adminHits: 0
    };

    function unlockAudioContext() {
        if (state.isA) return;
        state.isA = true;
        updateMusic();
    }

    function updateMusic() {
        if (!state.isA) return;
        const isB = state.lvl % 25 === 0;
        if (isB) { 
            audio.bg.pause(); 
            audio.bgBoss.play().catch(()=>{}); 
        } else { 
            audio.bgBoss.pause(); 
            audio.bg.play().catch(()=>{}); 
        }
    }

    // --- ИНИЦИАЛИЗАЦИЯ УРОВНЯ ---
    function init() {
        const isB = state.lvl % 25 === 0;
        const arena = document.getElementById('arena');
        const mob = document.getElementById('mob-img');
        const bossBar = document.getElementById('boss-super-wrap');

        // Стили арены
        arena.classList.toggle('boss-active', isB);
        arena.classList.toggle('abyss-active', state.lvl === 50);
        
        // Выбор картинки моба (каждые 5 уровней новый моб)
        if (isB) {
            if (state.lvl === 25) mob.src = 'boss1.png';
            else if (state.lvl === 50) mob.src = 'boss2.png'; // Твой Демон Бездны
            else mob.src = 'boss3.png';
        } else {
            let step = Math.floor((state.lvl - 1) / 5) + 1;
            mob.src = `mob${Math.min(step, 15)}.png`;
        }

        bossBar.style.display = isB ? 'block' : 'none';
        state.bossEn = 0;
        state.lockedCells = []; // Очистка блоков при новом уровне

        // Статы врага
        state.mehp = (100 + (state.lvl * 55)) * (isB ? 5 : 1);
        state.ehp = state.mehp;
        state.hp = state.mHP;

        // Генерация поля
        const g = document.getElementById('grid');
        g.innerHTML = '';
        state.board = [];

        for (let i = 0; i < 49; i++) {
            const type = Math.floor(Math.random() * 5);
            state.board.push(type);
            const c = document.createElement('div');
            c.className = 'cell';
            c.id = 'c-' + i;
            c.style.backgroundImage = `url(rune${type + 1}.png)`;
            c.onclick = () => handleInput(i);
            g.appendChild(c);
        }
        updateMusic();
        draw();
    }

    // --- ЛОГИКА MATCH-3 ---
    function handleInput(i) {
        if (state.lock || state.lockedCells.includes(i)) return;
        if (state.isA) { audio.click.currentTime = 0; audio.click.play(); }

        if (state.sel === null) {
            state.sel = i;
        } else {
            const a = state.sel;
            const b = i;
            // Проверка на соседство
            const isAdj = (Math.abs(a - b) === 1 && Math.floor(a/7) === Math.floor(b/7)) || Math.abs(a - b) === 7;
            
            if (isAdj && !state.lockedCells.includes(b)) {
                [state.board[a], state.board[b]] = [state.board[b], state.board[a]];
                processMatches();
            }
            state.sel = null;
        }
        draw();
    }

    async function processMatches() {
        state.lock = true;
        let del = new Set();

        // Поиск горизонтальных и вертикальных троек
        for (let i = 0; i < 49; i++) {
            if (i % 7 < 5 && state.board[i] !== -1 && state.board[i] === state.board[i+1] && state.board[i] === state.board[i+2]) {
                del.add(i); del.add(i+1); del.add(i+2);
            }
            if (i < 35 && state.board[i] !== -1 && state.board[i] === state.board[i+7] && state.board[i] === state.board[i+14]) {
                del.add(i); del.add(i+7); del.add(i+14);
            }
        }

        if (del.size > 0) {
            if (state.isA) { audio.match.currentTime = 0; audio.match.play(); }
            
            let totalDmg = del.size * state.atk;
            state.ehp -= totalDmg;
            popDmg(totalDmg, false);

            del.forEach(idx => {
                if (state.board[idx] === 1) state.en = Math.min(100, state.en + 6); // Синяя руна дает энергию
                state.board[idx] = -1;
            });

            draw();
            await new Promise(r => setTimeout(r, 350));
            gravity();
            draw();
            await new Promise(r => setTimeout(r, 350));
            processMatches(); // Рекурсия для комбо
        } else {
            state.lock = false;
            if (state.ehp <= 0) win(); else enemyTurn();
        }
    }

    function gravity() {
        for (let c = 0; c < 7; c++) {
            let empty = 0;
            for (let r = 6; r >= 0; r--) {
                let i = r * 7 + c;
                if (state.board[i] === -1) empty++;
                else if (empty > 0) {
                    state.board[i + empty * 7] = state.board[i];
                    state.board[i] = -1;
                }
            }
            for (let r = 0; r < empty; r++) {
                state.board[r * 7 + c] = Math.floor(Math.random() * 5);
            }
        }
    }

    // --- ХОД ВРАГА И МЕХАНИКИ БОССОВ ---
    function enemyTurn() {
        const isB = state.lvl % 25 === 0;
        let dodge = Math.random() * 100 < state.agi;

        if (dodge) {
            popDmg("MISS", true);
            if (isB) state.bossEn = Math.min(100, state.bossEn + 10);
        } else {
            let dmg = 8 + Math.floor(state.lvl / 2);
            
            // Механика Демона Бездны (50 уровень)
            if (state.lvl === 50 && state.bossEn >= 100) {
                state.bossEn = 0;
                popDmg("БЕЗДНА!", true);
                // Блокируем 6 случайных ячеек
                for(let k=0; k<6; k++) {
                    let randIdx = Math.floor(Math.random() * 49);
                    if (!state.lockedCells.includes(randIdx)) state.lockedCells.push(randIdx);
                }
                // Таймер разблокировки через 2 хода игрока (имитация)
                setTimeout(() => { state.lockedCells = []; draw(); }, 7000);
            } 
            // Обычный суперудар боссов
            else if (isB && state.bossEn >= 100) {
                dmg *= 3;
                state.bossEn = 0;
                popDmg("КРИТИЧЕСКИЙ!", true);
            } else if (isB) {
                state.bossEn = Math.min(100, state.bossEn + 20);
            }

            state.hp -= Math.floor(dmg);
            if (state.isA) { audio.hit.currentTime = 0; audio.hit.play(); }
            popDmg(Math.floor(dmg), true);

            if (state.hp <= 0) {
                alert("Твой путь закончен на уровне " + state.lvl);
                localStorage.clear();
                location.reload();
            }
        }
        draw();
    }

    // --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---
    function win() {
        if (state.isA) audio.win.play();
        state.lvl++;
        state.pts += (state.lvl % 5 === 0) ? 3 : 1;
        if ((state.lvl - 1) % 25 === 0) state.pts += 5; // Бонус за босса
        save();
        init();
    }

    function draw() {
        document.getElementById('lvl-val').innerText = state.lvl;
        document.getElementById('pts-val').innerText = state.pts;
        document.getElementById('pts-forge').innerText = state.pts;
        document.getElementById('pts-txt').className = state.pts > 0 ? 'has-pts' : '';
        
        document.getElementById('hp-e').style.width = Math.max(0, (state.ehp / state.mehp * 100)) + '%';
        document.getElementById('hp-p').style.width = Math.max(0, (state.hp / state.mHP * 100)) + '%';
        document.getElementById('en-fill').style.width = state.en + '%';
        document.getElementById('boss-en-fill').style.width = state.bossEn + '%';

        const sBtn = document.getElementById('super-btn');
        if (state.en >= 100) sBtn.classList.add('ready');
        else sBtn.classList.remove('ready');

        state.board.forEach((type, i) => {
            const cell = document.getElementById('c-' + i);
            cell.style.backgroundImage = type === -1 ? 'none' : `url(rune${type + 1}.png)`;
            cell.style.backgroundColor = type === -1 ? '#000' : 'var(--cell-bg)';
            cell.classList.toggle('selected', state.sel === i);
            cell.classList.toggle('locked-cell', state.lockedCells.includes(i));
        });
    }

    function popDmg(v, isToPlayer) {
        const d = document.createElement('div');
        d.className = 'dmg-text';
        d.innerText = (typeof v === 'number' ? '-' : '') + v;
        d.style.color = isToPlayer ? 'var(--red)' : 'var(--gold)';
        d.style.left = '50%';
        d.style.top = isToPlayer ? '70%' : '30%';
        document.getElementById('arena').appendChild(d);
        setTimeout(() => d.remove(), 900);
    }

    function buyStat(t) {
        if (state.pts <= 0) return;
        if (t === 'atk') state.atk += 2;
        if (t === 'hp') { state.mHP += 20; state.hp += 20; }
        if (t === 'agi') state.agi += 1;
        state.pts--;
        save();
        draw();
    }

    function activateSuper() {
        if (state.en < 100 || state.lock) return;
        if (state.isA) audio.super.play();
        state.en = 0;
        let superDmg = state.atk * 18;
        state.ehp -= superDmg;
        popDmg(superDmg, false);
        // Взрываем 12 случайных рун
        for(let i=0; i<12; i++) {
            let r = Math.floor(Math.random() * 49);
            state.board[r] = -1;
        }
        draw();
        setTimeout(() => { gravity(); processMatches(); }, 500);
    }

    // --- МЕНЮ ---
    function openForge() { document.getElementById('forge-menu').style.display = 'flex'; }
    function openInfo() {
        document.getElementById('hero-stats').innerHTML = `
            🗡️ АТАКА: ${state.atk}<br>
            ❤️ ЗДОРОВЬЕ: ${state.mHP}<br>
            💨 ЛОВКОСТЬ: ${state.agi}%<br>
            🏆 УРОВЕНЬ: ${state.lvl}
        `;
        document.getElementById('info-menu').style.display = 'flex';
    }
    function closeMenus() { document.querySelectorAll('.overlay').forEach(o => o.style.display = 'none'); }
    
    function adminClick() {
        state.adminHits++;
        if(state.adminHits >= 5) {
            state.adminHits = 0;
            document.getElementById('admin-menu').style.display = 'flex';
        }
    }
    function jumpTo(l) { state.lvl = l; save(); init(); closeMenus(); }

    function save() {
        localStorage.setItem('v_lvl', state.lvl);
        localStorage.setItem('v_atk', state.atk);
        localStorage.setItem('v_mhp', state.mHP);
        localStorage.setItem('v_agi', state.agi);
        localStorage.setItem('v_pts', state.pts);
    }

    init();
</script>
</body>
</html>
