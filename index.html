<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Balanced Super</title>
    <style>
        :root { --gold: #f1c40f; --red: #e74c3c; --green: #2ecc71; --blue: #3498db; }
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; text-align: center; overflow: hidden; touch-action: manipulation; }
        .header { background: #1a1a1a; padding: 10px; border-bottom: 2px solid #333; font-weight: bold; color: var(--gold); font-size: 18px; display: flex; justify-content: space-around; }
        .arena { height: 160px; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; position: relative; }
        .hp-bar { width: 90%; height: 12px; background: #333; margin: 4px; border-radius: 6px; overflow: hidden; border: 1px solid #444; }
        .fill { height: 100%; transition: 0.4s; width: 100%; }
        #mob { width: 100px; height: 100px; z-index: 2; transition: 0.3s; }
        #grid { display: grid; grid-template-columns: repeat(7, 42px); gap: 4px; padding: 10px; width: 320px; margin: 0 auto; justify-content: center; }
        .cell { width: 42px; height: 42px; background-size: cover; background-position: center; border-radius: 4px; border: 1px solid #333; }
        .sel { outline: 3px solid #fff; transform: scale(0.85); z-index: 5; box-shadow: 0 0 10px var(--gold); }
        .btn { width: 90%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; background: #444; color: #888; font-weight: bold; }
        .ready { background: linear-gradient(orange, darkorange) !important; color: #fff !important; box-shadow: 0 0 15px gold; cursor: pointer; }
        
        .super-info { font-size: 11px; color: var(--blue); margin-top: 5px; opacity: 0.8; }
        
        #ban-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #msg { position: absolute; top: 40%; width: 100%; font-weight: bold; background: rgba(0,0,0,0.9); display: none; padding: 20px 0; z-index: 100; color: gold; }
    </style>
</head>
<body>

    <div id="ban-screen">
        <h2 style="color: var(--red);">ВЫ РАНЕНЫ</h2>
        <div id="timer" style="font-size: 40px; color: gold;">60:00</div>
    </div>

    <div class="header">
        <div id="best-display" style="font-size: 12px; opacity: 0.6;">РЕКОРД: 1</div>
        <div id="lvl-display">УРОВЕНЬ 1</div>
    </div>

    <div id="battle-screen" class="arena">
        <div id="msg"></div>
        <div class="hp-bar"><div id="ehp" class="fill" style="background: var(--red);"></div></div>
        <img id="mob" src="mob1.png" onerror="this.src='https://via.placeholder.com/100/red?text=MOB'">
        <div class="hp-bar"><div id="php" class="fill" style="background: var(--green);"></div></div>
    </div>

    <div id="grid"></div>

    <div style="width: 90%; margin: 10px auto;">
        <div style="height: 8px; width: 100%; background: #222; border-radius: 4px; overflow: hidden; border: 1px solid #333;">
            <div id="en-fill" style="width: 0%; height: 100%; background: var(--blue); transition: 0.3s;"></div>
        </div>
        <div class="super-info">
            СУПЕРУДАР: Соберите <b>20 синих рун</b> (💎/💎) для активации<br>
            Эффект: -150 HP врагу, стан на 2 хода и взрыв 15 плиток
        </div>
    </div>
    
    <button id="s-btn" class="btn" onclick="useSuper()">УДАР МОЛОТОМ</button>

<script>
    const runes = ['rune1.png', 'rune2.png', 'rune3.png', 'rune4.png', 'rune5.png'];
    const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#95a5a6'];
    
    let s = {
        lvl: parseInt(localStorage.getItem('v_lvl')) || 1,
        best: parseInt(localStorage.getItem('v_best')) || 1,
        en: parseInt(localStorage.getItem('v_en')) || 0, // Загружаем энергию
        hp: 100, ehp: 100, lock: false, stun: 0, board: [], sel: null
    };

    function checkBan() {
        const ban = localStorage.getItem('v_ban');
        if (ban && Date.now() < ban) {
            document.getElementById('ban-screen').style.display = 'flex';
            setInterval(() => {
                let d = ban - Date.now();
                if (d <= 0) location.reload();
                let m = Math.floor(d/60000), sc = Math.floor((d%60000)/1000);
                document.getElementById('timer').innerText = `${m}:${sc<10?'0':''}${sc}`;
            }, 1000);
            return true;
        }
        return false;
    }

    function saveAll() {
        localStorage.setItem('v_lvl', s.lvl);
        localStorage.setItem('v_en', s.en);
        if (s.lvl > s.best) {
            s.best = s.lvl;
            localStorage.setItem('v_best', s.best);
        }
    }

    function init() {
        if (checkBan()) return;
        saveAll();
        
        document.getElementById('lvl-display').innerText = "УРОВЕНЬ " + s.lvl;
        document.getElementById('best-display').innerText = "РЕКОРД: " + s.best;
        
        let bonus = s.lvl > 10 ? (s.lvl - 10) * 60 + 200 : s.lvl * 25;
        s.maxEHP = 100 + bonus;
        s.ehp = s.maxEHP;
        s.hp = 100;

        const g = document.getElementById('grid');
        g.innerHTML = '';
        s.board = [];
        for (let i = 0; i < 49; i++) {
            let t = Math.floor(Math.random() * 5);
            s.board.push(t);
            let c = document.createElement('div');
            c.className = 'cell';
            c.id = 'c' + i;
            c.onclick = () => touch(i);
            g.appendChild(c);
        }
        draw();
    }

    function draw() {
        s.board.forEach((t, i) => {
            const c = document.getElementById('c' + i);
            if (!c) return;
            if (t === -1) {
                c.style.backgroundImage = 'none';
                c.style.backgroundColor = '#111';
            } else {
                c.style.backgroundColor = colors[t];
                c.style.backgroundImage = "url(" + runes[t] + ")";
            }
            c.classList.toggle('sel', s.sel === i);
        });
        document.getElementById('php').style.width = s.hp + '%';
        document.getElementById('ehp').style.width = (s.ehp / s.maxEHP * 100) + '%';
        document.getElementById('en-fill').style.width = s.en + '%';
        document.getElementById('s-btn').className = 'btn' + (s.en >= 100 ? ' ready' : '');
        localStorage.setItem('v_en', s.en); // Сохраняем энергию при каждом изменении
    }

    async function applyGravity() {
        for (let col = 0; col < 7; col++) {
            let empty = 0;
            for (let row = 6; row >= 0; row--) {
                let idx = row * 7 + col;
                if (s.board[idx] === -1) empty++;
                else if (empty > 0) {
                    s.board[idx + empty * 7] = s.board[idx];
                    s.board[idx] = -1;
                }
            }
            for (let row = 0; row < empty; row++) {
                s.board[row * 7 + col] = Math.floor(Math.random() * 5);
            }
        }
        draw();
        await new Promise(r => setTimeout(r, 200));
    }

    async function processMatches(isPlayer) {
        let matched = false;
        while (true) {
            let m = [];
            for (let i = 0; i < 49; i++) {
                if (i % 7 < 5 && s.board[i] !== -1 && s.board[i] === s.board[i+1] && s.board[i] === s.board[i+2]) m.push(i, i+1, i+2);
                if (i < 35 && s.board[i] !== -1 && s.board[i] === s.board[i+7] && s.board[i] === s.board[i+14]) m.push(i, i+7, i+14);
            }
            if (m.length === 0) break;
            matched = true;
            [...new Set(m)].forEach(idx => {
                if (isPlayer) {
                    // Синяя плитка (индекс 1) теперь дает 5 энергии вместо 10
                    if (s.board[idx] === 1) s.en = Math.min(100, s.en + 5);
                    // Красная плитка (индекс 0) хилит
                    if (s.board[idx] === 0) s.hp = Math.min(100, s.hp + 2);
                    s.ehp -= 10;
                }
                s.board[idx] = -1;
            });
            draw();
            await new Promise(r => setTimeout(r, 250));
            await applyGravity();
        }
        if (isPlayer && matched) {
            if (s.ehp <= 0) win(); else enemyTurn();
        }
        return matched;
    }

    async function touch(i) {
        if (s.lock) return;
        if (s.sel === null) { s.sel = i; draw(); }
        else {
            let a = s.sel, b = i;
            if (Math.abs(a - b) === 1 || Math.abs(a - b) === 7) {
                s.lock = true;
                [s.board[a], s.board[b]] = [s.board[b], s.board[a]];
                draw();
                if (!await processMatches(true)) {
                    [s.board[a], s.board[b]] = [s.board[b], s.board[a]];
                }
            }
            s.sel = null; s.lock = false; draw();
        }
    }

    function enemyTurn() {
        if (s.stun > 0) { s.stun--; return; }
        s.hp -= (6 + Math.floor(s.lvl/2));
        if (s.hp <= 0) {
            localStorage.setItem('v_ban', Date.now() + 3600000);
            location.reload();
        }
        draw();
    }

    function win() {
        s.lvl++;
        saveAll(); // Сохраняем и уровень, и энергию
        document.getElementById('msg').style.display = 'block';
        document.getElementById('msg').innerText = "ПОБЕДА!";
        setTimeout(() => { 
            document.getElementById('msg').style.display = 'none'; 
            init(); 
        }, 1500);
    }

    async function useSuper() {
        if (s.en < 100 || s.lock) return;
        s.lock = true; s.en = 0; s.ehp -= 150; s.stun = 2;
        localStorage.setItem('v_en', 0); 
        for (let i = 0; i < 15; i++) s.board[Math.floor(Math.random()*49)] = -1;
        draw();
        await new Promise(r => setTimeout(r, 400));
        await applyGravity();
        await processMatches(true);
        s.lock = false;
    }

    window.onload = init;
</script>
</body>
</html>
