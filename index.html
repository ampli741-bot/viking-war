<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Fixed Gravity</title>
    <style>
        :root { --gold: #f1c40f; --red: #e74c3c; --green: #2ecc71; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; text-align: center; overflow: hidden; touch-action: manipulation; }
        .header { background: #1a1a1a; padding: 10px; border-bottom: 2px solid #333; display: flex; justify-content: space-around; align-items: center; }
        .lvl-badge { color: var(--gold); font-weight: bold; font-size: 20px; }
        .record { font-size: 12px; color: #888; }
        .arena { height: 160px; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; position: relative; }
        .hp-bar { width: 90%; height: 12px; background: #333; margin: 4px; border-radius: 6px; overflow: hidden; border: 1px solid #444; }
        .fill { height: 100%; transition: 0.4s; width: 100%; }
        #mob { width: 100px; height: 100px; z-index: 2; transition: 0.3s; }
        #grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 10px; width: 320px; margin: 0 auto; }
        .cell { width: 42px; height: 42px; background-size: cover; background-position: center; border-radius: 4px; border: 1px solid #333; }
        .sel { outline: 3px solid #fff; transform: scale(0.9); box-shadow: 0 0 10px var(--gold); }
        .btn { width: 90%; padding: 15px; margin-top: 10px; border: none; border-radius: 8px; background: #333; color: #666; font-weight: bold; font-size: 16px; }
        .ready { background: linear-gradient(145, #f1c40f, #d35400) !important; color: #fff !important; cursor: pointer;}
        #ban-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #msg { position: absolute; top: 40%; width: 100%; font-weight: bold; background: rgba(0,0,0,0.85); display: none; padding: 20px 0; z-index: 100; color: var(--gold); }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
        .shaking { animation: shake 0.2s ease-in-out; }
    </style>
</head>
<body>

<div id="ban-screen">
    <h2 style="color: var(--red);">ВЫ РАНЕНЫ</h2>
    <div id="timer" style="font-size: 40px; color: gold;">60:00</div>
</div>

<div class="header">
    <div class="record">РЕКОРД: <span id="best-lvl">1</span></div>
    <div class="lvl-badge" id="lvl-display">УРОВЕНЬ 1</div>
</div>

<div id="battle-screen" class="arena">
    <div id="msg"></div>
    <div class="hp-bar"><div id="ehp" class="fill" style="background: var(--red);"></div></div>
    <img id="mob" src="mob1.png" onerror="this.src='https://via.placeholder.com/100/red?text=MOB'">
    <div class="hp-bar"><div id="php" class="fill" style="background: var(--green);"></div></div>
</div>

<div id="grid"></div>

<div style="height: 8px; width: 90%; background: #222; margin: 8px auto; border-radius: 4px;">
    <div id="en-fill" style="width: 0%; height: 100%; background: var(--gold); transition: 0.3s;"></div>
</div>
<button id="s-btn" class="btn" onclick="useSuper()">УДАР МОЛОТОМ</button>

<script>
    const runes = ['rune1.png', 'rune2.png', 'rune3.png', 'rune4.png', 'rune5.png'];
    const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#95a5a6'];
    let s = {
        lvl: parseInt(localStorage.getItem('v_lvl')) || 1,
        best: parseInt(localStorage.getItem('v_best')) || 1,
        hp: 100, ehp: 100, en: 0, lock: false, stun: 0, board: []
    };

    function checkBan() {
