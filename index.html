<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Boss Fixed</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; text-align: center; overflow: hidden; touch-action: manipulation; }
        .header { background: #1a1a1a; padding: 10px; border-bottom: 2px solid #333; }
        
        /* АРЕНА */
        .arena { height: 180px; background: #050505; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 10px 0; }
        
        /* Полоски поверх иконки */
        .hp-bar { width: 90%; height: 12px; background: #333; border-radius: 6px; overflow: hidden; border: 1px solid #444; position: relative; z-index: 100; }
        #boss-en-bar { width: 60%; height: 6px; background: #222; border-radius: 3px; border: 1px solid orange; display: none; overflow: hidden; position: relative; z-index: 100; margin-top: -5px; }
        .fill { height: 100%; width: 100%; transition: 0.3s; }
        
        /* Иконка босса ЗА полосками */
        #mob-img { height: 100px; width: auto; transition: 0.5s; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1; }
        .boss-glow { filter: drop-shadow(0 0 20px red) !important; }

        #combo-txt { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; color: gold; font-weight: bold; z-index: 150; display: none; text-shadow: 2px 2px #000; pointer-events: none; }

        .ui { padding: 10px 0; background: #111; }
        .en-bar { width: 280px; height: 18px; background: #222; margin: 0 auto 5px; border-radius: 9px; overflow: hidden; position: relative; border: 1px solid #3498db; }
        #en-txt { position: absolute; width: 100%; font-size: 10px; line-height: 18px; z-index: 5; font-weight: bold; text-shadow: 1px 1px #000; }

        /* СЕТКА ПЛИТОК */
        #grid { width: 322px; margin: 5px auto; display: block; font-size: 0; line-height: 0; }
        .cell { display: inline-block; width: 42px; height: 42px; margin: 2px; background-size: cover; background-color: #222; border-radius: 4px; border: 1px solid #333; box-sizing: border-box; vertical-align: top; }
        .sel { border: 2px solid #fff !important; transform: scale(0.9); box-shadow: 0 0 10px #fff; }

        .btn { width: 280px; padding: 12px; border: none; border-radius: 8px; background: #444; color: #888; font-weight: bold; }
        .ready { background: linear-gradient(orange, darkorange) !important; color: #fff !important; }
        
        .shake { animation: shake 0.2s 2; }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(0,0); } }
    </style>
</head>
<body onclick="initAudio()">

    <div class="header"><span id="lvl-txt" style="color:gold">УРОВЕНЬ 1</span></div>

    <div class="arena" id="arena-bg">
        <div id="combo-txt">COMBO X1</div>
        <div class="hp-bar"><div id="ehp" class="fill" style="background: #e74c3c;"></div></div>
        <div id="boss-en-bar"><div id="boss-en-fill" class="fill" style="background: orange; width: 0%;"></div></div>
        
        <img id="mob-img" src="mob1.png" onerror="this.src='https://via.placeholder.com/90/red?text=MOB'">
        
        <div class="hp-bar"><div id="php" class="fill" style="background: #2ecc71;"></div></div>
    </div>

    <div class="ui">
        <div class="en-bar">
            <div id="en-txt">МОЛОТ: 0%</div>
            <div id="en-f" class="fill" style="background: #3498db; width: 0%;"></div>
        </div>
        <button id="s-btn" class="btn" onclick="useSuper()">УДАР МОЛОТОМ</button>
    </div>

    <div id="grid"></div>

<script>
    const runes = ['rune1.png', 'rune2.png', 'rune3.png', 'rune4.png', 'rune5.png'];
    const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6'];

    let s = {
        lvl: parseInt(localStorage.getItem('v_lvl')) || 1,
        en: 0, hp: 100, ehp: 100, maxEHP: 100, lock: false, board: [], sel: null, bossEn: 0, combo: 0
    };

    let audioCtx = null, bossTimer = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (s.lvl % 25 === 0) startBossMusic();
    }

    function startBossMusic() {
        if (bossTimer || !audioCtx) return;
        let step = 0;
        bossTimer = setInterval(() => {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = 'triangle';
            const notes = [60, 0, 60, 90, 60, 0, 50, 40];
            let f = notes[step % 8];
            if(f > 0) {
                osc.frequency.setValueAtTime(f, audioCtx.currentTime);
                g.gain.setValueAtTime(0.06, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.connect(g); g.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
            step++;
        }, 250);
    }

    function stopBossMusic() { if (bossTimer) { clearInterval(bossTimer); bossTimer = null; } }

    function init() {
        stopBossMusic();
        const isBoss = s.lvl % 25 === 0;
        document.getElementById('boss-en-bar').style.display = isBoss ? 'block' : 'none';
        
        const mob = document.getElementById('mob-img');
        mob.src = isBoss ? 'mob4.png' : 'mob1.png';
        mob.className = isBoss ? 'boss-glow' : '';
        mob.style.transform = isBoss ? 'translate(-50%, -50%) scale(1.8)' : 'translate(-50%, -50%) scale(1)';
        
        if (isBoss && audioCtx) startBossMusic();

        s.maxEHP = (100 + (s.lvl * 25)) * (isBoss ? 3 : 1);
        s.ehp = s.maxEHP; s.hp = 100; s.bossEn = 0;
        document.getElementById('lvl-txt').innerText = (isBoss ? "БОСС " : "УРОВЕНЬ ") + s.lvl;

        const g = document.getElementById('grid');
        g.innerHTML = ''; s.board = [];
        for (let i = 0; i < 49; i++) {
            s.board.push(Math.floor(Math.random() * 5));
            let d = document.createElement('div');
            d.className = 'cell'; d.id = 'c' + i;
            d.onclick = (e) => { e.stopPropagation(); touch(i); };
            g.appendChild(d);
        }
        draw();
    }

    function draw() {
        s.board.forEach((t, i) => {
            const el = document.getElementById('c' + i);
            if (!el) return;
            el.style.backgroundColor = t === -1 ? '#000' : colors[t];
            el.style.backgroundImage = t === -1 ? 'none' : `url(${runes[t]})`;
            el.classList.toggle('sel', s.sel === i);
        });
        document.getElementById('php').style.width = s.hp + '%';
        document.getElementById('ehp').style.width = (s.ehp / s.maxEHP * 100) + '%';
        document.getElementById('en-f').style.width = s.en + '%';
        document.getElementById('en-txt').innerText = `МОЛОТ: ${s.en}%`;
        document.getElementById('boss-en-fill').style.width = s.bossEn + '%';
        document.getElementById('s-btn').className = 'btn' + (s.en >= 100 ? ' ready' : '');
        localStorage.setItem('v_lvl', s.lvl);
    }

    async function touch(i) {
        if (s.lock) return;
        if (s.sel === null) { s.sel = i; draw(); }
        else {
            let a = s.sel, b = i;
            if (Math.abs(a - b) === 1 || Math.abs(a - b) === 7) {
                s.lock = true;
                [s.board[a], s.board[b]] = [s.board[b], s.board[a]];
                draw();
                s.combo = 0;
                if (!await check()) [s.board[a], s.board[b]] = [s.board[b], s.board[a]];
            }
            s.sel = null; s.lock = false; draw();
        }
    }

    async function check() {
        let found = false;
        while (true) {
            let del = new Set();
            for (let i = 0; i < 49; i++) {
                if (i % 7 < 5 && s.board
