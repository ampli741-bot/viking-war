<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Real Balance</title>
    <style>
        :root { --gold: #f1c40f; --red: #e74c3c; --green: #2ecc71; }
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; text-align: center; overflow: hidden; touch-action: manipulation; }
        .header { background: #1a1a1a; padding: 10px; border-bottom: 2px solid #333; font-weight: bold; color: var(--gold); font-size: 18px; }
        .arena { height: 160px; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; position: relative; }
        .hp-bar { width: 90%; height: 12px; background: #333; margin: 4px; border-radius: 6px; overflow: hidden; border: 1px solid #444; }
        .fill { height: 100%; transition: 0.4s ease-out; width: 100%; }
        #mob { width: 100px; height: 100px; z-index: 2; transition: 0.3s; }
        #grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 10px; width: 320px; margin: 0 auto; background: #000; }
        .cell { width: 42px; height: 42px; background-size: cover; background-color: #222; border-radius: 4px; border: 1px solid #333; }
        .sel { outline: 3px solid var(--gold); transform: scale(0.85); z-index: 5; }
        .btn { width: 90%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; background: #444; color: #888; font-weight: bold; }
        .ready { background: linear-gradient(orange, darkorange) !important; color: #fff !important; box-shadow: 0 0 15px gold; }
        #msg { position: absolute; top: 40%; width: 100%; font-weight: bold; color: #fff; background: rgba(0,0,0,0.9); display: none; padding: 20px 0; z-index: 100; border-y: 2px solid var(--gold); }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 100% { transform: translate(0,0); } }
        .shaking { animation: shake 0.1s infinite; }
    </style>
</head>
<body>
    <div class="header" id="lvl-display">УРОВЕНЬ 1</div>
    <div id="battle-screen" class="arena">
        <div id="msg"></div>
        <div class="hp-bar"><div id="ehp" class="fill" style="background: var(--red);"></div></div>
        <img src="mob1.png" id="mob">
        <div class="hp-bar"><div id="php" class="fill" style="background: var(--green);"></div></div>
    </div>
    <div id="grid"></div>
    <div style="height: 6px; width: 90%; background: #222; margin: 10px auto; border-radius: 3px;">
        <div id="en-fill" style="width: 0%; height: 100%; background: gold; transition: 0.3s;"></div>
    </div>
    <button id="s-btn" class="btn" onclick="useSuper()">УДАР МОЛОТОМ</button>

<script>
    const runes = ['rune1.png', 'rune2.png', 'rune3.png', 'rune4.png', 'rune5.png'];
    let s = { board: [], sel: null, hp: 100, ehp: 100, en: 0, lock: false, lvl: 1, stunTurns: 0 };

    function sfx(n) { try { new Audio(n + '.mp3').play().catch(()=>{}); } catch(e){} }

    function initBoard() {
        s.board = [];
        for (let i = 0; i < 49; i++) {
            let type;
            do {
                type = Math.floor(Math.random() * 5);
            } while (
                (i % 7 >= 2 && type === s.board[i-1] && type === s.board[i-2]) ||
                (i >= 14 && type === s.board[i-7] && type === s.board[i-14])
            );
            s.board.push(type);
        }
    }

    function init() {
        document.getElementById('lvl-display').innerText = `УРОВЕНЬ ${s.lvl}`;
        const g = document.getElementById('grid');
        g.innerHTML = '';
        initBoard();
        
        s.board.forEach((t, i) => {
            let c = document.createElement('div');
            c.className = 'cell'; c.id = 'c' + i;
            c.onclick = () => touch(i);
            g.appendChild(c);
        });

        let maxEHP = (s.lvl === 25) ? 500 : 100 + (s.lvl * 15);
        s.ehp = maxEHP;
        
        const mobImg = document.getElementById('mob');
        mobImg.src = (s.lvl === 25) ? 'boss.png' : `mob${Math.min(4, Math.floor(s.lvl/3)+1)}.png`;
        if (s.lvl === 25) mobImg.style.filter = "drop-shadow(0 0 10px red)";

        s.lock = false;
        draw();
    }

    function draw() {
        s.board.forEach((t, i) => {
            let c = document.getElementById('c' + i);
            c.style.backgroundImage = `url(${runes[t]})`;
            c.classList.toggle('sel', s.sel === i);
        });
        document.getElementById('php').style.width = s.hp + '%';
        let maxEHP = (s.lvl === 25) ? 500 : 100 + (s.lvl * 15);
        document.getElementById('ehp').style.width = Math.max(0, (s.ehp / maxEHP * 100)) + '%';
        document.getElementById('en-fill').style.width = s.en + '%';
        document.getElementById('s-btn').classList.toggle('ready', s.en >= 100);
    }

    async function touch(i) {
        if (s.lock) return;
        if (s.sel === null) { s.sel = i; draw(); } 
        else {
            let d = Math.abs(s.sel - i);
            if (d === 1 || d === 7) {
                s.lock = true;
                let a = s.sel, b = i;
                swap(a, b);
                let matched = await processMatches(true);
                if (!matched) {
                    swap(a, b); // Возвращаем если нет совпадений
                    s.lock = false;
                }
            }
            s.sel = null; draw();
        }
    }

    function swap(a, b) {
        let t = s.board[a]; s.board[a] = s.board[b]; s.board[b] = t;
    }

    async function processMatches(isPlayer) {
        let totalMatched = false;
        let combo = 0;

        while (true) {
            let matches = [];
            // Горизонтальные
            for (let r = 0; r < 7; r++) {
                for (let c = 0; c < 5; c++) {
                    let idx = r * 7 + c;
                    if (s.board[idx] === s.board[idx+1] && s.board[idx] === s.board[idx+2]) {
                        matches.push(idx, idx+1, idx+2);
                    }
                }
            }
            // Вертикальные
            for (let c = 0; c < 7; c++) {
                for (let r = 0; r < 5; r++) {
                    let idx = r * 7 + c;
                    if (s.board[idx] === s.board[idx+7] && s.board[idx] === s.board[idx+14]) {
                        matches.push(idx, idx+7, idx+14);
                    }
                }
            }
            
            if (matches.length === 0) break;
            
            totalMatched = true;
            combo++;
            let unique = [...new Set(matches)];
            
            unique.forEach(idx => {
                let type = s.board[idx];
                if (isPlayer) {
                    // КРАСНЫЕ РУНЫ (тип 0) лечат по 1% за штуку
                    if (type === 0) s.hp = Math.min(100, s.hp + 1);
                    // Серые руны (тип 4) теперь дают энергию ульты
                    if (type === 4) s.en = Math.min(100, s.en + 10);
                    s.ehp -= (5 * combo);
                }
                s.board[idx] = -1;
            });

            sfx('match'); draw();
            await new Promise(r => setTimeout(r, 300));
            
            // Заполнение пустот новыми рандомными плитками
            for (let i = 0; i < 49; i++) {
                if (s.board[i] === -1) s.board[i] = Math.floor(Math.random() * 5);
            }
            draw();
            await new Promise(r => setTimeout(r, 200));
        }

        if (isPlayer && totalMatched) {
            if (s.ehp <= 0) win();
            else setTimeout(enemyTurn, 600);
        }
        return totalMatched;
    }

    function enemyTurn() {
        if (s.ehp <= 0) return;
        if (s.stunTurns > 0) { s.stunTurns--; s.lock = false; return; }
        
        let i1 = Math.floor(Math.random() * 49);
        let n = [i1-1, i1+1, i1-7, i1+7].filter(x => x>=0 && x<49);
        let i2 = n[Math.floor(Math.random() * n.length)];
        
        swap(i1, i2);
        s.hp -= (6 + Math.floor(s.lvl/2));
        shakeScreen(); sfx('player_hit');
        processMatches(false);
        
        if (s.hp <= 0) { alert("Гейм Овер!"); location.reload(); }
        s.lock = false; draw();
    }

    function win() {
        s.lvl++;
        // Восстановление 15% HP при переходе
        s.hp = Math.min(100, s.hp + 15);
        sfx('win');
        let m =
