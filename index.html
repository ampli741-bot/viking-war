<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: RPG Evolution</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; text-align: center; overflow: hidden; touch-action: manipulation; user-select: none; }
        
        /* ADMIN PANEL */
        #adm { display: none; background: #300; padding: 10px; border-bottom: 2px solid red; }
        .adm-btn { background: #fff; color: #000; border: none; padding: 5px 10px; margin: 2px; font-weight: bold; border-radius: 4px; }

        .header { background: #1a1a1a; padding: 10px; border-bottom: 2px solid #444; display: flex; justify-content: space-around; font-size: 13px; }
        
        .arena { height: 190px; background: #050505; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 10px 0; }
        
        /* BARS - ALWAYS TOP */
        .hp-bar { width: 92%; height: 14px; background: #222; border-radius: 7px; margin: 2px auto; overflow: hidden; border: 1px solid #555; position: relative; z-index: 100; }
        #boss-en-bar { width: 60%; height: 6px; background: #111; border-radius: 3px; border: 1px solid #ff4500; display: none; position: relative; z-index: 100; margin: 0 auto; }
        .fill { height: 100%; width: 100%; transition: 0.3s; }
        
        #mob-img { height: 110px; width: auto; position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none; transition: 0.3s; }
        .boss-glow { filter: drop-shadow(0 0 20px red); }

        /* UPGRADE MENU */
        #upgrade-menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .up-row { margin: 10px; width: 80%; display: flex; justify-content: space-between; align-items: center; }
        .up-btn { background: #2ecc71; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; }

        #grid { width: 322px; margin: 5px auto; display: block; font-size: 0; background: #111; padding: 4px; border-radius: 8px; border: 2px solid #333; }
        .cell { display: inline-block; width: 42px; height: 42px; margin: 2px; background-size: cover; background-color: #222; border-radius: 6px; border: 1px solid #333; box-sizing: border-box; vertical-align: top; }
        .sel { border: 3px solid #fff !important; transform: scale(0.9); }

        .ui { padding: 10px 0; background: #111; }
        .en-bar { width: 280px; height: 20px; background: #222; margin: 0 auto 5px; border-radius: 10px; overflow: hidden; position: relative; border: 1px solid #3498db; }
        .btn { width: 280px; padding: 12px; border: none; border-radius: 8px; background: #444; color: #888; font-weight: bold; }
        .ready { background: linear-gradient(orange, darkorange) !important; color: #fff !important; box-shadow: 0 0 15px gold; }
        
        .shake { animation: shake 0.1s infinite; }
        @keyframes shake { 0% { transform: translate(2px,2px); } 50% { transform: translate(-2px,-2px); } 100% { transform: translate(0,0); } }
    </style>
</head>
<body onload="init()">

    <div id="adm">
        <button class="adm-btn" onclick="s.lvl+=10; init();">LVL +10</button>
        <button class="adm-btn" onclick="s.en=100; draw();">FULL ULTA</button>
        <button class="adm-btn" onclick="localStorage.clear(); location.reload();">RESET ALL</button>
    </div>

    <div class="header" onmousedown="startAdmin()" onmouseup="stopAdmin()" ontouchstart="startAdmin()" ontouchend="stopAdmin()">
        <span id="lvl-txt" style="color:gold">LVL 1</span>
        <span id="stats-txt">ATK: 1 | HP: 100</span>
        <span id="pts-txt" style="color:#2ecc71">PTS: 0</span>
    </div>

    <div class="arena" id="arena">
        <div id="upgrade-menu">
            <h2 style="color:gold">КУЗНИЦА ГЕРОЯ</h2>
            <div class="up-row"><span>СИЛА (ATK)</span><button class="up-btn" onclick="upgrade('atk')">+</button></div>
            <div class="up-row"><span>ЖИЗНЬ (HP)</span><button class="up-btn" onclick="upgrade('hp')">+</button></div>
            <div class="up-row"><span>УДАЧА (ULT)</span><button class="up-btn" onclick="upgrade('luck')">+</button></div>
            <button class="btn ready" style="margin-top:20px" onclick="closeUpgrades()">В БОЙ!</button>
        </div>
        <div class="hp-bar"><div id="ehp" class="fill" style="background: #e74c3c;"></div></div>
        <div id="boss-en-bar"><div id="boss-en-fill" class="fill" style="background: orange; width: 0%;"></div></div>
        <img id="mob-img" src="mob1.png" onerror="this.src='https://via.placeholder.com/100/red?text=MOB'">
        <div class="hp-bar"><div id="php" class="fill" style="background: #2ecc71;"></div></div>
    </div>

    <div class="ui">
        <div class="en-bar">
            <div id="en-txt" style="position:absolute; width:100%; line-height:20px; font-size:10px; font-weight:bold;">МОЛОТ ТОРА</div>
            <div id="en-f" class="fill" style="background: #3498db; width: 0%;"></div>
        </div>
        <button id="s-btn" class="btn" onclick="useSuper()">УДАР МОЛОТОМ</button>
    </div>

    <div id="grid"></div>

<script>
    const runes = ['rune1.png', 'rune2.png', 'rune3.png', 'rune4.png', 'rune5.png'];
    const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6'];

    // Загрузка RPG системы
    let s = {
        lvl: parseInt(localStorage.getItem('v_lvl')) || 1,
        atk: parseInt(localStorage.getItem('v_atk')) || 10,
        maxHP: parseInt(localStorage.getItem('v_mhp')) || 100,
        luck: parseInt(localStorage.getItem('v_luck')) || 5,
        pts: parseInt(localStorage.getItem('v_pts')) || 0,
        en: 0, hp: 100, ehp: 100, maxEHP: 100, lock: false, board: [], sel: null, bossEn: 0, combo: 0
    };

    function play(file) { new Audio(file + '.mp3').play().catch(()=>{}); }

    let adminTimer;
    function startAdmin() { adminTimer = setTimeout(() => { document.getElementById('adm').style.display = 'block'; }, 2000); }
    function stopAdmin() { clearTimeout(adminTimer); }

    function init() {
        const isBoss = s.lvl % 25 === 0;
        document.getElementById('boss-en-bar').style.display = isBoss ? 'block' : 'none';
        document.getElementById('mob-img').src = isBoss ? 'mob4.png' : (s.lvl % 5 === 0 ? 'mob2.png' : 'mob1.png');
        document.getElementById('mob-img').className = isBoss ? 'boss-glow' : '';
        
        s.maxEHP = (100 + (s.lvl * 25)) * (isBoss ? 4 : 1);
        s.ehp = s.maxEHP; s.hp = s.maxHP; s.bossEn = 0;
        
        const g = document.getElementById('grid');
        g.innerHTML = ''; s.board = [];
        for (let i = 0; i < 49; i++) {
            s.board.push(Math.floor(Math.random() * 5));
            let d = document.createElement('div');
            d.className = 'cell'; d.id = 'c' + i;
            d.onclick = () => touch(i);
            g.appendChild(d);
        }
        draw();
    }

    function upgrade(type) {
        if (s.pts <= 0) return;
        if (type === 'atk') s.atk += 2;
        if (type === 'hp') s.maxHP += 20;
        if (type === 'luck') s.luck += 1;
        s.pts--;
        save(); drawStats();
    }

    function save() {
        localStorage.setItem('v_lvl', s.lvl);
        localStorage.setItem('v_atk', s.atk);
        localStorage.setItem('v_mhp', s.maxHP);
        localStorage.setItem('v_luck', s.luck);
        localStorage.setItem('v_pts', s.pts);
    }

    function drawStats() {
        document.getElementById('lvl-txt').innerText = "LVL " + s.lvl;
        document.getElementById('stats-txt').innerText = `ATK: ${s.atk} | HP: ${s.maxHP}`;
        document.getElementById('pts-txt').innerText = "PTS: " + s.pts;
    }

    function draw() {
        drawStats();
        s.board.forEach((t, i) => {
            const el = document.getElementById('c' + i);
            el.style.backgroundColor = t === -1 ? '#000' : colors[t];
            el.style.backgroundImage = t === -1 ? 'none' : `url(${runes[t]})`;
            el.classList.toggle('sel', s.sel === i);
        });
        document.getElementById('php').style.width = (s.hp / s.maxHP * 100) + '%';
        document.getElementById('ehp').style.width = (s.ehp / s.maxEHP * 100) + '%';
        document.getElementById('en-f').style.width = s.en + '%';
        document.getElementById('boss-en-fill').style.width = s.bossEn + '%';
        document.getElementById('s-btn').className = 'btn' + (s.en >= 100 ? ' ready' : '');
    }

    async function touch(i) {
        if (s.lock) return;
        play('click');
        if (s.sel === null) { s.sel = i; draw(); }
        else {
            let a = s.sel, b = i;
            if (Math.abs(a - b) === 1 || Math.abs(a - b) === 7) {
                s.lock = true;
                [s.board[a], s.board[b]] = [s.board[b], s.board[a]];
                draw();
                if (!await check()) [s.board[a], s.board[b]] = [s.board[b], s.board[a]];
            }
            s.sel = null; s.lock = false; draw();
        }
    }

    async function check() {
        let found = false; s.combo = 0;
        while (true) {
            let del = new Set();
            for (let i = 0; i < 49; i++) {
                if (s.board[i] === -1) continue;
                if (i % 7 < 5 && s.board[i] === s.board[i+1] && s.board[i] === s.board[i+2]) {
                    let m = 3; 
                    if (i % 7 < 4 && s.board[i] === s.board[i+3]) m = 4;
                    if (i % 7 < 3 && s.board[i] === s.board[i+4]) m = 5;
                    for(let k=0; k<m; k++) del.add(i+k);
                    if(m===4) for(let c=0; c<7; c++) del.add(Math.floor(i/7)*7+c);
                    if(m===5) for(let r=-2; r<=2; r++) for(let c=-2; c<=2; c++) { let t=i+2+r*7+c; if(t>=0 && t<49) del.add(t); }
                }
                if (i < 35 && s.board[i] === s.board[i+7] && s.board[i] === s.board[i+14]) {
                    let m = 3;
                    if (i < 28 && s.board[i] === s.board[i+21]) m = 4;
                    if (i < 21 && s.board[i] === s.board[i+28]) m = 5;
                    for(let k=0; k<m; k++) del.add(i+k*7);
                    if(m===4) for(let r=0; r<7; r++) del.add(r*7 + (i%7));
                    if(m===5) for(let r=-2; r<=2; r++) for(let c=-2; c<=2; c++) { let t=i+14+r*7+c; if(t>=0 && t<49) del.add(t); }
                }
            }
            if (del.size === 0) break;
            found = true; s.combo++; play('match');
            if(s.combo > 3) document.getElementById('arena').classList.add('shake');
            
            del.forEach(idx => {
                if (s.board[idx] === 1) s.en = Math.min(100, s.en + s.luck);
                s.ehp -= (s.atk * s.combo);
                s.board[idx] = -1;
            });
            draw(); await new Promise(r => setTimeout(r, 200));
            drop(); draw(); await new Promise(r => setTimeout(r, 200));
            document.getElementById('arena').classList.remove('shake');
        }
        if (found) {
            if (s.ehp <= 0) { 
                play('win'); s.lvl++; s.pts += (s.lvl % 25 === 0 ? 5 : 1); 
                save(); document.getElementById('upgrade-menu').style.display = 'flex';
            } else enemy();
        }
        return found;
    }

    function drop() {
        for (let c = 0; c < 7; c++) {
            let empty = 0;
            for (let r = 6; r >= 0; r--) {
                let i = r * 7 + c;
                if (s.board[i] === -1) empty++;
                else if (empty > 0) { s.board[i+empty*7] = s.board[i]; s.board[i] = -1; }
            }
            for (let r = 0; r < empty; r++) s.board[r*7+c] = Math.floor(Math.random() * 5);
        }
    }

    function enemy() {
        let dmg = 5 + Math.floor(s.lvl/5);
        if (s.lvl % 25 === 0) {
            s.bossEn += 20;
            if (s.bossEn >= 100) { dmg *= 3; s.bossEn = 0; }
        }
        s.hp -= dmg; play('hit');
        if (s.hp <= 0) { alert("Game Over"); location.reload(); }
        draw();
    }

    async function useSuper() {
        if (s.en < 100 || s.lock) return;
        play('super'); s.lock = true; s.en = 0; s.ehp -= (s.atk * 20);
        for (let i = 0; i < 15; i++) s.board[Math.floor(Math.random()*49)] = -1;
        draw(); await new Promise(r => setTimeout(r, 300));
        drop(); await check(); s.lock = false;
    }

    function closeUpgrades() { document.getElementById('upgrade-menu').style.display = 'none'; init(); }
</script>
</body>
</html>
