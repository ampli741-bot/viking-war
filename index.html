<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Fixed</title>
    <style>
        :root { --gold: #ffd700; --accent: #2ecc71; }
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; text-align: center; user-select: none; touch-action: manipulation; }
        
        .header { background: #1a1a1a; padding: 10px; display: flex; justify-content: space-around; align-items: center; border-bottom: 2px solid #333; }
        #pts-txt { color: var(--accent); cursor: pointer; font-weight: bold; padding: 5px; border: 1px solid transparent; border-radius: 4px; }
        .has-pts { border-color: var(--accent); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.4; } }

        .arena { height: 230px; position: relative; background: #050505; overflow: hidden; transition: background 0.5s; }
        .boss-bg { background: radial-gradient(circle, #600, #000) !important; }
        #mob-img { height: 130px; position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); z-index: 5; pointer-events: none; }
        
        .hp-bar { width: 90%; height: 14px; background: #222; margin: 5px auto; border-radius: 7px; overflow: hidden; border: 1px solid #444; position: relative; z-index: 10; }
        .fill { height: 100%; width: 100%; transition: 0.3s; }

        #grid { width: 322px; margin: 10px auto; display: block; background: #111; padding: 5px; border-radius: 10px; border: 2px solid #444; font-size: 0; }
        .cell { display: inline-block; width: 42px; height: 42px; margin: 2px; background-size: cover; background-position: center; background-repeat: no-repeat; background-color: #222; border-radius: 6px; cursor: pointer; box-sizing: border-box; }
        .sel { border: 3px solid #fff; transform: scale(0.9); box-shadow: 0 0 10px #fff; }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .btn { width: 220px; padding: 12px; margin: 8px; border: none; border-radius: 6px; background: #444; color: #fff; font-weight: bold; cursor: pointer; }
        .ready { background: var(--accent) !important; }

        .dmg { position: absolute; font-weight: 900; font-size: 26px; color: #ff4d4d; animation: fly 0.7s forwards; z-index: 50; text-shadow: 2px 2px #000; }
        @keyframes fly { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-70px); } }
    </style>
</head>
<body onclick="initAudio()">

    <div class="header">
        <span id="lvl-txt" style="color:var(--gold)">LVL 1</span>
        <span id="pts-txt" onclick="openForge()">PTS: 0</span>
        <span onclick="openInfo()" style="cursor:pointer; color:var(--gold)">ГЕРОЙ</span>
    </div>

    <div class="arena" id="arena">
        <div class="hp-bar"><div id="ehp" class="fill" style="background:#e74c3c"></div></div>
        <img id="mob-img" src="mob1.png">
        <div class="hp-bar"><div id="php" class="fill" style="background:#2ecc71"></div></div>

        <div id="forge-menu" class="overlay">
            <h2 style="color:var(--gold)">КУЗНИЦА</h2>
            <button class="btn ready" onclick="buy('atk')">СИЛА АТАКИ (+2)</button>
            <button class="btn ready" onclick="buy('hp')">МАКС. ЖИЗНЬ (+20)</button>
            <button class="btn" onclick="closeAll()">ЗАКРЫТЬ</button>
        </div>

        <div id="info-menu" class="overlay">
            <h2 style="color:var(--gold)">ВАШ ГЕРОЙ</h2>
            <p id="stats-text"></p>
            <button class="btn ready" onclick="closeAll()">В БОЙ</button>
        </div>
    </div>

    <div id="grid"></div>
    
    <div style="padding: 10px;">
        <button id="s-btn" class="btn" style="width:310px; background:#3498db" onclick="useSuper()">УДАР МОЛОТОМ</button>
    </div>

<script>
    // Массив путей к картинкам
    const runeImages = ['rune1.png', 'rune2.png', 'rune3.png', 'rune4.png', 'rune5.png'];
    
    const sfx = {
        click: new Audio('click.mp3'),
        match: new Audio('match.mp3'),
        hit: new Audio('hit.mp3'),
        win: new Audio('win.mp3'),
        super: new Audio('super.mp3'),
        m_norm: new Audio('track_normal.mp3'),
        m_boss: new Audio('track_boss.mp3')
    };

    let s = {
        lvl: parseInt(localStorage.getItem('v_lvl')) || 1,
        atk: parseInt(localStorage.getItem('v_atk')) || 10,
        mHP: parseInt(localStorage.getItem('v_mhp')) || 100,
        pts: parseInt(localStorage.getItem('v_pts')) || 0,
        hp: 100, ehp: 100, mEHP: 100, board: [], sel: null, en: 0, audio: false
    };

    function initAudio() {
        if(s.audio) return;
        s.audio = true;
        sfx.m_norm.loop = true;
        sfx.m_boss.loop = true;
        playBGM();
    }

    function playBGM() {
        if(!s.audio) return;
        const isB = s.lvl % 25 === 0;
        if(isB) { sfx.m_norm.pause(); sfx.m_boss.play().catch(()=>{}); }
        else { sfx.m_boss.pause(); sfx.m_norm.play().catch(()=>{}); }
    }

    function init() {
        const isB = s.lvl % 25 === 0;
        document.getElementById('arena').classList.toggle('boss-bg', isB);
        document.getElementById('mob-img').src = isB ? 'mob4.png' : (s.lvl % 5 === 0 ? 'mob2.png' : 'mob1.png');
        
        s.mEHP = (100 + (s.lvl * 30)) * (isB ? 4 : 1);
        s.ehp = s.mEHP; s.hp = s.mHP;
        
        const g = document.getElementById('grid');
        g.innerHTML = ''; s.board = [];
        for (let i = 0; i < 49; i++) {
            s.board.push(Math.floor(Math.random() * 5));
            let d = document.createElement('div');
            d.className = 'cell'; d.id = 'c' + i;
            d.onclick = () => { if(s.audio) sfx.click.play(); touch(i); };
            g.appendChild(d);
        }
        playBGM();
        draw();
    }

    function touch(i) {
        if (s.sel === null) { s.sel = i; } 
        else {
            let a = s.sel, b = i;
            if (Math.abs(a-b) === 1 || Math.abs(a-b) === 7) {
                [s.board[a], s.board[b]] = [s.board[b], s.board[a]];
