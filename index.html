<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Hero Status</title>
    <style>
        :root { --main-bg: #000; --panel-bg: #1a1a1a; --accent: #2ecc71; --gold: #ffd700; }
        body { background: var(--main-bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; text-align: center; overflow: hidden; touch-action: manipulation; user-select: none; }
        
        /* КУРСОР ДЛЯ ПК */
        .cell, .btn, .up-btn, .info-btn, .adm-btn { cursor: pointer; }

        #adm { display: none; background: #300; padding: 10px; border-bottom: 2px solid red; position: relative; z-index: 2000; }
        .adm-btn { background: #fff; color: #000; border: none; padding: 5px 10px; margin: 2px; font-weight: bold; border-radius: 4px; }

        .header { background: var(--panel-bg); padding: 8px; border-bottom: 2px solid #444; display: flex; justify-content: space-around; align-items: center; font-size: 14px; height: 50px; box-sizing: border-box; }
        
        @keyframes pulse-pts { 0% { transform: scale(1); } 50% { transform: scale(1.05); color: #fff; } 100% { transform: scale(1); } }
        .has-pts { animation: pulse-pts 1s infinite; color: var(--accent); font-weight: bold; }

        .info-btn { background: #333; color: var(--gold); border: 1px solid var(--gold); border-radius: 50%; width: 32px; height: 32px; font-weight: bold; display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 18px; }
        .info-btn:hover { background: var(--gold); color: #000; }

        .arena { max-width: 500px; height: 220px; background: #050505; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 10px 0; margin: 0 auto; }
        .hp-bar { width: 92%; height: 16px; background: #222; border-radius: 8px; margin: 2px auto; overflow: hidden; border: 1px solid #555; position: relative; z-index: 100; }
        
        .fill { height: 100%; width: 100%; transition: 0.2s ease-out; }
        #mob-img { height: 120px; width: auto; position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none; transition: 0.1s; }
        
        /* ОБЩИЙ СТИЛЬ ДЛЯ ОВЕРЛЕЕВ */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000; display: none; flex-direction: column; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        
        /* СТИЛЬ КАРТОЧЕК ХАРАКТЕРИСТИК */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .stat-card { background: #222; border: 1px solid #444; padding: 10px; border-radius: 8px; text-align: left; }
        .stat-card b { color: var(--gold); display: block; font-size: 11px; text-transform: uppercase; }
        .stat-card span { font-size: 18px; font-weight: bold; color: #fff; }

        .up-row { margin-bottom: 12px; width: 100%; display: flex; justify-content: space-between; align-items: center; background: #222; padding: 12px; border-radius: 8px; border: 1px solid #333; box-sizing: border-box; }
        .up-btn { background: var(--accent); color: #fff; border: none; padding: 10px 25px; border-radius: 6px; font-weight: bold; font-size: 20px; }

        #grid { width: 322px; margin: 10px auto; display: block; font-size: 0; background: #111; padding: 6px; border-radius: 12px; border: 2px solid #444; }
        .cell { display: inline-block; width: 42px; height: 42px; margin: 2px; background-size: cover; background-color: #222; border-radius: 6px; border: 1px solid #333; box-sizing: border-box; }
        .sel { border: 3px solid #fff !important; transform: scale(0.9); box-shadow: 0 0 12px #fff; z-index: 50; position: relative; }

        .ui { padding: 10px 0; background: #111; }
        .en-bar { width: 280px; height: 24px; background: #222; margin: 0 auto 8px; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #3498db; }
        .btn { width: 280px; padding: 14px; border: none; border-radius: 8px; background: #333; color: #666; font-weight: bold; font-size: 16px; }
        .ready { background: linear-gradient(135deg, #ff9900, #ff4400) !important; color: #fff !important; }
        
        .dmg-num { position: absolute; color: #ff4d4d; font-weight: 900; font-size: 26px; z-index: 150; pointer-events: none; animation: fly-up 0.6s ease-out forwards; text-shadow: 2px 2px #000; }
        @keyframes fly-up { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -70px); } }
    </style>
</head>
<body onload="init()">

    <div id="adm">
        <button class="adm-btn" onclick="s.lvl+=24; s.pts+=5; save(); init();">К БОССУ</button>
        <button class="adm-btn" onclick="s.en=100; draw();">MAX УЛЬТА</button>
        <button class="adm-btn" onclick="localStorage.clear(); location.reload();">СБРОС</button>
    </div>

    <div class="header">
        <div id="admin-trigger">
            <span id="lvl-txt" style="color:var(--gold); font-weight:bold;">LVL 1</span>
        </div>
        <span id="pts-txt">PTS: 0</span>
        <div class="info-btn" id="i-btn" onclick="toggleInfo()">i</div>
    </div>

    <div class="arena" id="arena">
        <div id="upgrade-menu" class="overlay">
