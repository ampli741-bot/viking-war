<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Stable Hammer</title>
    <style>
        :root { --gold: #f1c40f; --red: #e74c3c; --green: #2ecc71; }
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; text-align: center; overflow: hidden; touch-action: manipulation; }
        .header { background: #1a1a1a; padding: 10px; border-bottom: 2px solid #333; font-weight: bold; color: var(--gold); font-size: 18px; }
        .arena { height: 160px; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; position: relative; }
        .hp-bar { width: 90%; height: 12px; background: #333; margin: 4px; border-radius: 6px; overflow: hidden; border: 1px solid #444; }
        .fill { height: 100%; transition: 0.4s; width: 100%; }
        #mob { width: 100px; height: 100px; z-index: 2; transition: 0.3s; }
        #grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 10px; width: 320px; margin: 0 auto; background: #000; }
        .cell { width: 42px; height: 42px; background-size: cover; background-position: center; border-radius: 4px; border: 1px solid #333; transition: 0.2s; }
        .sel { outline: 3px solid var(--gold); transform: scale(0.85); z-index: 5; }
        .btn { width: 90%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; background: #444; color: #888; font-weight: bold; }
        .ready { background: linear-gradient(orange, darkorange) !important; color: #fff !important; box-shadow: 0 0 15px gold; cursor: pointer; }
        #msg { position: absolute; top: 40%; width: 100%; font-weight: bold; background: rgba(0,0,0,0.9); display: none; padding: 20px 0; z-index: 100; }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 100% { transform: translate(0,0); } }
        .shaking { animation: shake 0.1s infinite; }
    </style>
</head>
<body>
    <div class="header" id="lvl-display">УРОВЕНЬ 1</div>
    <div id="battle-screen" class="arena">
        <div id="msg"></div>
        <div class="hp-bar"><div id="ehp" class="fill" style="background: var(--red);"></div></div>
        <img id="mob" src="mob1.png" onerror="this.src='https://via.placeholder.com/100/red?text=MOB'">
        <div class="hp-bar"><div id="php" class="fill" style="background: var(--green);"></div></div>
    </div>
    <div id="grid"></div>
    <div style="height: 6px; width: 90%; background: #222; margin: 10px auto; border-radius: 3px;">
        <div id="en-fill" style="width: 0%; height: 100%; background: gold; transition: 0.3s;"></div>
    </div>
    <button id="s-btn" class="btn" onclick="useSuper()">УДАР МОЛОТОМ</button>

<script>
    const runes = ['rune1.png', 'rune2.png', 'rune3.png', 'rune4.png', 'rune5.png'];
    const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#95a5a6'];
    let s = { board: [], sel: null, hp: 100, ehp: 100, en: 0, lock: false, lvl: 1, stunTurns: 0 };

    function sfx(n) { try { new Audio(n + '.mp3').play().catch(()=>{}); } catch(e){} }

    function init() {
        document.getElementById('lvl-display').innerText = "УРОВЕНЬ " + s.lvl;
        const g = document.getElementById('grid');
        g.innerHTML = '';
        s.board = [];
        
        for (let i = 0; i < 49; i++) {
            let type;
            do {
                type = Math.floor(Math.random() * 5);
            } while (
                (i % 7 >= 2 && type === s.board[i-1] && type === s.board[i-2]) ||
                (i >= 14 && type === s.board[i-7] && type === s.board[i-14])
            );
            s.board.push(type);
            let c = document.createElement('div');
            c.className = 'cell';
            c.id = 'c' + i;
            c.onclick = () => touch(i);
            g.appendChild(c);
        }
        
        let maxEHP = (s.lvl === 25) ? 500 : 100 + (s.lvl * 15);
        s.ehp = maxEHP;
        document.getElementById('mob').src = (s.lvl === 25) ? 'boss.png' : 'mob' + (Math.min(4, Math.floor(s.lvl/3)+1)) + '.png';
        
        s.lock = false;
        draw();
    }

    function draw() {
        s.board.forEach((t, i) => {
            const c = document.getElementById('c' + i);
            if (c) {
                if (t === -1) {
                    c.style.backgroundImage = 'none';
                    c.style.backgroundColor = '#fff'; // Белый цвет при взрыве
                } else {
                    c.style.backgroundColor = colors[t];
                    c.style.backgroundImage = "url(" + runes[t] + ")";
                }
                c.classList.toggle('sel', s.sel === i);
            }
        });
        document.getElementById('php').style.width = s.hp + '%';
        let maxEHP = (s.lvl === 25) ? 500 : 100 + (s.lvl * 15);
        document.getElementById('ehp').style.width = Math.max(0, (s.ehp / maxEHP * 100)) + '%';
        document.getElementById('en-fill').style.width = s.en + '%';
        document.getElementById('s-btn').classList.toggle('ready', s.en >= 100);
    }

    async function touch(i) {
        if (s.lock) return;
        if (s.sel === null) { s.sel = i; draw(); } 
        else {
            let d = Math.abs(s.sel - i);
            if (d === 1 || d === 7) {
                s.lock = true;
                let a = s.sel, b = i;
                let t = s.board[a]; s.board[a] = s.board[b]; s.board[b] = t;
                let matched = await processMatches(true);
                if (!matched) {
                    let temp = s.board[a]; s.board[a] = s.board[b]; s.board[b] = temp;
                    s.lock = false;
                }
            }
            s.sel = null; draw();
        }
    }

    async function processMatches(isPlayer) {
        let hasMatched = false;
        let combo = 0;
        while (true) {
            let m = [];
            for (let i = 0; i < 49; i++) {
                if (i % 7 < 5 && s.board[i] !== -1 && s.board[i] === s.board[i+1] && s.board[i] === s.board[i+2]) m.push(i, i+1, i+2);
                if (i < 35 && s.board[i] !== -1 && s.board[i] === s.board[i+7] && s.board[i] === s.board[i+14]) m.push(i, i+7, i+14);
            }
            if (m.length === 0) break;
            hasMatched = true; combo++;
            [...new Set(m)].forEach(idx => {
                let type = s.board[idx];
                if (isPlayer) {
                    if (type === 0) s.hp = Math.min(100, s.hp + 1);
                    if (type === 4) s.en = Math.min(100, s.en + 10);
                    s.ehp -= (5 * combo);
                }
                s.board[idx] = -1;
            });
            sfx('match'); draw();
            await new Promise(r => setTimeout(r, 250));
            for (let i = 0; i < 49; i++) if (s.board[i] === -1) s.board[i] = Math.floor(Math.random() * 5);
            draw();
            await new Promise(r => setTimeout(r, 150));
        }
        if (isPlayer && hasMatched) {
            if (s.ehp <= 0) win(); else setTimeout(enemyTurn, 600);
        }
        return hasMatched;
    }

    function enemyTurn() {
        if (s.ehp <= 0) return;
        if (s.stunTurns > 0) { s.stunTurns--; s.lock = false; return; }
        let i1 = Math.floor(Math.random() * 48);
        let i2 = i1 + 1;
        let t = s.board[i1]; s.board[i1] = s.board[i2]; s.board[i2] = t;
        s.hp -= (6 + Math.floor(s.lvl/2));
        shake(); sfx('player_hit');
        processMatches(false);
        if (s.hp <= 0) { alert("Game Over"); location.reload(); }
        s.lock = false; draw();
    }

    function win() {
        s.lvl++; s.hp = Math.min(100, s.hp + 15);
        sfx('win');
        let m = document.getElementById('msg');
        m.innerText = "ПОБЕДА! +15% HP"; m.style.display = 'block';
        setTimeout(() => { m.style.display = 'none'; init(); }, 1500);
    }

    function shake() {
        document.getElementById('battle-screen').classList.add('shaking');
        setTimeout(() => document.getElementById('battle-screen').classList.remove('shaking'), 300);
    }

    async function useSuper() {
        if (s.en < 100 || s.lock) return;
        s.lock = true;
        s.en = 0;
        sfx('super');

        // Мощный урон
        s.ehp -= 100;
        // Оглушение
        s.stunTurns = (s.lvl === 25) ? 1 : 2;

        // Взрываем случайные плитки (делаем их белыми)
        for (let i = 0; i < 15; i++) {
            let r = Math.floor(Math.random() * 49);
            s.board[r] = -1;
        }
        
        draw(); // Показываем взрыв (белые плитки)
        
        await new Promise(r => setTimeout(r, 400));
        
        // Запускаем стандартную логику падения плиток и комбо
        await processMatches(true);
        
        s.lock = false;
        draw();
    }

    window.onload = init;
</script>
</body>
</html>
