<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Hardcore Edition</title>
    <style>
        :root { --gold: #ffd700; --accent: #2ecc71; --red: #e74c3c; --blue: #3498db; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; text-align: center; overflow: hidden; user-select: none; touch-action: manipulation; }
        
        /* Панель статуса */
        .header { background: #151515; height: 55px; display: flex; justify-content: space-around; align-items: center; border-bottom: 3px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.8); position: relative; z-index: 100; }
        #pts-txt { font-weight: bold; padding: 6px 15px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; transition: all 0.3s; }
        .has-pts { color: var(--accent); border-color: var(--accent); background: rgba(46, 204, 113, 0.1); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0px var(--accent); } 50% { box-shadow: 0 0 15px var(--accent); } 100% { box-shadow: 0 0 0px var(--accent); } }

        /* Игровая зона */
        .arena { max-width: 500px; height: 250px; margin: 0 auto; position: relative; background: #080808; overflow: hidden; border-bottom: 2px solid #222; }
        .boss-active { background: radial-gradient(circle at center, #700 0%, #000 100%) !important; }
        #mob-img { height: 150px; position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); z-index: 5; filter: drop-shadow(0 0 10px #000); }
        
        .bar-wrap { width: 92%; height: 18px; background: #222; margin: 8px auto; border-radius: 9px; border: 1px solid #444; overflow: hidden; position: relative; z-index: 10; }
        .bar-fill { height: 100%; width: 100%; transition: 0.5s cubic-bezier(0.1, 0.9, 0.2, 1); }

        /* Поле боя */
        #grid { width: 322px; margin: 15px auto; line-height: 0; background: #111; padding: 8px; border-radius: 15px; border: 3px solid #333; box-shadow: inset 0 0 30px #000; }
        .cell { display: inline-block; width: 42px; height: 42px; margin: 2px; background-size: cover; background-position: center; background-color: #222; border-radius: 8px; cursor: pointer; transition: transform 0.1s, box-shadow 0.2s; box-sizing: border-box; }
        .selected { border: 3px solid #fff; box-shadow: 0 0 20px #fff; transform: scale(0.8); z-index: 50; position: relative; }

        /* Оверлеи (Меню) - ТУТ ВКЛЮЧЕН СКРОЛЛ */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 1000; display: none; flex-direction: column; justify-content: flex-start; align-items: center; backdrop-filter: blur(8px); overflow-y: auto; padding: 40px 0; box-sizing: border-box; }
        .menu-btn { width: 240px; padding: 18px; margin: 12px; border: none; border-radius: 10px; background: #252525; color: #fff; font-weight: bold; font-size: 18px; cursor: pointer; border: 1px solid #444; transition: 0.3s; flex-shrink: 0; }
        .buy-btn { background: var(--accent) !important; color: #000 !important; border: none; }
        
        /* Всплывающий урон */
        .dmg-text { position: absolute; font-size: 32px; font-weight: 900; pointer-events: none; animation: flyUp 0.8s ease-out forwards; z-index: 200; text-shadow: 3px 3px #000; }
        @keyframes flyUp { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -100px); } }

        /* Ульта */
        .super-container { width: 310px; margin: 10px auto; }
        #super-btn { width: 100%; padding: 15px; background: #222; color: #666; border: 2px solid #333; border-radius: 10px; font-weight: bold; font-size: 16px; transition: 0.4s; }
        #super-btn.ready { background: var(--blue) !important; color: #fff !important; border-color: #fff; cursor: pointer; box-shadow: 0 0 20px var(--blue); }
    </style>
</head>
<body onclick="unlockAudioContext()">

    <div class="header">
        <div style="color:var(--gold); font-size: 18px; cursor: pointer;" onclick="adminClick()">LEVEL <span id="lvl-val">1</span></div>
        <div id="pts-txt" onclick="openForge()">PTS: <span id="pts-val">0</span></div>
        <div onclick="openInfo()" style="cursor:pointer; font-size: 20px;">🛡️</div>
    </div>

    <div class="arena" id="arena">
        <div class="bar-wrap"><div id="hp-e" class="bar-fill" style="background:var(--red)"></div></div>
        <img id="mob-img" src="mob1.png">
        <div class="bar-wrap"><div id="hp-p" class="bar-fill" style="background:var(--accent)"></div></div>

        <div id="forge-menu" class="overlay">
            <h1 style="color:var(--gold)">КУЗНИЦА</h1>
            <p>Улучши свои навыки за очки PTS</p>
            <button class="menu-btn buy-btn" onclick="buyStat('atk')">АТАКА (+2)</button>
            <button class="menu-btn buy-btn" onclick="buyStat('hp')">ЗДОРОВЬЕ (+20)</button>
            <button class="menu-btn buy-btn" onclick="buyStat('agi')">ЛОВКОСТЬ (+1)</button>
            <button class="menu-btn" onclick="closeMenus()">ВЕРНУТЬСЯ</button>
        </div>

        <div id="info-menu" class="overlay">
            <h1 style="color:var(--gold)">ГЕРОЙ</h1>
            <div id="hero-stats" style="font-size: 22px; line-height: 2; width: 80%;"></div>
            <button class="menu-btn buy-btn" onclick="closeMenus()">ЗАКРЫТЬ</button>
        </div>

        <div id="admin-menu" class="overlay">
            <h1 style="color:var(--red)">MODERATOR</h1>
            <button class="menu-btn" onclick="addCheatPts()">+100 PTS</button>
            <button class="menu-btn" onclick="goToBoss()">УРОВЕНЬ 25 (BOSS)</button>
            <button class="menu-btn" onclick="localStorage.clear(); location.reload();">СБРОСИТЬ СОХРАНЕНИЯ</button>
            <button class="menu-btn" onclick="closeMenus()">ЗАКРЫТЬ</button>
        </div>
    </div>

    <div class="super-container">
        <div style="width:100%; height:8px; background:#111; border-radius:4px; margin-bottom:5px; overflow:hidden;">
            <div id="en-fill" style="width:0%; height:100%; background:var(--blue); transition: 0.3s;"></div>
        </div>
        <button id="super-btn" onclick="activateSuper()">МОЛОТ ТОРА</button>
    </div>

    <div id="grid"></div>

<script>
    // --- ЗВУКИ ---
    const audio = {
        click: new Audio('click.mp3'),
        match: new Audio('match.mp3'),
        hit: new Audio('hit.mp3'),
        win: new Audio('win.mp3'),
        super: new Audio('super.mp3'),
        bg: new Audio('track_normal.mp3'),
        bgBoss: new Audio('track_boss.mp3')
    };
    audio.bg.loop = true;
    audio.bgBoss.loop = true;

    // --- ДАННЫЕ ---
    let state = {
        lvl: parseInt(localStorage.getItem('v_lvl')) || 1,
        atk: parseInt(localStorage.getItem('v_atk')) || 10,
        mHP: parseInt(localStorage.getItem('v_mhp')) || 100,
        agi: parseInt(localStorage.getItem('v_agi')) || 5,
        pts: parseInt(localStorage.getItem('v_pts')) || 0,
        hp: 100, ehp: 100, mehp: 100,
        en: 0,
        board: [],
        sel: null,
        isA: false,
        lock: false,
        adminHits: 0 // Счётчик для админки
    };

    function unlockAudioContext() {
        if (state.isA) return;
        state.isA = true;
        updateMusic();
    }

    function updateMusic() {
        if (!state.isA) return;
        const isB = state.lvl % 25 === 0;
        if (isB) { audio.bg.pause(); audio.bgBoss.play().catch(()=>{}); } 
        else { audio.bgBoss.pause(); audio.bg.play().catch(()=>{}); }
    }

    function init() {
        const isB = state.lvl % 25 === 0;
        const arena = document.getElementById('arena');
        const mob = document.getElementById('mob-img');

        arena.classList.toggle('boss-active', isB);
        mob.src = isB ? 'mob4.png' : (state.lvl % 5 === 0 ? 'mob2.png' : 'mob1.png');

        state.mehp = (100 + (state.lvl * 40)) * (isB ? 4 : 1);
        state.ehp = state.mehp;
        state.hp = state.mHP;

        const g = document.getElementById('grid');
        g.innerHTML = '';
        state.board = [];

        for (let i = 0; i < 49; i++) {
            const type = Math.floor(Math.random() * 5);
            state.board.push(type);
            const c = document.createElement('div');
            c.className = 'cell';
            c.id = 'c-' + i;
            c.style.backgroundImage = `url(rune${type + 1}.png)`;
            c.onclick = () => handleInput(i);
            g.appendChild(c);
        }
        updateMusic();
        draw();
    }

    function handleInput(i) {
        if (state.lock) return;
        if (state.isA) { audio.click.currentTime = 0; audio.click.play(); }

        if (state.sel === null) {
            state.sel = i;
        } else {
            const a = state.sel;
            const b = i;
            if (Math.abs(a - b) === 1 || Math.abs(a - b) === 7) {
                [state.board[a], state.board[b]] = [state.board[b], state.board[a]];
                processMatches();
            }
            state.sel = null;
        }
        draw();
    }

    async function processMatches() {
        state.lock = true;
        let matched = false;
        let del = new Set();

        for (let i = 0; i < 49; i++) {
            if (i % 7 < 5 && state.board[i] !== -1 && state.board[i] === state.board[i+1] && state.board[i] === state.board[i+2]) {
                del.add(i); del.add(i+1); del.add(i+2);
            }
            if (i < 35 && state.board[i] !== -1 && state.board[i] === state.board[i+7] && state.board[i] === state.board[i+14]) {
                del.add(i); del.add(i+7); del.add(i+14);
            }
        }

        if (del.size > 0) {
            matched = true;
            if (state.isA) { audio.match.currentTime = 0; audio.match.play(); }
            
            let dmg = del.size * state.atk;
            state.ehp -= dmg;
            popDmg(dmg, false);

            del.forEach(idx => {
                if (state.board[idx] === 1) state.en = Math.min(100, state.en + 7);
                state.board[idx] = -1;
            });

            draw();
            await new Promise(r => setTimeout(r, 300));
            gravity();
            draw();
            await new Promise(r => setTimeout(r, 300));
            processMatches();
        } else {
            state.lock = false;
            if (state.ehp <= 0) {
                win();
            } else {
                enemyTurn();
            }
        }
    }

    function gravity() {
        for (let c = 0; c < 7; c++) {
            let empty = 0;
            for (let r = 6; r >= 0; r--) {
                let i = r * 7 + c;
                if (state.board[i] === -1) empty++;
                else if (empty > 0) {
                    state.board[i + empty * 7] = state.board[i];
                    state.board[i] = -1;
                }
            }
            for (let r = 0; r < empty; r++) {
                state.board[r * 7 + c] = Math.floor(Math.random() * 5);
            }
        }
    }

    function enemyTurn() {
        let evade = Math.random() * 100 < Math.min(state.agi, 40);
        if (evade) {
            popDmg("MISS", true);
        } else {
            let dmg = 5 + Math.floor(state.lvl / 3.5);
            state.hp -= dmg;
            if (state.isA) { audio.hit.currentTime = 0; audio.hit.play(); }
            popDmg(dmg, true);
            if (state.hp <= 0) {
                alert("Твоё путешествие окончено. Уровень: " + state.lvl);
                localStorage.clear();
                location.reload();
            }
        }
        draw();
    }

    function win() {
        if (state.isA) audio.win.play();
        state.lvl++;
        if (state.lvl % 3 === 0) state.pts++;
        if ((state.lvl - 1) % 25 === 0) state.pts += 3;
        save();
        init();
    }

    function draw() {
        document.getElementById('lvl-val').innerText = state.lvl;
        document.getElementById('pts-val').innerText = state.pts;
        document.getElementById('pts-txt').className = state.pts > 0 ? 'has-pts' : '';
        
        document.getElementById('hp-e').style.width = Math.max(0, (state.ehp / state.mehp * 100)) + '%';
        document.getElementById('hp-p').style.width = Math.max(0, (state.hp / state.mHP * 100)) + '%';
        document.getElementById('en-fill').style.width = state.en + '%';
        
        const sBtn = document.getElementById('super-btn');
        if (state.en >= 100) sBtn.classList.add('ready');
        else sBtn.classList.remove('ready');

        state.board.forEach((type, i) => {
            const cell = document.getElementById('c-' + i);
            cell.style.backgroundImage = type === -1 ? 'none' : `url(rune${type + 1}.png)`;
            cell.style.backgroundColor = type === -1 ? '#000' : '#222';
            cell.classList.toggle('selected', state.sel === i);
        });
    }

    function popDmg(v, p) {
        const d = document.createElement('div');
        d.className = 'dmg-text';
        d.innerText = (typeof v === 'number' ? '-' : '') + v;
        d.style.color = p ? 'var(--red)' : 'var(--gold)';
        d.style.left = '50%';
        d.style.top = p ? '70%' : '30%';
        document.getElementById('arena').appendChild(d);
        setTimeout(() => d.remove(), 800);
    }

    /* ФУНКЦИИ ИНТЕРФЕЙСА */
    function openForge() {
        if (state.pts <= 0 && document.getElementById('forge-menu').style.display !== 'flex') return;
        document.getElementById('forge-menu').style.display = 'flex';
    }

    function openInfo() {
        document.getElementById('hero-stats').innerHTML = `АТАКА: ${state.atk}<br>ЗДОРОВЬЕ: ${state.mHP}<br>ЛОВКОСТЬ: ${state.agi}<br>УРОВЕНЬ: ${state.lvl}<br>ОЧКИ (PTS): ${state.pts}<br><br>СОВЕТ: Ловкость дает шанс уклониться!`;
        document.getElementById('info-menu').style.display = 'flex';
    }

    function closeMenus() {
        document.querySelectorAll('.overlay').forEach(o => o.style.display = 'none');
    }

    function buyStat(t) {
        if (state.pts <= 0) return;
        if (t === 'atk') state.
