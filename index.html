<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Hardcore & Recovery</title>
    <style>
        :root { --gold: #ffd700; --accent: #2ecc71; --red: #e74c3c; --blue: #3498db; --purple: #a55eea; }
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; text-align: center; overflow: hidden; user-select: none; touch-action: manipulation; height: 100vh; display: flex; flex-direction: column; }

        .header { background: #111; height: 35px; display: flex; justify-content: space-around; align-items: center; border-bottom: 1px solid #333; font-size: 12px; position: relative; z-index: 1001; }
        #exp-bar { width: 100%; height: 3px; background: #222; }
        #exp-fill { height: 100%; width: 0%; background: var(--purple); transition: 0.3s; }

        .arena { height: 26vh; background: #0a0a0a; border-bottom: 2px solid #444; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .char-box { width: 45%; display: flex; flex-direction: column; align-items: center; }
        .p-icon { width: 75px; height: 75px; border-radius: 12px; border: 3px solid #444; background: #111; object-fit: cover; }
        
        .bar-bg { width: 100%; height: 16px; background: #222; border-radius: 4px; margin-top: 5px; border: 1px solid #444; position: relative; overflow: hidden; }
        .bar-fill { height: 100%; width: 100%; transition: 0.3s; }
        .bar-txt { position: absolute; width: 100%; left: 0; top: 0; font-size: 9px; line-height: 16px; font-weight: bold; text-shadow: 1px 1px 1px #000; }

        .skill-bar { width: 100%; height: 6px; background: #111; margin-top: 3px; border-radius: 3px; overflow: hidden; border: 1px solid #333; }
        .skill-fill { height: 100%; width: 0%; transition: 0.3s; }

        .game-space { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #050505; }
        #grid-container { width: 92vw; max-width: 360px; aspect-ratio: 1/1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: #111; padding: 6px; border-radius: 8px; border: 2px solid #333; }
        .cell { background-color: #1a1a1a; background-size: 80%; background-repeat: no-repeat; background-position: center; border: 1px solid #333; border-radius: 4px; position: relative; }
        .selected { outline: 3px solid #fff; z-index: 20; background-color: #333; }
        
        .timer-badge { position: absolute; top: -5px; right: -5px; background: var(--red); color: #fff; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid #fff; font-weight: bold; }

        #thor-btn { width: 90%; max-width: 350px; padding: 12px; margin: 10px 0; border-radius: 8px; border: 2px solid #333; background: #222; color: #555; font-weight: bold; }
        #thor-btn.ready { background: var(--blue); color: #fff; border-color: #fff; box-shadow: 0 0 10px var(--blue); cursor: pointer; }

        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .card { background: #1a1a1a; border: 2px solid var(--gold); border-radius: 12px; padding: 20px; width: 80%; }
        .menu-btn { width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; border: none; font-weight: bold; background: var(--accent); color: #000; cursor: pointer; }
        
        #death-screen { background: rgba(20, 0, 0, 0.98); z-index: 999; }
        .dmg-text { position: absolute; font-size: 24px; font-weight: bold; animation: fly 1s forwards; z-index: 100; text-shadow: 2px 2px #000; pointer-events: none; color: var(--gold); }
        @keyframes fly { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-80px); } }
    </style>
</head>
<body>

    <div id="death-screen" class="overlay">
        <h1 style="color:var(--red); font-size: 30px; margin-bottom: 10px;">ВЫ ПАЛИ В БОЮ</h1>
        <p>Вальхалла закрыта на:</p>
        <h2 id="ban-timer" style="font-size: 32px; color:var(--gold)">60:00</h2>
    </div>

    <div class="header">
        <div style="color:var(--gold); padding: 5px;" onclick="admTrig()">STG: <span id="lvl">1</span></div>
        <div style="color:var(--purple)">HERO: <span id="h-lvl">1</span></div>
        <div onclick="openF()" style="color:var(--accent); font-weight:bold; cursor:pointer">PTS: <span id="pts-val">0</span></div>
    </div>
    <div id="exp-bar"><div id="exp-fill"></div></div>

    <div class="arena">
        <div class="char-box">
            <img src="hero1.png" class="p-icon" style="border-color:var(--accent)">
            <div class="bar-bg"><div id="hp-p-fill" class="bar-fill" style="background:var(--accent)"></div><div id="hp-p-txt" class="bar-txt">100/100</div></div>
            <div class="skill-bar"><div id="p-skill-fill" class="skill-fill" style="background:var(--blue)"></div></div>
        </div>
        <div class="char-box">
            <img id="m-icon" src="mob1.png" class="p-icon" style="border-color:var(--red)">
            <div class="bar-bg"><div id="hp-e-fill" class="bar-fill" style="background:var(--red)"></div><div id="hp-e-txt" class="bar-txt">100/100</div></div>
            <div class="skill-bar" id="e-skill-wrap"><div id="e-skill-fill" class="skill-fill" style="background:var(--purple)"></div></div>
        </div>
    </div>

    <div class="game-space">
        <div id="grid-container"></div>
        <button id="thor-btn" onclick="useThor()">МОЛОТ ТОРА</button>
    </div>

    <div id="admin-overlay" class="overlay" style="z-index: 2000;">
        <div class="card">
            <h3 style="margin:0 0 10px 0">ОДИН ПОМОЖЕТ</h3>
            <input type="number" id="jump-lvl" placeholder="Этап" style="width:90%; padding:10px; margin-bottom:10px;">
            <button class="menu-btn" onclick="jumpTo()">ПЕРЕЙТИ</button>
            <button class="menu-btn" onclick="resurrect()" style="background:var(--blue); color:#fff">ВОСКРЕСИТЬ (СНЯТЬ БАН)</button>
            <button class="menu-btn" onclick="closeO()" style="background:#444; color:#fff">ЗАКРЫТЬ</button>
        </div>
    </div>

    <div id="f-menu" class="overlay"><div class="card"><h2>КУЗНИЦА</h2><button class="menu-btn" onclick="buy('atk')">УРОН +2</button><button class="menu-btn" onclick="buy('hp')">ОЗ +20</button><button class="menu-btn" onclick="buy('agi')">ЛОВКОСТЬ +1%</button><button class="menu-btn" onclick="closeO()">ЗАКРЫТЬ</button></div></div>

<script>
    let st = {
        lvl: parseInt(localStorage.getItem('v_lvl')) || 1,
        hLvl: parseInt(localStorage.getItem('v_hlvl')) || 1,
        exp: parseInt(localStorage.getItem('v_exp')) || 0,
        mExp: 600, atk: parseInt(localStorage.getItem('v_atk')) || 10,
        mHP: parseInt(localStorage.getItem('v_mhp')) || 100,
        agi: parseInt(localStorage.getItem('v_agi')) || 5,
        pts: parseInt(localStorage.getItem('v_pts')) || 0,
        banUntil: parseInt(localStorage.getItem('v_ban')) || 0,
        thor: 0, hp: 100, ehp: 100, mehp: 100, board: [], sel: null, lock: false, eSkill: 0, combo: 1, adm: 0
    };

    function sfx(n) { new Audio(`${n}.mp3`).play().catch(()=>{}); }

    function checkBan() {
        const now = Date.now();
        if (st.banUntil > now) {
            document.getElementById('death-screen').style.display = 'flex';
            const diff = Math.ceil((st.banUntil - now) / 1000);
            const m = Math.floor(diff / 60);
            const s = diff % 60;
            document.getElementById('ban-timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            setTimeout(checkBan, 1000);
            return true;
        } else {
            document.getElementById('death-screen').style.display = 'none';
            return false;
        }
    }

    function init() {
        if (checkBan()) return;
        const isB = st.lvl % 25 === 0;
        st.mehp = isB ? (100 + st.lvl * 75) * 6 : 100 + st.lvl * 75;
        st.ehp = st.mehp; st.eSkill = 0; st.mExp = st.hLvl * 600;
        document.getElementById('m-icon').src = isB ? `boss${st.lvl/25}.png` : `mob${Math.min(Math.floor((st.lvl-1)/5)+1, 15)}.png`;
        document.getElementById('e-skill-wrap').style.visibility = isB ? 'visible' : 'hidden';
        
        const g = document.getElementById('grid-container'); g.innerHTML = ''; st.board = [];
        for (let i = 0; i < 49; i++) {
            st.board.push({type: Math.floor(Math.random() * 5), frozen: 0, light: 0});
            let c = document.createElement('div'); c.className = 'cell'; c.id = 'c-' + i;
            c.onclick = () => handle(i); g.appendChild(c);
        }
        draw();
    }

    function draw() {
        document.getElementById('pts-val').innerText = st.pts;
        document.getElementById('lvl').innerText = st.lvl;
        document.getElementById('h-lvl').innerText = st.hLvl;
        document.getElementById('exp-fill').style.width = (st.exp/st.mExp*100)+'%';
        document.getElementById('hp-e-fill').style.width = (st.ehp/st.mehp*100)+'%';
        document.getElementById('hp-e-txt').innerText = Math.floor(st.ehp) + "/" + st.mehp;
        document.getElementById('hp-p-fill').style.width = (st.hp/st.mHP*100)+'%';
        document.getElementById('hp-p-txt').innerText = Math.floor(st.hp) + "/" + st.mHP;
        document.getElementById('p-skill-fill').style.width = st.thor + "%";
        document.getElementById('e-skill-fill').style.width = st.eSkill + "%";
        document.getElementById('thor-btn').className = st.thor >= 100 ? 'ready' : '';

        st.board.forEach((o, i) => {
            const c = document.getElementById('c-' + i);
            c.style.backgroundImage = o.type === -1 ? 'none' : `url(rune${o.type+1}.png)`;
            c.className = `cell ${st.sel === i ? 'selected' : ''} ${o.frozen > 0 ? 'frozen' : ''} ${o.light > 0 ? 'light' : ''}`;
            if(o.light > 0) c.innerHTML = `<div class="timer-badge">${o.light}</div>`;
            else if(o.frozen > 0) c.innerHTML = `<div class="timer-badge" style="background:var(--blue)">${o.frozen}</div>`;
            else c.innerHTML = '';
        });
    }

    function handle(i) {
        if (st.lock || st.board[i].frozen > 0) return;
        if (st.sel === null) { st.sel = i; draw(); }
        else {
            let a = st.sel, b = i;
            if ((Math.abs(a-b)===1 && Math.floor(a/7)===Math.floor(b/7)) || Math.abs(a-b)===7) {
                st.lock = true; swap(a, b);
                if (!checkMatchesSimple()) { setTimeout(() => { swap(a, b); st.lock = false; st.sel = null; draw(); }, 300); }
                else { sfx('swap'); st.sel = null; resolveBoard(); }
            } else { st.sel = i; draw(); }
        }
    }

    function swap(a, b) { let t = {...st.board[a]}; st.board[a] = {...st.board[b]}; st.board[b] = t; }
    function checkMatchesSimple() {
        for (let r=0; r<7; r++) for (let c=0; c<5; c++) {
            let i = r*7+c; if (st.board[i].type!==-1 && st.board[i].type===st.board[i+1].type && st.board[i].type===st.board[i+2].type) return true;
        }
        for (let c=0; c<7; c++) for (let r=0; r<5; r++) {
            let i = r*7+c; if (st.board[i].type!==-1 && st.board[i].type===st.board[i+7].type && st.board[i].type===st.board[i+14].type) return true;
        }
        return false;
    }

    async function resolveBoard() {
        st.combo = 1;
        while (true) {
            let toClear = new Set();
            let rowX = []; let colX = []; let boom = [];
            for (let r=0; r<7; r++) {
                let cnt=1;
                for (let c=0; c<7; c++) {
                    let i = r*7+c;
                    if (c<6 && st.board[i].type!==-1 && st.board[i].type===st.board[i+1].type) cnt++;
                    else {
                        if (cnt>=3) {
                            for(let k=0; k<cnt; k++) toClear.add(i-k);
                            if(cnt===4) rowX.push(r);
                            if(cnt>=5) boom.push(i-Math.floor(cnt/2));
                        }
                        cnt=1;
                    }
                }
            }
            for (let c=0; c<7; c++) {
                let cnt=1;
                for (let r=0; r<7; r++) {
                    let i = r*7+c;
                    if (r<6 && st.board[i].type!==-1 && st.board[i].type===st.board[i+7].type) cnt++;
                    else {
                        if (cnt>=3) {
                            for(let k=0; k<cnt; k++) toClear.add(i-k*7);
                            if(cnt===4) colX.push(c);
                            if(cnt>=5) boom.push(i-Math.floor(cnt/2)*7);
                        }
                        cnt=1;
                    }
                }
            }
            if (toClear.size === 0) break;
            rowX.forEach(r => { for(let c=0; c<7; c++) toClear.add(r*7+c); });
            colX.forEach(c => { for(let r=0; r<7; r++) toClear.add(r*7+c); });
            boom.forEach(ctr => { for(let r=-1; r<=1; r++) for(let c=-1; c<=1; c++) { let idx=ctr+r*7+c; if(idx>=0&&idx<49) toClear.add(idx); } });

            sfx('match');
            let d = Math.floor(toClear.size * st.atk * (1 + (st.combo-1)*0.35));
            st.ehp -= d; st.exp += d; st.thor = Math.min(100, st.thor + toClear.size * 2);
            pop(d + (st.combo>1?` x${st.combo}`:''));
            checkExp();
            toClear.forEach(i => { st.board[i].type = -1; st.board[i].light = 0; st.board[i].frozen = 0; });
            draw(); await new Promise(r => setTimeout(r, 250));
            fillBoard();
            draw(); await new Promise(r => setTimeout(r, 250));
            st.combo++;
        }
        st.lock = false;
        if (st.ehp <= 0) win(); else enemyTurn();
    }

    function fillBoard() {
        for (let c=0; c<7; c++) {
            let e=0;
            for (let r=6; r>=0; r--) {
                let i = r*7+c;
                if (st.board[i].type === -1) e++;
                else if (e > 0) { st.board[i+e*7] = {...st.board[i]}; st.board[i].type = -1; }
            }
            for (let r=0; r<e; r++) st.board[r*7+c] = {type: Math.floor(Math.random()*5), frozen:0, light:0};
        }
    }

    function checkExp() {
        if (st.exp >= st.mExp) {
            st.exp -= st.mExp; st.hLvl++; st.pts++; st.mExp = st.hLvl * 600;
            pop("LVL UP!"); save();
        }
    }

    function enemyTurn() {
        const isB = st.lvl % 25 === 0;
        let d = Math.floor(5 + st.lvl * 2.2);
        if (isB) {
            st.eSkill += 25;
            if (st.eSkill >= 100) {
                st.eSkill = 0;
                if (st.lvl === 25) { for(let i=0; i<3; i++) st.board[Math.floor(Math.random()*49)].frozen = 3; pop("ICE!"); }
                if (st.lvl === 50) { d *= 3; pop("CRIT!"); }
                if (st.lvl === 75) { for(let i=0; i<3; i++) st.board[Math.floor(Math.random()*49)].light = 4; pop("LIGHT!"); }
            }
        }
        st.board.forEach(o => {
            if (o.light > 0) {
                o.light--;
                if (o.light === 1) { st.ehp = Math.min(st.mehp, st.ehp + st.mehp*0.15); pop("HEAL"); o.light = 0; }
            }
            if (o.frozen > 0) o.frozen--;
        });
        if (Math.random()*100 > st.agi) st.hp -= d; else pop("MISS");
        if (st.hp <= 0) death();
        draw();
    }

    function death() {
        sfx('death');
        st.exp = Math.max(0, Math.floor(st.exp * 0.9));
        st.banUntil = Date.now() + (60 * 60 * 1000);
        save();
        checkBan();
    }

    function resurrect() {
        st.banUntil = 0;
        st.hp = st.mHP;
        save();
        document.getElementById('death-screen').style.display = 'none';
        init();
        closeO();
    }

    async function useThor() {
        if (st.thor < 100 || st.lock) return;
        sfx('thor'); st.thor = 0; st.lock = true;
        let d = st.atk * 15; st.ehp -= d; st.exp += d;
        pop(d + " [THOR]"); checkExp();
        for(let i=0; i<15; i++) st.board[Math.floor(Math.random()*49)].type = -1;
        fillBoard(); draw();
        setTimeout(() => { resolveBoard(); }, 400);
    }

    function pop(txt) {
        const p = document.createElement('div'); p.className = 'dmg-text';
        p.innerText = isNaN(txt) ? txt : "-"+txt;
        p.style.left = (Math.random()*40+30)+'%'; p.style.top = '30%';
        document.body.appendChild(p); setTimeout(() => p.remove(), 1000);
    }

    function win() {
        st.lvl++;
        st.pts++;
        // Восстановление 15% ХП после победы
        let heal = Math.floor(st.mHP * 0.15);
        st.hp = Math.min(st.mHP, st.hp + heal);
        pop("+"+heal+" HP");
        save(); init();
    }

    function save() { 
        localStorage.setItem('v_lvl', st.lvl); localStorage.setItem('v_hlvl', st.hLvl); localStorage.setItem('v_exp', st.exp);
        localStorage.setItem('v_atk', st.atk); localStorage.setItem('v_mhp', st.mHP); localStorage.setItem('v_agi', st.agi); 
        localStorage.setItem('v_pts', st.pts); localStorage.setItem('v_ban', st.banUntil);
    }

    function admTrig() { 
        st.adm++; 
        if(st.adm>=5) { 
            st.adm=0; 
            document.getElementById('admin-overlay').style.display='flex'; 
        } 
    }

    function jumpTo() { let l = parseInt(document.getElementById('jump-lvl').value); if(l>0){ st.lvl=l; save(); init(); closeO(); } }
    function openF() { document.getElementById('f-menu').style.display='flex'; }
    function closeO() { document.querySelectorAll('.overlay').forEach(e => { if(e.id !== 'death-screen') e.style.display='none'; }); }
    function buy(t) { if(st.pts>0){ if(t==='atk')st.atk+=2; if(t==='hp'){st.mHP+=20;st.hp+=20} if(t==='agi')st.agi++; st.pts--; draw(); save(); } }

    init();
</script>
</body>
</html>
