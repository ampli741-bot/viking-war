<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking RPG: Valkyrie 10% Heal</title>
    <style>
        :root { --gold: #ffd700; --accent: #2ecc71; --red: #e74c3c; --blue: #3498db; --purple: #a55eea; --gray: #95a5a6; --shield: #5dade2; --ice: #a2d9ff; }
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; text-align: center; overflow: hidden; user-select: none; touch-action: manipulation; height: 100vh; display: flex; flex-direction: column; }

        .header { background: #111; height: 35px; display: flex; justify-content: space-around; align-items: center; border-bottom: 1px solid #333; font-size: 11px; z-index: 1001; }
        #exp-bar { width: 100%; height: 3px; background: #222; }
        #exp-fill { height: 100%; width: 0%; background: var(--purple); transition: 0.3s; }

        .arena { height: 28vh; background: #0a0a0a; border-bottom: 2px solid #444; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
        .char-box { width: 45%; display: flex; flex-direction: column; align-items: center; position: relative; }
        .p-icon { width: 85px; height: 85px; border-radius: 12px; border: 3px solid #444; background: #111; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .p-icon img { width: 100%; height: 100%; object-fit: cover; }
        
        .bar-bg { width: 100%; height: 12px; background: #222; border-radius: 4px; margin-top: 4px; border: 1px solid #444; position: relative; overflow: hidden; }
        .bar-fill { height: 100%; width: 100%; transition: 0.3s; }
        .bar-label { position: absolute; width: 100%; top: 0; left: 0; font-size: 9px; line-height: 12px; font-weight: bold; text-shadow: 1px 1px #000; pointer-events: none; }

        .game-space { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #050505; }
        #grid-container { width: 92vw; max-width: 340px; aspect-ratio: 1/1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: #111; padding: 6px; border-radius: 8px; border: 2px solid #333; }
        .cell { background-color: #1a1a1a; background-size: 85%; background-repeat: no-repeat; background-position: center; border: 1px solid #333; border-radius: 4px; position: relative; }
        
        .frozen { box-shadow: inset 0 0 12px var(--ice); border-color: var(--ice); filter: brightness(1.3); }
        .frozen::after { content: '❄️'; position: absolute; font-size: 10px; top: 1px; right: 1px; }
        .valk-mark { box-shadow: inset 0 0 15px var(--gold); border: 2px solid var(--gold); animation: pulse-v 0.8s infinite; }
        @keyframes pulse-v { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.8); } }

        #thor-btn { width: 90%; max-width: 350px; padding: 12px; margin: 10px 0; border-radius: 8px; border: 2px solid #333; background: #222; color: #555; font-weight: bold; font-size: 16px; transition: 0.3s; }
        #thor-btn.ready { color: #fff; border-color: #fff; box-shadow: 0 0 15px var(--blue); cursor: pointer; }

        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .card { background: #1a1a1a; border: 2px solid var(--gold); border-radius: 12px; padding: 15px; width: 85%; max-width: 350px; }
        .menu-btn { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }

        .dmg-text { position: absolute; font-size: 24px; font-weight: bold; animation: fly 1.2s forwards; z-index: 100; text-shadow: 2px 2px #000; pointer-events: none; }
        @keyframes fly { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px); } }
    </style>
</head>
<body>

    <div id="death-screen" class="overlay">
        <h1 style="color:var(--red);">ПАВШИЙ В БОЮ</h1>
        <h2 id="ban-timer" style="font-size: 40px; color:var(--gold)">60:00</h2>
        <div id="res-action-box" style="width: 80%;"></div>
    </div>

    <div class="header">
        <div onclick="admTrig()" style="cursor:pointer">STG: <span id="lvl">1</span></div>
        <div style="color:var(--accent)">HP: <span id="hp-val">100</span></div>
        <div style="color:var(--shield)">🛡️: <span id="sh-val">0</span></div>
        <div style="color:var(--purple); font-weight:bold;">🧴 <span id="bottles-val">0</span></div>
    </div>
    <div id="exp-bar"><div id="exp-fill"></div></div>

    <div class="arena">
        <div class="char-box">
            <div class="p-icon" style="border-color:var(--accent)" onclick="showInfo('hero')">
                <img src="hero1.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3534/3534065.png'">
            </div>
            <div class="bar-bg"><div id="sh-p-fill" class="bar-fill" style="background:var(--shield); width:0%"></div><div class="bar-label">ЩИТ</div></div>
            <div class="bar-bg" style="margin-top:2px;"><div id="hp-p-fill" class="bar-fill" style="background:var(--accent)"></div><div class="bar-label">HP</div></div>
        </div>
        <div class="char-box">
            <div class="p-icon" id="m-icon-box" style="border-color:var(--red)" onclick="showInfo('enemy')">
                <img id="enemy-img" src="" alt="mob">
            </div>
            <div class="bar-bg" id="e-skill-wrap"><div id="e-skill-fill" class="bar-fill" style="background:var(--purple); width:0%"></div><div class="bar-label">ЯРОСТЬ</div></div>
            <div class="bar-bg" style="margin-top:2px;"><div id="hp-e-fill" class="bar-fill" style="background:var(--red)"></div><div class="bar-label">HP ВРАГА</div></div>
        </div>
    </div>

    <div class="game-space">
        <div id="grid-container"></div>
        <button id="thor-btn" onclick="useThor()">МОЛОТ ТОРА</button>
    </div>

    <div id="loot-overlay" class="overlay">
        <div class="card">
            <h2 id="loot-title" style="margin:0;">ДОБЫЧА</h2>
            <div id="loot-desc" style="font-size:12px; color:var(--blue); margin:5px 0; font-weight:bold;"></div>
            <div id="loot-stats" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin:10px 0;">
                <div id="current-item" style="font-size:11px; padding:5px; background:#000; border:1px solid #333;"></div>
                <div id="new-item" style="font-size:11px; padding:5px; background:#000; border:1px solid #333;"></div>
            </div>
            <button class="menu-btn" style="background:var(--accent)" onclick="equipLoot()">ВЗЯТЬ</button>
            <button class="menu-btn" style="background:var(--red); color:#fff" onclick="closeLoot()">ВЫБРОСИТЬ</button>
        </div>
    </div>

    <div id="info-overlay" class="overlay" onclick="closeO()">
        <div class="card" onclick="event.stopPropagation()">
            <h2 id="info-name" style="color:var(--gold); margin:0;">Викинг</h2>
            <div id="info-stats" style="text-align:left; font-size:13px; margin:10px 0; line-height:1.4;"></div>
            <div id="info-equip" style="border-top:1px solid #333; padding-top:10px; font-size:11px; text-align:left;"></div>
            <button class="menu-btn" onclick="closeO()">ЗАКРЫТЬ</button>
        </div>
    </div>

<script>
    const TYPES = ["Пр. Рука", "Лев. Рука", "Шлем", "Грудь", "Ноги", "Кольцо"];
    const RARITY = ["Обычный", "Редкий", "Легендарный"];
    
    let st = {
        lvl: parseInt(localStorage.getItem('v_lvl')) || 1,
        hLvl: parseInt(localStorage.getItem('v_hlvl')) || 1,
        exp: parseInt(localStorage.getItem('v_exp')) || 0,
        bottles: parseInt(localStorage.getItem('v_bot')) || 0,
        banUntil: parseInt(localStorage.getItem('v_ban')) || 0,
        equip: JSON.parse(localStorage.getItem('v_equip')) || {},
        atk: 10, mHP: 100, mSH: 0, hp: 100, sh: 0, agi: 5, ehp: 100, mehp: 100,
        thor: 0, board: [], sel: null, lock: false, eSkill: 0, adm: 0, pendingItem: null,
        valkTimer: 0
    };

    function calcStats() {
        st.atk = 10 + (st.hLvl * 2); st.mHP = 100 + (st.hLvl * 20); st.mSH = 0; st.agi = 5;
        let hasTwoHand = st.equip["Пр. Рука"]?.twoHanded;
        Object.entries(st.equip).forEach(([slot, i]) => {
            if(i.atk) st.atk += (slot === "Пр. Рука" && i.twoHanded) ? Math.floor(i.atk * 2.2) : i.atk;
            if(i.hp) st.mHP += i.hp;
            if(i.shd) st.mSH += i.shd;
            if(i.agi) st.agi += i.agi;
        });
        if(hasTwoHand) delete st.equip["Лев. Рука"]; 
    }

    function init() {
        calcStats();
        if (checkBan()) return;
        const isB = st.lvl % 25 === 0;
        st.mehp = isB ? (100 + st.lvl * 95) * 6 : 100 + st.lvl * 95;
        st.ehp = st.mehp; st.eSkill = 0; st.valkTimer = 0;
        
        const img = document.getElementById('enemy-img');
        img.src = isB ? `boss${Math.floor(Math.random()*3)+1}.png` : `mob${Math.floor(Math.random()*15)+1}.png`;
        img.onerror = function() { this.src = 'https://cdn-icons-png.flaticon.com/512/606/606548.png'; };
        
        const g = document.getElementById('grid-container'); g.innerHTML = ''; st.board = [];
        for (let i = 0; i < 49; i++) {
            st.board.push({type: Math.floor(Math.random() * 5), frozen: false, valk: false});
            let c = document.createElement('div'); c.className = 'cell'; c.id = 'c-' + i;
            c.onclick = () => handle(i); g.appendChild(c);
        }
        draw();
    }

    function draw() {
        document.getElementById('lvl').innerText = st.lvl;
        document.getElementById('hp-val').innerText = Math.floor(st.hp);
        document.getElementById('sh-val').innerText = Math.floor(st.sh);
        document.getElementById('bottles-val').innerText = st.bottles;
        document.getElementById('exp-fill').style.width = (st.exp/(st.hLvl*600)*100)+'%';
        document.getElementById('hp-e-fill').style.width = (st.ehp/st.mehp*100)+'%';
        document.getElementById('hp-p-fill').style.width = (st.hp/st.mHP*100)+'%';
        document.getElementById('sh-p-fill').style.width = st.mSH > 0 ? (st.sh/st.mSH*100)+'%' : '0%';
        document.getElementById('e-skill-fill').style.width = st.eSkill + "%";
        
        const btn = document.getElementById('thor-btn');
        btn.className = st.thor >= 100 ? 'ready' : '';
        btn.style.background = `linear-gradient(90deg, var(--blue) ${st.thor}%, #222 ${st.thor}%)`;

        st.board.forEach((o, i) => {
            const c = document.getElementById('c-' + i);
            c.style.backgroundImage = o.type === -1 ? 'none' : `url(rune${o.type+1}.png)`;
            c.style.outline = st.sel === i ? '3px solid #fff' : 'none';
            c.classList.toggle('frozen', o.frozen);
            c.classList.toggle('valk-mark', o.valk);
        });
    }

    async function resolveBoard() {
        st.lock = true;
        let combo = 1;
        while (true) {
            let toClear = new Set();
            for(let r=0; r<7; r++) for(let c=0; c<7; c++) {
                let i = r*7+c;
                if(c<5 && st.board[i].type!==-1 && st.board[i].type===st.board[i+1].type && st.board[i].type===st.board[i+2].type) { toClear.add(i); toClear.add(i+1); toClear.add(i+2); }
                if(r<5 && st.board[i].type!==-1 && st.board[i].type===st.board[i+7].type && st.board[i].type===st.board[i+14].type) { toClear.add(i); toClear.add(i+7); toClear.add(i+14); }
            }
            if (toClear.size === 0) break;
            
            let d = Math.floor(toClear.size * st.atk * (1 + (combo-1)*0.2));
            st.ehp -= d; st.exp += d; st.thor = Math.min(100, st.thor + toClear.size * 2.2);
            pop("-"+d, 'var(--gold)');
            
            toClear.forEach(i => { st.board[i].type = -1; st.board[i].frozen = false; st.board[i].valk = false; }); 
            draw();
            await new Promise(r => setTimeout(r, 200));
            fillBoard(); draw(); await new Promise(r => setTimeout(r, 200));
            combo++;
        }
        
        if (st.ehp <= 0) {
            generateLoot(st.lvl % 25 === 0);
        } else {
            if(st.valkTimer > 0) {
                st.valkTimer--;
                if(st.valkTimer === 0) {
                    let marks = st.board.filter(o => o.valk).length;
                    if(marks > 0) {
                        let h = Math.floor(st.mehp * 0.10); // Исцеление 10%
                        st.ehp = Math.min(st.mehp, st.ehp + h);
                        pop("+"+h+" HP (ВАЛЬКИРИЯ)", "var(--accent)");
                        st.board.forEach(o => o.valk = false);
                    }
                }
            }
            enemyTurn();
        }
        st.lock = false;
    }

    function enemyTurn() {
        const isB = st.lvl % 25 === 0;
        let d = Math.floor(8 + st.lvl * 3);
        if(isB) {
            st.eSkill += 25;
            if(st.eSkill >= 100) {
                st.eSkill = 0;
                if(st.lvl === 15) {
                    pop("ЗАМОРОЗКА!", "var(--ice)");
                    for(let i=0; i<8; i++) st.board[Math.floor(Math.random()*49)].frozen = true;
                } else if(st.lvl === 75) {
                    pop("МЕТКА ВАЛЬКИРИИ!", "var(--gold)");
                    st.valkTimer = 3;
                    let found = 0;
                    while(found < 3) {
                        let r = Math.floor(Math.random()*49);
                        if(!st.board[r].valk) { st.board[r].valk = true; found++; }
                    }
                } else {
                    d *= 2.5; pop("КРИТ!", "var(--red)");
                }
            }
        }
        if(Math.random()*100 > st.agi) {
            if(st.sh > 0) { let sD = Math.min(st.sh, d); st.sh -= sD; d -= sD; pop("-"+sD, 'var(--shield)'); }
            if(d > 0) { st.hp -= d; pop("-"+d, 'var(--red)'); }
        } else pop("УКЛОН", '#fff');
        if(st.hp <= 0) { st.banUntil = Date.now() + 3600000; save(); checkBan(); }
        draw();
    }

    function handle(i) {
        if(st.lock || st.board[i].frozen) return;
        if(st.sel === null) { st.sel = i; draw(); }
        else {
            let a = st.sel, b = i;
            if(st.board[b].frozen) { st.sel = null; draw(); return; }
            if((Math.abs(a-b)===1 && Math.floor(a/7)===Math.floor(b/7)) || Math.abs(a-b)===7) {
                st.lock = true; swap(a,b); resolveBoard(); st.sel = null;
            } else { st.sel = i; draw(); }
        }
    }

    function swap(a, b) { 
        let t = st.board[a].type; st.board[a].type = st.board[b].type; st.board[b].type = t; 
        let v = st.board[a].valk; st.board[a].valk = st.board[b].valk; st.board[b].valk = v;
        let f = st.board[a].frozen; st.board[a].frozen = st.board[b].frozen; st.board[b].frozen = f;
    }

    function fillBoard() {
        for(let c=0; c<7; c++) {
            let e=0; for(let r=6; r>=0; r--) {
                let i=r*7+c; if(st.board[i].type===-1) e++; else if(e>0) { 
                    st.board[i+e*7].type=st.board[i].type; 
                    st.board[i+e*7].valk=st.board[i].valk; 
                    st.board[i+e*7].frozen=st.board[i].frozen;
                    st.board[i].type=-1; st.board[i].valk=false; st.board[i].frozen=false;
                }
            }
            for(let r=0; r<e; r++) st.board[r*7+c].type = Math.floor(Math.random()*5);
        }
    }

    async function useThor() {
        if(st.thor<100 || st.lock) return; st.lock=true; st.thor=0;
        let t = []; while(t.length<22) { let r=Math.floor(Math.random()*49); if(!t.includes(r)) t.push(r); }
        t.forEach(i => {
            st.board[i].type = -1; st.board[i].frozen = false; st.board[i].valk = false;
            document.getElementById('c-'+i).classList.add('thor-charge');
        });
        setTimeout(() => {
            let d = st.atk * 10; st.ehp -= d; pop(d + " [ТОР]", 'var(--blue)');
            t.forEach(i => document.getElementById('c-'+i).classList.remove('thor-charge'));
            fillBoard(); draw(); resolveBoard();
        }, 500);
    }

    function generateLoot(isB) {
        const type = TYPES[Math.floor(Math.random()*TYPES.length)];
        const rare = isB ? 2 : (Math.random() > 0.94 ? 2 : (Math.random() > 0.7 ? 1 : 0));
        const mult = (rare + 1) * (1 + st.lvl * 0.15);
        st.pendingItem = { type, rare, atk:0, hp:0, shd:0, agi:0, twoHanded: false };
        if(type === "Пр. Рука") { st.pendingItem.twoHanded = Math.random() > 0.5; st.pendingItem.atk = Math.floor((st.pendingItem.twoHanded ? 14 : 7) * mult); }
        else if(type === "Лев. Рука") { st.pendingItem.shd = Math.floor(55 * mult); st.pendingItem.hp = Math.floor(35 * mult); }
        else { st.pendingItem.hp = Math.floor(50 * mult); st.pendingItem.atk = Math.floor(3 * mult); }
        if(rare === 2) st.pendingItem.agi = 3;
        const cur = st.equip[type] || {atk:0, hp:0, shd:0, agi:0};
        document.getElementById('loot-title').innerText = RARITY[rare] + " " + type;
        document.getElementById('current-item').innerHTML = `БЫЛО:<br>⚔️${cur.atk||0} ❤️${cur.hp||0} 🛡️${cur.shd||0}`;
        document.getElementById('new-item').innerHTML = `СТАНЕТ:<br>⚔️${st.pendingItem.atk||0} ❤️${st.pendingItem.hp||0} 🛡️${st.pendingItem.shd||0}`;
        document.getElementById('loot-overlay').style.display='flex';
    }

    function equipLoot() {
        if(st.pendingItem.twoHanded) delete st.equip["Лев. Рука"];
        if(st.pendingItem.type === "Лев. Рука" && st.equip["Пр. Рука"]?.twoHanded) delete st.equip["Пр. Рука"];
        st.equip[st.pendingItem.type] = st.pendingItem;
        st.pendingItem = null; calcStats(); save(); closeLoot();
    }

    function pop(txt, col) {
        const p = document.createElement('div'); p.className = 'dmg-text';
        p.innerText = txt; p.style.color = col; p.style.left = '50%'; p.style.top = '30%';
        document.body.appendChild(p); setTimeout(() => p.remove(), 1200);
    }

    function checkBan() {
        const now = Date.now();
        if (st.banUntil > now) {
            document.getElementById('death-screen').style.display = 'flex';
            const btnBox = document.getElementById('res-action-box');
            btnBox.innerHTML = st.bottles > 0 ? `<button class="menu-btn" style="background:var(--purple); color:#fff;" onclick="useBottle()">🧴 ВОСКРЕСНУТЬ</button>` : `<p>Нужна бутылка!</p>`;
            let diff = Math.ceil((st.banUntil - now) / 1000);
            document.getElementById('ban-timer').innerText = `${Math.floor(diff/60)}:${(diff%60).toString().padStart(2,'0')}`;
            setTimeout(checkBan, 1000); return true;
        }
        document.getElementById('death-screen').style.display = 'none'; return false;
    }

    function closeLoot() { document.getElementById('loot-overlay').style.display = 'none'; if(st.ehp <= 0) winCleanup(); }
    function winCleanup() { st.lvl++; st.hp = Math.min(st.mHP, st.hp + Math.floor(st.mHP*0.2)); st.sh = Math.min(st.mSH, st.sh + Math.floor(st.mSH*0.3)); save(); init(); }

    function showInfo(type) {
        const n = document.getElementById('info-name'), s = document.getElementById('info-stats'), e = document.getElementById('info-equip');
        if(type==='hero') {
            n.innerText = "ГЕРОЙ (УР. "+st.hLvl+")";
            s.innerHTML = `⚔️ АТАКА: ${st.atk}<br>🛡️ ЩИТ: ${Math.floor(st.sh)}/${st.mSH}<br>❤️ HP: ${Math.floor(st.hp)}/${st.mHP}<br>🍃 ЛОВК: ${st.agi}%`;
            e.innerHTML = "<b>ИНВЕНТАРЬ:</b><br>" + TYPES.map(t => {
                let i = st.equip[t]; return i ? `<span class="rarity-${i.rare}">${t}: ⚔️${i.atk||0} 🛡️${i.shd||0}</span>` : `${t}: -`;
            }).join("<br>");
        } else {
            n.innerText = (st.lvl % 25 === 0) ? "БОСС ЭТАПА" : "ВРАГ";
            s.innerHTML = `⚔️ УРОН: ${Math.floor(8 + st.lvl * 3)}<br>❤️ HP: ${st.ehp}/${st.mehp}`;
        }
        document.getElementById('info-overlay').style.display='flex';
    }

    function save() {
        localStorage.setItem('v_lvl', st.lvl); localStorage.setItem('v_hlvl', st.hLvl);
        localStorage.setItem('v_exp', st.exp); localStorage.setItem('v_bot', st.bottles);
        localStorage.setItem('v_ban', st.banUntil); localStorage.setItem('v_equip', JSON.stringify(st.equip));
    }

    function admTrig() { st.adm++; if(st.adm>=5){ st.adm=0; let l = prompt("Этап:"); if(l){st.lvl=parseInt(l); save(); init();} } }
    function closeO() { document.querySelectorAll('.overlay').forEach(o => { if(o.id!=='death-screen') o.style.display='none'; }); }
    init();
</script>
</body>
</html>
