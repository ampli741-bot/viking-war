<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Ultra Stable</title>
    <style>
        :root { --gold: #f1c40f; --red: #e74c3c; --green: #2ecc71; }
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; text-align: center; overflow: hidden; touch-action: manipulation; }
        .header { background: #1a1a1a; padding: 10px; border-bottom: 2px solid #333; display: flex; justify-content: space-around; }
        .arena { height: 150px; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .hp-bar { width: 90%; height: 10px; background: #333; margin: 5px; border-radius: 5px; overflow: hidden; }
        .fill { height: 100%; transition: 0.3s; width: 100%; }
        #grid { display: grid; grid-template-columns: repeat(7, 42px); grid-template-rows: repeat(7, 42px); gap: 4px; justify-content: center; padding: 10px; background: #000; }
        .cell { width: 42px; height: 42px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; transition: 0.1s; border: 1px solid #222; box-sizing: border-box; }
        .sel { border: 3px solid #fff; transform: scale(0.9); box-shadow: 0 0 10px gold; }
        .btn { width: 90%; padding: 15px; margin-top: 10px; border: none; border-radius: 8px; background: #333; color: #555; font-weight: bold; }
        .ready { background: orange !important; color: #fff !important; }
        #ban-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #msg { position: absolute; background: rgba(0,0,0,0.9); width: 100%; padding: 20px 0; display: none; z-index: 100; color: gold; font-weight: bold; }
    </style>
</head>
<body>

<div id="ban-screen">
    <h2 style="color: var(--red);">ВЫ РАНЕНЫ</h2>
    <div id="timer" style="font-size: 40px; color: gold;">60:00</div>
</div>

<div class="header">
    <div id="best-display">РЕКОРД: 1</div>
    <div id="lvl-display" style="color: gold;">УРОВЕНЬ 1</div>
</div>

<div class="arena" id="battle-screen">
    <div id="msg"></div>
    <div class="hp-bar"><div id="ehp" class="fill" style="background: var(--red);"></div></div>
    <div id="mob-icon" style="font-size: 50px;">👹</div>
    <div class="hp-bar"><div id="php" class="fill" style="background: var(--green);"></div></div>
</div>

<div id="grid"></div>

<div style="height: 6px; width: 90%; background: #222; margin: 10px auto; border-radius: 3px;">
    <div id="en-fill" style="width: 0%; height: 100%; background: gold;"></div>
</div>
<button id="s-btn" class="btn" onclick="useSuper()">УДАР МОЛОТОМ</button>
