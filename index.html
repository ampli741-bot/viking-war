<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Boss Mob4</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; text-align: center; overflow: hidden; touch-action: manipulation; }
        #adm { display: none; background: #400; padding: 5px; font-size: 10px; position: sticky; top: 0; z-index: 1000; }
        .adm-btn { background: #fff; color: #000; border: none; padding: 3px 8px; margin: 0 3px; font-weight: bold; border-radius: 3px; }
        .header { background: #1a1a1a; padding: 10px; border-bottom: 2px solid #333; display: flex; justify-content: space-around; }
        .arena { height: 170px; background: #050505; position: relative; padding-top: 10px; overflow: hidden; }
        .hp-bar { width: 90%; height: 12px; background: #333; margin: 5px auto; border-radius: 6px; overflow: hidden; border: 1px solid #444; position: relative; }
        .fill { height: 100%; width: 100%; transition: 0.3s; }
        
        #boss-en-bar { width: 60%; height: 6px; background: #222; margin: 2px auto; border-radius: 3px; border: 1px solid #ff4500; display: none; overflow: hidden; }
        
        #mob-img { height: 90px; width: auto; transition: 0.5s; z-index: 2; filter: drop-shadow(0 0 5px rgba(255,0,0,0.3)); }
        .boss-glow { filter: drop-shadow(0 0 15px red) !important; }

        .ui { padding: 10px 0; background: #111; }
        .en-bar { width: 280px; height: 20px; background: #222; margin: 0 auto 5px; border-radius: 10px; overflow: hidden; position: relative; border: 1px solid #3498db; }
        #en-txt { position: absolute; width: 100%; font-size: 11px; line-height: 20px; color: #fff; font-weight: bold; z-index: 5; text-shadow: 1px 1px 2px #000; }

        .btn { width: 280px; padding: 12px; border: none; border-radius: 8px; background: #444; color: #888; font-weight: bold; }
        .ready { background: linear-gradient(orange, darkorange) !important; color: #fff !important; box-shadow: 0 0 15px gold; }
        
        #grid { width: 315px; margin: 5px auto; display: block; font-size: 0; }
        .cell { display: inline-block; width: 40px; height: 40px; margin: 2px; background-size: cover; background-color: #222; border-radius: 4px; border: 1px solid #333; vertical-align: top; box-sizing: border-box; }
        .sel { border: 2px solid #fff !important; transform: scale(0.85); box-shadow: 0 0 10px #fff; }
        #msg { position: fixed; top: 40%; width: 100%; background: rgba(0,0,0,0.9); color: gold; display: none; padding: 20px 0; font-size: 26px; z-index: 100; font-weight: bold; border-top: 2px solid gold; border-bottom: 2px solid gold; }
    </style>
</head>
<body>

    <div id="adm">
        <button class="adm-btn" onclick="changeLvl(-1)">-1 LVL</button>
        <button class="adm-btn" onclick="changeLvl(1)">+1 LVL</button>
        <button class="adm-btn" onclick="s.en=100;draw();">⚡ MAX</button>
    </div>

    <div class="header" onclick="admOn()">
        <span id="best-txt">РЕКОРД: 1</span> | <span id="lvl-txt" style="color:gold">УРОВЕНЬ 1</span>
    </div>

    <div class="arena" id="arena-bg">
        <div id="msg"></div>
        <div class="hp-bar"><div id="ehp" class="fill" style="background: #e74c3c;"></div></div>
        <div id="boss-en-bar"><div id="boss-en-fill" class="fill" style="background: #ff4500; width: 0%;"></div></div>
        <img id="mob-img" src="mob1.png" onerror="this.src='https://via.placeholder.com/90/red?text=MOB'">
        <div class="hp-bar"><div id="php" class="fill" style="background: #2ecc71;"></div></div>
    </div>

    <div class="ui">
        <div class="en-bar">
            <div id="en-txt">МОЛОТ: 0%</div>
            <div id="en-f" class="fill" style="background: #3498db; width: 0%;"></div>
        </div>
        <button id="s-btn" class="btn" onclick="useSuper()">УДАР МОЛОТОМ</button>
    </div>

    <div id="grid"></div>

<script>
    const runes = ['rune1.png', 'rune2.png', 'rune3.png', 'rune4.png', 'rune5.png'];
    const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6'];

    let s = {
        lvl: parseInt(localStorage.getItem('v_lvl')) || 1,
        en: parseInt(localStorage.getItem('v_en')) || 0,
        hp: 100, ehp: 100, maxEHP: 100, lock: false, board: [], sel: null,
        bossEn: 0
    };

    let audioCtx = null;
    let bossMusicNode = null;

    function play(f) { new Audio(f).play().catch(()=>{}); }

    // 8-битный генератор страшной музыки
    function startBossMusic() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (bossMusicNode) return;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            
            // Грозная низкая последовательность
            const notes = [73.42, 69.30, 65.41, 61.74]; // D2, C#2, C2, B1
            let i = 0;
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.value = 0.05;
            
            osc.start();
            bossMusicNode = { osc, gain };
            
            const loop = () => {
                if(!bossMusicNode) return;
                osc.frequency.setTargetAtTime(notes[i % notes.length], audioCtx.currentTime, 0.1);
                i++;
                setTimeout(loop, 600);
            };
            loop();
        } catch(e) {}
    }

    function stopBossMusic() {
        if (bossMusicNode) {
            bossMusicNode.osc.stop();
            bossMusicNode = null;
        }
    }

    let hits = 0;
    function admOn() { if(++hits >= 5) { localStorage.setItem('v_adm','1'); document.getElementById('adm').style.display='block'; } }
    
    function changeLvl(v) { s.lvl = Math.max(1, s.lvl + v); localStorage.setItem('v_lvl', s.lvl); init(); }

    function init() {
        stopBossMusic();
        if(localStorage.getItem('v_adm')) document.getElementById('adm').style.display='block';

        const isBoss = s.lvl % 25 === 0;
        let mobFile = 'mob1.png';
        
        if (isBoss) {
            mobFile = 'mob4.png';
            document.getElementById('boss-en-bar').style.display = 'block';
            document.getElementById('mob-img').classList.add('boss-glow');
            document.getElementById('arena-bg').style.background = '#1a0000';
            startBossMusic();
        } else {
            document.getElementById('boss-en-bar').style.display = 'none';
            document.getElementById('mob-img').classList.remove('boss-glow');
            document.getElementById('arena-bg').style.background = '#050505';
            let cycle = s.lvl % 25;
            if (cycle > 8 && cycle <= 16) mobFile = 'mob2.png';
            else if (cycle > 16) mobFile = 'mob3.png';
        }

        document.getElementById('mob-img').src = mobFile;
        document.getElementById('mob-img').style.transform = isBoss ? "scale(1.7)" : "scale(1)";

        s.maxEHP = (100 + (s.lvl * 25)) * (isBoss ? 3 : 1);
        s.ehp = s.maxEHP;
        s.hp = 100;
        s.bossEn = 0;

        document.getElementById('lvl-txt').innerText = (isBoss ? "БОСС " : "УРОВЕНЬ ") + s.lvl;
        
        const g = document.getElementById('grid');
        g.innerHTML = ''; s.board = [];
        for (let i = 0; i < 49; i++) {
            s.board.push(Math.floor(Math.random() * 5));
            let d = document.createElement('div');
            d.className = 'cell'; d.id = 'c'+i;
            d.onclick = () => touch(i);
            g.appendChild(d);
        }
        draw();
    }

    function draw() {
        s.board.forEach((t, i) => {
            const el = document.getElementById('c'+i);
            if (!el) return;
            el.style.backgroundColor = t === -1 ? '#000' : colors[t];
            el.style.backgroundImage = t === -1 ? 'none' : `url(${runes[t]})`;
            el.classList.toggle('sel', s.sel === i);
        });
        document.getElementById('php').style.width = s.hp + '%';
        document.getElementById('ehp').style.width = (s.ehp / s.maxEHP * 100) + '%';
        
        document.getElementById('en-f').style.width = s.en + '%';
        document.getElementById('en-txt').innerText = `МОЛОТ: ${s.en}% (${Math.ceil((100-s.en)/5)} плиток)`;
        document.getElementById('boss-en-fill').style.width = s.bossEn + '%';
        
        document.getElementById('s-btn').className = 'btn' + (s.en >= 100 ? ' ready' : '');
        localStorage.setItem('v_lvl', s.lvl);
        localStorage.setItem('v_en', s.en);
    }

    async function touch(i) {
        if (s.lock) return;
        play('click.mp3'); 
        if (s.sel === null) { s.sel = i; draw(); }
        else {
            let a = s.sel, b = i;
            if (Math.abs(a - b) === 1 || Math.abs(a - b) === 7) {
                s.lock = true;
                [s.board[a], s.board[b]] = [s.board[b], s.board[a]];
                draw();
                if (!await check()) [s.board[a], s.board[b]] = [s.board[b], s.board[a]];
            }
            s.sel = null; s.lock = false; draw();
        }
    }

    async function check() {
        let found = false;
        while (true) {
            let del = new Set();
            for (let i = 0; i < 49; i++) {
                if (i % 7 < 5 && s.board[i] !== -1 && s.board[i] === s.board[i+1] && s.board[i] === s.board[i+2]) [i,i+1,i+2].forEach(x => del.add(x));
                if (i < 35 && s.board[i] !== -1 && s.board[i] === s.board[i+7] && s.board[i] === s.board[i+14]) [i,i+7,i+14].forEach(x => del.add(x));
            }
            if (del.size === 0) break;
            found = true;
            play('match.mp3');
            del.forEach(idx => {
                if (s.board[idx] === 1) s.en = Math.min(100, s.en + 5);
                if (s.board[idx] === 0) s.hp = Math.min(100, s.hp + 2);
                s.ehp -= 10;
                s.board[idx] = -1;
            });
            draw(); await new Promise(r => setTimeout(r, 200));
            drop(); draw(); await new Promise(r => setTimeout(r, 200));
        }
        if (found) {
            if (s.ehp <= 0) { 
                stopBossMusic();
                play('win.mp3');
                document.getElementById('msg').style.display='block';
                document.getElementById('msg').innerText = "БОСС ПОВЕРЖЕН!";
                setTimeout(() => { s.lvl++; init(); document.getElementById('msg').style.display='none'; }, 1500);
            } else enemy();
        }
        return found;
    }

    function drop() {
        for (let c = 0; c < 7; c++) {
            let empty = 0;
            for (let r = 6; r >= 0; r--) {
                let i = r * 7 + c;
                if (s.board[i] === -1) empty++;
                else if (empty > 0) { s.board[i+empty*7] = s.board[i]; s.board[i] = -1; }
            }
            for (let r = 0; r < empty; r++) s.board[r*7+c] = Math.floor(Math.random() * 5);
        }
    }

    function enemy() {
        let dmg = 5 + Math.floor(s.lvl/3);
        if (s.lvl % 25 === 0) {
            s.bossEn += 25;
            if (s.bossEn >= 100) {
                dmg *= 3;
                s.bossEn = 0;
                play('super.mp3');
                document.getElementById('arena-bg').style.background = 'red';
                setTimeout(()=>document.getElementById('arena-bg').style.background='#1a0000', 100);
            }
        }
        s.hp -= dmg;
        play('hit.mp3');
        if (s.hp <= 0) { stopBossMusic(); localStorage.setItem('v_ban', Date.now() + 3600000); location.reload(); }
        draw();
    }

    async function useSuper() {
        if (s.en < 100 || s.lock) return;
        s.lock = true; s.en = 0; s.ehp -= 150;
        play('super.mp3');
        for (let i = 0; i < 15; i++) s.board[Math.floor(Math.random()*49)] = -1;
        draw(); await new Promise(r => setTimeout(r, 300));
        drop(); await check();
        s.lock = false;
    }

    window.onload = init;
</script>
</body>
</html>
