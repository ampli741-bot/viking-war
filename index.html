<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Valhalla Rising</title>
    <style>
        :root { 
            --gold: #ffd700; --accent: #2ecc71; --red: #e74c3c; 
            --blue: #3498db; --purple: #a55eea; --white: #f5f6fa;
        }
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; text-align: center; overflow: hidden; user-select: none; touch-action: manipulation; }

        /* Интерфейс */
        .header { background: #1a1a1a; height: 60px; display: flex; justify-content: space-around; align-items: center; border-bottom: 3px solid #333; }
        .lvl-badge { color: var(--gold); font-size: 20px; font-weight: bold; cursor: pointer; }
        #pts-txt { font-weight: bold; padding: 8px 15px; border-radius: 8px; border: 1px solid #444; transition: 0.3s; }
        .has-pts { color: var(--accent); border-color: var(--accent); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0px var(--accent); } 50% { box-shadow: 0 0 15px var(--accent); } 100% { box-shadow: 0 0 0px var(--accent); } }

        /* Арена */
        .arena { max-width: 500px; height: 280px; margin: 0 auto; position: relative; background: #080808; overflow: hidden; border-bottom: 4px solid #222; }
        .boss-active { background: radial-gradient(circle, #400 0%, #000 100%) !important; }
        .abyss-active { background: radial-gradient(circle, #204 0%, #000 100%) !important; }
        .valkyrie-active { background: radial-gradient(circle, #442 0%, #000 100%) !important; }

        #mob-img { height: 190px; position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); z-index: 5; transition: 0.5s; filter: drop-shadow(0 0 15px #000); }
        
        .bar-wrap { width: 90%; height: 16px; background: #222; margin: 10px auto; border-radius: 8px; border: 2px solid #333; overflow: hidden; position: relative; z-index: 10; }
        .bar-fill { height: 100%; width: 100%; transition: 0.4s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        #boss-super-wrap { width: 70%; height: 6px; background: #111; margin: -5px auto 5px; border-radius: 3px; border: 1px solid #444; overflow: hidden; display: none; position: relative; z-index: 11; }
        #boss-en-fill { height: 100%; width: 0%; background: var(--purple); transition: 0.3s; }

        /* Поле */
        #grid { width: 322px; margin: 10px auto; background: #111; padding: 10px; border-radius: 15px; border: 4px solid #333; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .cell { width: 42px; height: 42px; background-size: 85%; background-repeat: no-repeat; background-position: center; background-color: #222; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .selected { border: 2px solid #fff; box-shadow: 0 0 15px #fff; transform: scale(0.9); }
        .locked { filter: grayscale(1) brightness(0.4); border: 2px solid var(--purple); pointer-events: none; animation: shake 0.3s infinite; }
        .holy { border: 2px solid var(--gold); box-shadow: inset 0 0 10px var(--gold); }
        @keyframes shake { 0%{transform:translateX(0)} 50%{transform:translateX(2px)} 100%{transform:translateX(0)} }

        /* Оверлеи */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; display: none; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .menu-btn { width: 240px; padding: 15px; margin: 8px; border-radius: 10px; background: #2a2a2a; color: #fff; font-weight: bold; border: 1px solid #444; cursor: pointer; }
        .buy-btn { background: var(--accent) !important; color: #000 !important; }
        
        .dmg-text { position: absolute; font-size: 32px; font-weight: 900; pointer-events: none; animation: flyUp 0.8s forwards; z-index: 200; text-shadow: 2px 2px #000; }
        @keyframes flyUp { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -100px); } }

        .super-container { width: 320px; margin: 5px auto; }
        #super-btn { width: 100%; padding: 14px; background: #222; color: #555; border: 2px solid #333; border-radius: 10px; font-weight: bold; font-size: 16px; }
        #super-btn.ready { background: var(--blue) !important; color: #fff !important; cursor: pointer; box-shadow: 0 0 15px var(--blue); }
    </style>
</head>
<body onclick="startMusic()">

    <div class="header">
        <div class="lvl-badge" onclick="adminClick()">УРОВЕНЬ <span id="lvl-val">1</span></div>
        <div id="pts-txt" onclick="openForge()">ОЧКИ: <span id="pts-val">0</span></div>
        <div onclick="openInfo()" style="cursor:pointer">📜</div>
    </div>

    <div class="arena" id="arena">
        <div class="bar-wrap"><div id="hp-e" class="bar-fill" style="background:var(--red)"></div></div>
        <div id="boss-super-wrap"><div id="boss-en-fill"></div></div>
        <img id="mob-img" src="mob1.png">
        <div class="bar-wrap"><div id="hp-p" class="bar-fill" style="background:var(--accent)"></div></div>

        <div id="forge-menu" class="overlay">
            <h2 style="color:var(--gold)">КУЗНИЦА ГНОМОВ</h2>
            <button class="menu-btn buy-btn" onclick="buyStat('atk')">АТАКА +2 (1 PTS)</button>
            <button class="menu-btn buy-btn" onclick="buyStat('hp')">ЖИЗНЬ +20 (1 PTS)</button>
            <button class="menu-btn buy-btn" onclick="buyStat('agi')">ЛОВКОСТЬ +1% (1 PTS)</button>
            <button class="menu-btn" onclick="closeMenus()">ЗАКРЫТЬ</button>
        </div>

        <div id="admin-menu" class="overlay">
            <h2 style="color:var(--red)">ODIN'S CONTROL</h2>
            <button class="menu-btn" onclick="jumpTo(25)">БОСС 25</button>
            <button class="menu-btn" onclick="jumpTo(50)">ДЕМОН БЕЗДНЫ (50)</button>
            <button class="menu-btn" onclick="jumpTo(75)">ВАЛЬКИРИЯ (75)</button>
            <button class="menu-btn" onclick="state.pts += 50; draw();">ДАЙ 50 ОЧКОВ</button>
            <button class="menu-btn" onclick="closeMenus()">ВЫХОД</button>
        </div>
    </div>

    <div class="super-container">
        <div style="width:100%; height:8px; background:#111; border-radius:4px; margin-bottom:5px; overflow:hidden;">
            <div id="en-fill" style="width:0%; height:100%; background:var(--blue); transition: 0.3s;"></div>
        </div>
        <button id="super-btn" onclick="activateSuper()">МОЛОТ ТОРА</button>
    </div>

    <div id="grid"></div>

<script>
    const audio = {
        click: new Audio('click.mp3'), match: new Audio('match.mp3'),
        hit: new Audio('hit.mp3'), win: new Audio('win.mp3'),
        super: new Audio('super.mp3'), bg: new Audio('track_normal.mp3'),
        bgBoss: new Audio('track_boss.mp3')
    };
    audio.bg.loop = true; audio.bgBoss.loop = true;

    let state = {
        lvl: parseInt(localStorage.getItem('v_lvl')) || 1,
        atk: parseInt(localStorage.getItem('v_atk')) || 10,
        mHP: parseInt(localStorage.getItem('v_mhp')) || 100,
        agi: parseInt(localStorage.getItem('v_agi')) || 5,
        pts: parseInt(localStorage.getItem('v_pts')) || 0,
        hp: 100, ehp: 100, mehp: 100, en: 0, bossEn: 0,
        board: [], lockedCells: [], holyCells: [], sel: null, isMusic: false, lock: false, adminHits: 0
    };

    function startMusic() { if(!state.isMusic) { state.isMusic=true; updateMusic(); } }

    function updateMusic() {
        if (!state.isMusic) return;
        if (state.lvl % 25 === 0) { audio.bg.pause(); audio.bgBoss.play(); } 
        else { audio.bgBoss.pause(); audio.bg.play(); }
    }

    function init() {
        const isB = state.lvl % 25 === 0;
        const mob = document.getElementById('mob-img');
        const arena = document.getElementById('arena');
        
        arena.className = 'arena'; 
        if(isB) arena.classList.add('boss-active');
        if(state.lvl === 50) arena.classList.add('abyss-active');
        if(state.lvl === 75) arena.classList.add('valkyrie-active');

        // Логика картинок
        if (isB) {
            if(state.lvl === 25) mob.src = 'boss1.png';
            else if(state.lvl === 50) mob.src = 'boss2.png';
            else if(state.lvl === 75) mob.src = 'boss3.png'; // Валькирия
            else mob.src = 'boss1.png';
        } else {
            let idx = Math.floor((state.lvl - 1) / 5) + 1;
            mob.src = `mob${Math.min(idx, 15)}.png`;
        }

        document.getElementById('boss-super-wrap').style.display = isB ? 'block' : 'none';
        state.mehp = (100 + (state.lvl * 60)) * (isB ? 6 : 1);
        state.ehp = state.mehp;
        state.hp = state.mHP;
        state.bossEn = 0;
        state.lockedCells = [];
        state.holyCells = [];

        const g = document.getElementById('grid');
        g.innerHTML = '';
        state.board = [];
        for (let i = 0; i < 49; i++) {
            let t = Math.floor(Math.random() * 5);
            state.board.push(t);
            let c = document.createElement('div');
            c.className = 'cell';
            c.id = 'c-' + i;
            c.style.backgroundImage = `url(rune${t + 1}.png)`;
            c.onclick = () => handleInput(i);
            g.appendChild(c);
        }
        updateMusic();
        draw();
    }

    function handleInput(i) {
        if (state.lock || state.lockedCells.includes(i)) return;
        if (state.isMusic) audio.click.play();
        if (state.sel === null) state.sel = i;
        else {
            let a = state.sel, b = i;
            if ((Math.abs(a - b) === 1 && Math.floor(a/7) === Math.floor(b/7)) || Math.abs(a - b) === 7) {
                [state.board[a], state.board[b]] = [state.board[b], state.board[a]];
                processMatches();
            }
            state.sel = null;
        }
        draw();
    }

    async function processMatches() {
        state.lock = true;
        let del = new Set();
        for (let i = 0; i < 49; i++) {
            if (i % 7 < 5 && state.board[i] !== -1 && state.board[i] === state.board[i+1] && state.board[i] === state.board[i+2]) { del.add(i); del.add(i+1); del.add(i+2); }
            if (i < 35 && state.board[i] !== -1 && state.board[i] === state.board[i+7] && state.board[i] === state.board[i+14]) { del.add(i); del.add(i+7); del.add(i+14); }
        }

        if (del.size > 0) {
            if (state.isMusic) audio.match.play();
            let totalDmg = del.size * state.atk;
            state.ehp -= totalDmg;
            popDmg(totalDmg, false);

            del.forEach(idx => {
                if (state.board[idx] === 1) state.en = Math.min(100, state.en + 7);
                // Если сбили святую руну Валькирии
                state.holyCells = state.holyCells.filter(c => c !== idx);
                state.board[idx] = -1;
            });

            draw();
            await new Promise(r => setTimeout(r, 300));
            gravity();
            draw();
            await new Promise(r => setTimeout(r, 300));
            processMatches();
        } else {
            state.lock = false;
            if (state.ehp <= 0) win(); else enemyTurn();
        }
    }

    function gravity() {
        for (let c = 0; c < 7; c++) {
            let empty = 0;
            for (let r = 6; r >= 0; r--) {
                let i = r * 7 + c;
                if (state.board[i] === -1) empty++;
                else if (empty > 0) { state.board[i + empty * 7] = state.board[i]; state.board[i] = -1; }
            }
            for (let r = 0; r < empty; r++) state.board[r * 7 + c] = Math.floor(Math.random() * 5);
        }
    }

    function enemyTurn() {
        const isB = state.lvl % 25 === 0;
        if (Math.random() * 100 < state.agi) { popDmg("УКЛОН", true); if(isB) state.bossEn += 10; } 
        else {
            let d = 10 + Math.floor(state.lvl / 2);

            // МЕХАНИКА ВАЛЬКИРИИ (75)
            if (state.lvl === 75 && state.bossEn >= 100) {
                if (state.holyCells.length > 0) {
                    let heal = Math.floor(state.mehp * 0.15);
                    state.ehp = Math.min(state.mehp, state.ehp + heal);
                    popDmg("ИСЦЕЛЕНИЕ!", false);
                }
                state.bossEn = 0;
                state.holyCells = [];
                for(let k=0; k<4; k++) state.holyCells.push(Math.floor(Math.random()*49));
                popDmg("ЩИТ СВЕТА", true);
            } 
            // МЕХАНИКА ДЕМОНА (50)
            else if (state.lvl === 50 && state.bossEn >= 100) {
                state.bossEn = 0;
                popDmg("ОСКВЕРНЕНИЕ", true);
                for(let k=0; k<6; k++) state.lockedCells.push(Math.floor(Math.random()*49));
                setTimeout(() => { state.lockedCells = []; draw(); }, 6000);
            }
            else if (isB && state.bossEn >= 100) {
                d *= 2.5; state.bossEn = 0; popDmg("КРИТ!", true);
            } else if (isB) { state.bossEn += 20; }

            state.hp -= Math.floor(d);
            if(state.isMusic) audio.hit.play();
            popDmg(Math.floor(d), true);
            if (state.hp <= 0) { alert("Вы пали в бою!"); location.reload(); }
        }
        draw();
    }

    function win() {
        if(state.isMusic) audio.win.play();
        state.lvl++; state.pts += (state.lvl % 5 === 0) ? 3 : 1;
        save(); init();
    }

    function draw() {
        document.getElementById('lvl-val').innerText = state.lvl;
        document.getElementById('pts-val').innerText = state.pts;
        document.getElementById('pts-txt').className = state.pts > 0 ? 'has-pts' : '';
        document.getElementById('hp-e').style.width = (state.ehp / state.mehp * 100) + '%';
        document.getElementById('hp-p').style.width = (state.hp / state.mHP * 100) + '%';
        document.getElementById('en-fill').style.width = state.en + '%';
        document.getElementById('boss-en-fill').style.width = state.bossEn + '%';
        
        const sBtn = document.getElementById('super-btn');
        if (state.en >= 100) sBtn.classList.add('ready'); else sBtn.classList.remove('ready');

        state.board.forEach((t, i) => {
            const c = document.getElementById('c-' + i);
            c.style.backgroundImage = t === -1 ? 'none' : `url(rune${t + 1}.png)`;
            c.classList.toggle('selected', state.sel === i);
            c.classList.toggle('locked', state.lockedCells.includes(i));
            c.classList.toggle('holy', state.holyCells.includes(i));
        });
    }

    function popDmg(v, p) {
        const d = document.createElement('div');
        d.className = 'dmg-text';
        d.innerText = (typeof v === 'number' ? '-' : '') + v;
        d.style.color = p ? 'var(--red)' : 'var(--gold)';
        d.style.left = '50%'; d.style.top = p ? '70%' : '30%';
        document.getElementById('arena').appendChild(d);
        setTimeout(() => d.remove(), 800);
    }

    function buyStat(t) {
        if(state.pts < 1) return;
        if(t==='atk') state.atk += 2;
        if(t==='hp') { state.mHP += 20; state.hp += 20; }
        if(t==='agi') state.agi += 1;
        state.pts--; save(); draw();
    }

    function activateSuper() {
        if(state.en < 100) return;
        state.en = 0; audio.super.play();
        state.ehp -= state.atk * 15;
        popDmg(state.atk * 15, false);
        for(let i=0; i<10; i++) state.board[Math.floor(Math.random()*49)] = -1;
        draw(); setTimeout(() => { gravity(); processMatches(); }, 400);
    }

    function openForge() { document.getElementById('forge-menu').style.display='flex'; }
    function openInfo() { alert(`АТК: ${state.atk}\nХП: ${state.mHP}\nЛОВК: ${state.agi}%`); }
    function closeMenus() { document.querySelectorAll('.overlay').forEach(o => o.style.display='none'); }
    function adminClick() { state.adminHits++; if(state.adminHits >= 5) { state.adminHits=0; document.getElementById('admin-menu').style.display='flex'; } }
    function jumpTo(l) { state.lvl = l; save(); closeMenus(); init(); }
    function save() {
        localStorage.setItem('v_lvl', state.lvl); localStorage.setItem('v_atk', state.atk);
        localStorage.setItem('v_mhp', state.mHP); localStorage.setItem('v_agi', state.agi);
        localStorage.setItem('v_pts', state.pts);
    }

    init();
</script>
</body>
</html>
