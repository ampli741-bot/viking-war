<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viking Saga: Final Stable</title>
    <style>
        :root { --gold: #f1c40f; --red: #e74c3c; --green: #2ecc71; }
        body { background: #111; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; touch-action: manipulation; }
        
        /* Шапка */
        #lvl-display { padding: 10px; color: var(--gold); font-size: 22px; font-weight: bold; background: #222; border-bottom: 2px solid #444; }
        
        /* Арена боя */
        .arena { height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: space-around; background: #1a1a1a; position: relative; }
        .mob-container { font-size: 60px; height: 80px; display: flex; align-items: center; justify-content: center; }
        
        /* Полоски HP */
        .hp-bar { width: 90%; height: 14px; background: #000; border: 1px solid #444; border-radius: 7px; overflow: hidden; position: relative; }
        .fill { height: 100%; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .hp-text { position: absolute; width: 100%; font-size: 10px; font-weight: bold; line-height: 14px; color: white; text-shadow: 1px 1px 0 black; z-index: 10; }

        /* Сетка */
        #grid { 
            display: grid; 
            grid-template-columns: repeat(7, 44px); 
            gap: 4px; 
            width: 332px; 
            margin: 10px auto; 
            padding: 8px;
            background: #222; 
            border-radius: 10px;
            box-shadow: inset 0 0 15px #000;
        }
        .cell { 
            width: 44px; height: 44px; 
            background-color: #333; 
            background-size: cover; 
            background-position: center;
            border-radius: 6px;
            transition: 0.2s;
        }
        .sel { outline: 3px solid white; transform: scale(0.9); box-shadow: 0 0 15px var(--gold); z-index: 5; }

        /* Кнопка и энергия */
        .en-bar { width: 332px; height: 10px; background: #222; margin: 10px auto; border-radius: 5px; border: 1px solid #333; overflow: hidden; }
        .btn { 
            width: 332px; padding: 16px; background: #444; color: #888; border: none; border-radius: 10px; 
            font-weight: bold; font-size: 18px; transition: 0.3s;
        }
        .ready { background: linear-gradient(180deg, #f1c40f, #d35400) !important; color: #fff !important; box-shadow: 0 5px 15px rgba(241, 196, 15, 0.4); cursor: pointer; }
        
        /* Бан */
        #ban-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        
        @keyframes shake { 0% { transform: translate(2px, 2px); } 100% { transform: translate(0,0); } }
        .shaking { animation: shake 0.1s infinite; }
    </style>
</head>
<body>

<div id="ban-screen">
    <h1 style="color: var(--red);">ВЫ ПАЛИ В БОЮ</h1>
    <p>Вальхалла закрыта на час. Отдыхайте:</p>
    <h2 id="timer" style="color: var(--gold);">60:00</h2>
</div>

<div id="lvl-display">УРОВЕНЬ 1</div>

<div class="arena" id="arena">
    <div class="hp-bar">
        <div class="hp-text" id="ehp-t">100 / 100</div>
        <div id="ehp" class="fill" style="background: var(--red); width: 100%;"></div>
    </div>
    <div class="mob-container" id="mob-view">👾</div>
    <div class="hp-bar">
        <div class="hp-text" id="php-t">100 / 100</div>
        <div id="php" class="fill"
